<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABM Tech Hub</title>
<meta name="description" content="ABM Tech Hub — أبحاث مبسطة في الطاقة الشمسية والمواتير والحساسات والبطاريات والذكاء الاصطناعي والبرمجة، بخمس لغات.">
<meta property="og:title" content="ABM Tech Hub">
<meta property="og:description" content="500 research articles on solar, motors, sensors, batteries, AI and computing — in Arabic, English, French, Spanish and German.">
<meta name="theme-color" content="#0071e3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230071e3'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EABM%3C/text%3E%3C/svg%3E">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f5f5f7;
    --bg-card:#ffffff;
    --text:#1d1d1f;
    --text-soft:#6e6e73;
    --text-faint:#86868b;
    --border:#d2d2d7;
    --accent:#0071e3;
    --accent-hover:#0077ed;
    --accent-soft:#e8f1fd;
    --dark-bg:#000000;
    --dark-text:#f5f5f7;
    --dark-text-soft:#a1a1a6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius:18px;
    --radius-sm:12px;
    --font-en:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-ar:'IBM Plex Sans Arabic','Inter',-apple-system,sans-serif;
    --tag-prac-bg:#fff3e0;
    --tag-prac-fg:#c26a00;
    --dom-solar:#2a78d6;
    --dom-motors:#eb6834;
    --dom-sensors:#1baf7a;
    --dom-batteries:#eda100;
    --dom-ai:#e87ba4;
    --dom-computing:#7c5cff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --bg-soft:#1d1d1f;
      --bg-card:#1d1d1f;
      --text:#f5f5f7;
      --text-soft:#a1a1a6;
      --text-faint:#86868b;
      --border:#424245;
      --accent:#2997ff;
      --accent-hover:#57adff;
      --accent-soft:#0a1f33;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --tag-prac-bg:#3a2a12;
      --tag-prac-fg:#ffb454;
      --dom-solar:#3987e5;
      --dom-motors:#d95926;
      --dom-sensors:#199e70;
      --dom-batteries:#c98500;
      --dom-ai:#d55181;
      --dom-computing:#9580ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --bg-soft:#1d1d1f;
    --bg-card:#1d1d1f;
    --text:#f5f5f7;
    --text-soft:#a1a1a6;
    --text-faint:#86868b;
    --border:#424245;
    --accent:#2997ff;
    --accent-hover:#57adff;
    --accent-soft:#0a1f33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --tag-prac-bg:#3a2a12;
    --tag-prac-fg:#ffb454;
    --dom-solar:#3987e5;
    --dom-motors:#d95926;
    --dom-sensors:#199e70;
    --dom-batteries:#c98500;
    --dom-ai:#d55181;
    --dom-computing:#9580ff;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ar);
    margin:0;
    padding-inline:0;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  html[dir="ltr"] body, body.lang-en{ font-family:var(--font-en); }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; font-weight:700; letter-spacing:-.01em;}
  p{margin:0;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  [hidden]{display:none!important;}
  button{font-family:inherit;}

  .wrap{ max-width:1120px; margin-inline:auto; padding-inline:20px; }
  .eyebrow{ font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
  html[dir="rtl"] .eyebrow{ letter-spacing:0; }

  /* ---------- nav ---------- */
  header.topnav{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:56px; gap:16px;}
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px; flex-shrink:0;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  nav.links{ display:flex; gap:28px; font-size:14px; font-weight:500; }
  nav.links a{ color:var(--text-soft); white-space:nowrap; }
  nav.links a:hover, nav.links a.active{ color:var(--text); }
  .nav-right{ display:flex; align-items:center; gap:12px; }
  .lang-toggle{
    display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; font-size:12px; font-weight:700;
  }
  .lang-toggle button{ border:0; background:transparent; color:var(--text-soft); padding:6px 12px; cursor:pointer; }
  .lang-toggle button.active{ background:var(--text); color:var(--bg); }
  .lang-select{
    border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700;
    background:var(--bg); color:var(--text); cursor:pointer; appearance:auto;
  }
  .burger{ display:none; border:0; background:transparent; cursor:pointer; padding:6px; color:var(--text); }
  .mobile-menu{ display:none; flex-direction:column; gap:2px; padding:8px 20px 16px; border-top:1px solid var(--border);}
  .mobile-menu a{ padding:10px 4px; color:var(--text-soft); font-size:15px; }
  @media (max-width:760px){
    nav.links{ display:none; }
    .burger{ display:inline-flex; }
    header.topnav.open .mobile-menu{ display:flex; }
  }

  /* ---------- generic sections ---------- */
  section.route{ padding-block:64px; }
  section.route.soft{ background:var(--bg-soft); }
  section.route.dark{ background:var(--dark-bg); color:var(--dark-text); }
  section.route.dark .text-soft{ color:var(--dark-text-soft); }

  .hero{ padding-block:88px 56px; }
  .hero h1{ font-size:clamp(32px,5.4vw,58px); line-height:1.08; }
  .hero p.lead{ font-size:clamp(16px,2vw,20px); color:var(--text-soft); max-width:640px; margin-top:18px; }
  .hero-actions{ display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }

  .btn{ display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ border-color:var(--text-soft); }
  .btn-sm{ padding:8px 16px; font-size:13px; }
  .btn-danger{ background:#ff3b30; color:#fff; }

  h2.section-title{ font-size:clamp(24px,3.4vw,36px); margin-top:8px; }
  .section-head{ max-width:640px; margin-bottom:36px; }
  .section-head p{ color:var(--text-soft); margin-top:12px; font-size:16px; }

  /* ---------- domain grid ---------- */
  .domain-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .domain-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; transition:transform .15s ease, box-shadow .15s ease; }
  .domain-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .domain-card .card-body{ padding:22px 24px 26px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .domain-card .icon{ width:40px; height:40px; color:var(--accent); }
  .domain-card h3{ font-size:19px; }
  .domain-card p{ color:var(--text-soft); font-size:14px; flex:1; }
  .domain-card .go{ font-size:13px; font-weight:700; color:var(--accent); }
  .icon-badge{ width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 16%, transparent); flex-shrink:0; }
  .icon-badge svg{ width:26px; height:26px; color:var(--c); }
  .dom-hero{ aspect-ratio:16/8; background:var(--bg-soft); display:block; }
  .dom-hero svg{ width:100%; height:100%; display:block; }
  .dom-hero-lg{ aspect-ratio:16/6; border-radius:var(--radius); overflow:hidden; background:var(--bg-soft); margin-top:22px; }
  .dom-hero-lg svg{ width:100%; height:100%; display:block; }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
  .pill-row a{ border:1px solid var(--border); border-radius:999px; padding:7px 16px; font-size:13px; color:var(--text-soft); }
  .pill-row a.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  /* ---------- material grid + detail ---------- */
  .material-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:28px; }
  .material-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:10px; }
  .material-card h4{ font-size:17px; }
  .material-card p{ color:var(--text-soft); font-size:14px; }
  .material-card .link{ font-size:13px; font-weight:700; color:var(--accent); margin-top:auto; }

  /* ---------- comparison sections (tech / motor-type quick-glance cards) ---------- */
  .compare-head{ margin-top:56px; margin-bottom:24px; max-width:680px; }
  .compare-head p{ color:var(--text-soft); margin-top:10px; font-size:15px; }
  .compare-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .compare-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:12px; }
  .compare-card h4{ font-size:16px; }
  .compare-card .stat-chip{ display:inline-flex; align-items:baseline; gap:6px; font-size:12px; color:var(--text-faint); background:var(--bg-soft); border-radius:999px; padding:5px 12px; align-self:flex-start; }
  .compare-card .stat-chip b{ font-size:13px; color:var(--text); font-variant-numeric:tabular-nums; }
  .compare-card p.blurb{ font-size:14px; color:var(--text-soft); }
  .proscons{ display:flex; flex-direction:column; gap:6px; margin-top:2px; }
  .proscons .row{ display:flex; align-items:flex-start; gap:8px; font-size:13px; }
  .proscons .row svg{ width:15px; height:15px; flex-shrink:0; margin-top:2px; }
  .proscons .row.pro svg{ color:#0ca30c; }
  .proscons .row.con svg{ color:#d03b3b; }
  .compare-card .link{ font-size:13px; font-weight:700; color:var(--accent); margin-top:auto; }

  .breadcrumb{ font-size:13px; color:var(--text-faint); margin-bottom:18px; }
  .breadcrumb a{ color:var(--text-soft); }
  .detail-title{ font-size:clamp(26px,4vw,42px); }
  .detail-summary{ color:var(--text-soft); font-size:17px; margin-top:14px; max-width:680px; }

  .split{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:40px; }
  @media (max-width:760px){ .split{ grid-template-columns:1fr; } }
  .panel{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:26px; }
  .panel .tag{ display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:999px; margin-bottom:14px; }
  .tag.sci{ background:var(--accent-soft); color:var(--accent); }
  .tag.prac{ background:var(--tag-prac-bg); color:var(--tag-prac-fg); }
  .deeper-panel{ margin-top:24px; border-style:dashed; }
  .deeper-panel .tag{ background:var(--bg-soft); color:var(--text-soft); }
  .detail-illustration{ max-width:420px; margin-top:24px; }
  .panel p{ font-size:15px; color:var(--text); }

  .specs{ margin-top:24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .spec{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
  .spec .k{ font-size:12px; color:var(--text-faint); }
  .spec .v{ font-size:15px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }

  .research-feed{ margin-top:44px; }
  .research-card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px 20px; margin-top:12px; }
  .research-main{ display:flex; gap:16px; align-items:flex-start; }
  .research-visual{ width:48px; height:48px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 16%, transparent); color:var(--c); }
  .research-visual svg{ width:24px; height:24px; }
  .research-body{ flex:1; min-width:0; }
  .research-card h5{ font-size:15px; }
  .research-card .meta{ font-size:12px; color:var(--text-faint); margin-top:4px; }
  .research-card p{ font-size:14px; color:var(--text-soft); margin-top:8px; }

  /* ---------- research illustrations + inline interactive widgets ---------- */
  .research-illustration{ aspect-ratio:300/130; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-soft); margin-top:16px; }
  .research-illustration svg{ width:100%; height:100%; display:block; }
  .research-card h5 a{ color:inherit; text-decoration:none; }
  .research-card h5 a:hover{ text-decoration:underline; }
  .research-card .readmore{ display:inline-block; margin-top:10px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; }
  .related-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:16px; }
  .related-card{ display:block; border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; text-decoration:none; transition:border-color .15s; }
  .related-card:hover{ border-color:var(--accent); }
  .related-card .eyebrow{ font-size:11px; }
  .related-card h5{ font-size:13px; margin-top:4px; color:var(--text); }

  .ixw{ margin-top:16px; background:var(--bg-soft); border-radius:var(--radius-sm); padding:14px 16px; }
  .ixw-q, .ixw-step-text, .ixw-flip-text{ font-size:14px; color:var(--text); margin-bottom:10px; }
  .ixw-label{ font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--text-faint); text-transform:uppercase; margin-bottom:8px; }
  .ixw-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .ixw-result{ margin-top:10px; font-size:13px; font-weight:600; }
  .ixw-result.ok{ color:#0ca30c; }
  .ixw-result.bad{ color:#d03b3b; }
  .ixw-bar-row{ cursor:pointer; margin-top:8px; }
  .ixw-bar-row:first-child{ margin-top:0; }
  .ixw-bar-label{ font-size:12px; color:var(--text-soft); margin-bottom:4px; }
  .ixw-bar-val{ font-size:12px; color:var(--text-faint); margin-top:3px; font-variant-numeric:tabular-nums; }
  .ixw-note{ margin-top:12px; font-size:13px; color:var(--text-soft); border-top:1px solid var(--border); padding-top:10px; }
  .empty-state{ border:1px dashed var(--border); border-radius:var(--radius-sm); padding:28px; text-align:center; color:var(--text-soft); margin-top:16px; font-size:14px; }

  .demo-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--text-faint); border:1px solid var(--border); border-radius:999px; padding:3px 10px; margin-top:14px;}
  .demo-badge .dot{width:6px;height:6px;border-radius:50%;background:#ff9f0a;}

  /* ---------- store ---------- */
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; margin-top:30px; }
  .product-card{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--bg-card); display:flex; flex-direction:column;}
  .product-media{ aspect-ratio:4/3; background:color-mix(in srgb, var(--c, var(--text-faint)) 14%, var(--bg-soft)); display:flex; align-items:center; justify-content:center; color:var(--c, var(--text-faint));}
  .product-media svg{ width:64px; height:64px; }
  .product-body{ padding:18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .product-body h4{ font-size:16px; }
  .product-body .price{ font-weight:700; font-size:15px; margin-top:auto; }
  .product-body .domain-tag{ font-size:12px; color:var(--accent); }

  /* ---------- admin ---------- */
  .admin-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:32px;}
  .stat-tile{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; background:var(--bg-card); }
  .stat-tile .num{ font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-tile .label{ font-size:12px; color:var(--text-faint); margin-top:4px; }
  .bar-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .bar-row .name{ width:120px; flex-shrink:0; font-size:13px; color:var(--text-soft); }
  .bar-track{ flex:1; height:10px; border-radius:999px; background:var(--bg-soft); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:999px; }
  .bar-row .val{ width:44px; text-align:end; font-size:13px; font-variant-numeric:tabular-nums; color:var(--text-soft); }

  form.admin-form{ display:grid; gap:14px; max-width:640px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .grid2{ grid-template-columns:1fr; } }
  label{ font-size:13px; font-weight:600; color:var(--text-soft); display:block; margin-bottom:6px; }
  input,select,textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px;
    background:var(--bg); color:var(--text); font-family:inherit;
  }
  textarea{ min-height:84px; resize:vertical; }
  .admin-note{ background:var(--accent-soft); color:var(--accent); border-radius:var(--radius-sm); padding:14px 18px; font-size:13px; margin-bottom:28px; }
  .manage-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 18px; margin-top:10px; }
  .manage-row .info h5{ font-size:14px; }
  .manage-row .info .meta{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .toast{ position:fixed; bottom:24px; inset-inline:0; display:flex; justify-content:center; z-index:80; pointer-events:none; }
  .toast .msg{ background:var(--text); color:var(--bg); padding:10px 20px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transform:translateY(8px); transition:.25s; }
  .toast .msg.show{ opacity:1; transform:translateY(0); }

  .wa-fab{ position:fixed; bottom:20px; inset-inline-end:20px; z-index:70; display:inline-flex; align-items:center; gap:8px; background:#1faa53; color:#fff; border-radius:999px; padding:12px 18px; font-size:14px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  .wa-fab:hover{ background:#178f45; }
  .wa-fab svg{ width:20px; height:20px; stroke:#fff; }
  @media (max-width:600px){ .wa-fab span{ display:none; } .wa-fab{ padding:14px; } }
  .btn-wa{ background:#1faa53; color:#fff; }
  .btn-wa:hover{ background:#178f45; }
  .btn-wa svg{ width:18px; height:18px; stroke:#fff; }
  .soon-badge{ display:inline-block; align-self:flex-start; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--tag-prac-bg); color:var(--tag-prac-fg); }
  footer{ border-top:1px solid var(--border); padding-block:40px; margin-top:20px; }
  footer .wrap{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--text-faint); }

  html.static-site [href="#admin"]{ display:none!important; }
  .icon{ width:22px; height:22px; }
  svg{ stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>

<header class="topnav" id="topnav">
  <div class="wrap nav-inner">
    <a href="#home" class="brand"><span class="dot"></span><span data-t="brand">ABM</span></a>
    <nav class="links">
      <a href="#home" data-route-link="home" data-t="nav.home">الرئيسية</a>
      <a href="#about" data-route-link="about" data-t="nav.about">من نحن</a>

/* In-card interactive widgets — a small generic set (not one bespoke
   build per article) so it scales: which widget renders is derived
   from the article's existing `visual` category, and each article only
   supplies the small data payload the widget needs via `interactive`. */
let IXW_DATA = {};

function renderTrueFalse(iv, uid){
  return `<div class="ixw" id="ixw-${uid}">
    <div class="ixw-label">${t('ix.tf')}</div>
    <p class="ixw-q">${escapeHtml(bi(iv.statement))}</p>
    <div class="ixw-actions">
      <button type="button" class="btn btn-ghost btn-sm" onclick="answerTF('${uid}', true)">${t('ix.true')}</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="answerTF('${uid}', false)">${t('ix.false')}</button>
    </div>
    <p class="ixw-result" id="ixw-result-${uid}" hidden></p>
  </div>`;
}
function answerTF(uid, guess){
  const data = IXW_DATA[uid]; if(!data) return;
  const correct = guess === data.answer;
  const el = document.getElementById('ixw-result-'+uid); if(!el) return;
  el.hidden = false;
  el.className = 'ixw-result ' + (correct ? 'ok' : 'bad');
  el.textContent = (correct ? t('ix.correct') : t('ix.wrong')) + bi(data.explain);
}

function renderSteps(iv, uid){
  return `<div class="ixw" id="ixw-${uid}">
    <div class="ixw-label" id="ixw-label-${uid}">${t('ix.step')} <span id="ixw-idx-${uid}">1</span>/${iv.steps.length}</div>
    <p class="ixw-step-text" id="ixw-text-${uid}">${escapeHtml(bi(iv.steps[0]))}</p>
    <div class="ixw-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="nextStep('${uid}')">${t('ix.next')}</button></div>
  </div>`;
}
function nextStep(uid){
  const data = IXW_DATA[uid]; if(!data) return;
  data._idx = ((data._idx||0)+1) % data.steps.length;
  const idxEl = document.getElementById('ixw-idx-'+uid), textEl = document.getElementById('ixw-text-'+uid);
  if(idxEl) idxEl.textContent = data._idx+1;
  if(textEl) textEl.textContent = bi(data.steps[data._idx]);
}

function renderFlip(iv, uid){
  return `<div class="ixw" id="ixw-${uid}">
    <div class="ixw-label">${t('ix.bonus')}</div>
    <p class="ixw-flip-text" id="ixw-flip-text-${uid}">${escapeHtml(bi(iv.front))}</p>
    <div class="ixw-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="flipCard('${uid}')">${t('ix.reveal')}</button></div>
  </div>`;
}
function flipCard(uid){
  const data = IXW_DATA[uid]; if(!data) return;
  data._flipped = !data._flipped;
  const el = document.getElementById('ixw-flip-text-'+uid); if(!el) return;
  el.textContent = data._flipped ? bi(data.back) : bi(data.front);
}

function renderBarCompare(iv, uid){
  const max = Math.max(iv.optionA.value, iv.optionB.value) || 1;
  const pctA = Math.round(iv.optionA.value/max*100), pctB = Math.round(iv.optionB.value/max*100);
  return `<div class="ixw" id="ixw-${uid}">
    <div class="ixw-label">${t('ix.compare')}</div>
    <div class="ixw-bar-row" onclick="selectBar('${uid}')">
      <div class="ixw-bar-label">${escapeHtml(bi(iv.optionA.label))}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctA}%"></div></div>
      <div class="ixw-bar-val">${iv.optionA.value}${escapeHtml(bi(iv.optionA.unit)||'')}</div>
    </div>
    <div class="ixw-bar-row" onclick="selectBar('${uid}')">
      <div class="ixw-bar-label">${escapeHtml(bi(iv.optionB.label))}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctB}%"></div></div>
      <div class="ixw-bar-val">${iv.optionB.value}${escapeHtml(bi(iv.optionB.unit)||'')}</div>
    </div>
    <p class="ixw-note" id="ixw-note-${uid}" hidden>${escapeHtml(bi(iv.note))}</p>
  </div>`;
}
function selectBar(uid){
  const data = IXW_DATA[uid]; if(!data) return;
  const el = document.getElementById('ixw-note-'+uid); if(!el) return;
  el.hidden = false;
  el.textContent = bi(data.note);
}

function interactiveWidget(r){
  if(!r.interactive) return '';
  const uid = 'ix_' + r.id;
  IXW_DATA[uid] = r.interactive;
  switch(r.visual){
    case 'mythbust': return renderTrueFalse(r.interactive, uid);
    case 'howitworks': return renderSteps(r.interactive, uid);
    case 'comparison': return renderBarCompare(r.interactive, uid);
    default: return renderFlip(r.interactive, uid);
  }
}

        scientific:{

          blurb:{ar:'بتحط طبقة بيروفسكايت فوق خلية سيليكون تقليدية، كل طبقة بتلقط جزء مختلف من طيف الضوء، فمجموع الاستفادة من الضوء بيبقى أعلى من أي طبقة لوحدها.', en:'Stacks a perovskite layer on top of a conventional silicon cell — each layer captures a different part of the light spectrum, so combined light usage beats either layer alone.', fr:'Une couche de pérovskite est empilée sur une cellule silicium classique. Chaque couche capte une partie différente du spectre lumineux, si bien que l\'ensemble exploite mieux la lumière que chacune séparément.', es:'Se apila una capa de perovskita sobre una célula de silicio convencional. Cada capa capta una parte distinta del espectro de la luz, así que juntas la aprovechan mejor que cualquiera por separado.', de:'Eine Perowskitschicht wird auf eine herkömmliche Siliziumzelle gestapelt. Jede Schicht nutzt einen anderen Teil des Lichtspektrums – zusammen holen sie mehr aus dem Licht heraus als jede für sich.'},

  {
    id:'motors', icon:'motors', color:'--dom-motors',
    name:{ar:'المواتير', en:'Motors', fr:'Moteurs', es:'Motores', de:'Motoren'},
    tagline:{ar:'تحويل الطاقة الكهربية إلى حركة دورانية.', en:'Turning electric power into rotational motion.', fr:'Transformer l\'électricité en mouvement de rotation.', es:'Convertir la electricidad en movimiento de giro.', de:'Strom in Drehbewegung verwandeln.'},
    intro:{ar:'أساسيات المواتير الكهربية المستخدمة في التطبيقات الصناعية والمنزلية، بمحتوى مبدئي هيتوسع لاحقًا.', en:'The basics of electric motors used across industrial and home applications — early content that will expand.', fr:'Les bases des moteurs électriques utilisés dans l\'industrie et à la maison. Un contenu de départ, appelé à s\'enrichir.', es:'Lo básico de los motores eléctricos que se usan en la industria y en casa. Contenido inicial que irá creciendo.', de:'Die Grundlagen der Elektromotoren in Industrie und Haushalt – ein erster Überblick, der weiter wachsen wird.'},
    materials:[
      {
        id:'dc-brushed',
        name:{ar:'موتور تيار مستمر فرشي', en:'Brushed DC Motor', fr:'Moteur à courant continu à balais', es:'Motor de corriente continua con escobillas', de:'Bürsten-Gleichstrommotor'},
        summary:{ar:'بسيط ورخيص، يحتاج صيانة دورية للفرش.', en:'Simple and cheap, needs periodic brush maintenance.', fr:'Simple et bon marché, mais ses balais demandent un entretien régulier.', es:'Sencillo y barato, pero las escobillas requieren mantenimiento periódico.', de:'Einfach und günstig, die Bürsten brauchen aber regelmäßige Wartung.'},
        scientific:{ar:'مجال مغناطيسي ثابت يتفاعل مع ملف دوار (armature) يتغذى بالتيار عبر فرش كربونية وحلقة تبديل (commutator) تعكس اتجاه التيار كل نصف دورة لإبقاء الدوران مستمرًا في اتجاه واحد.', en:'A fixed magnetic field interacts with a rotating armature fed through carbon brushes and a commutator that reverses current direction every half-turn to keep rotation continuous in one direction.', fr:'Un champ magnétique fixe agit sur un induit en rotation, alimenté par des balais en carbone et un collecteur qui inverse le sens du courant à chaque demi-tour pour que la rotation continue toujours dans le même sens.', es:'Un campo magnético fijo actúa sobre un inducido giratorio, alimentado mediante escobillas de carbón y un conmutador que invierte el sentido de la corriente cada media vuelta para que el giro siga siempre en la misma dirección.', de:'Ein feststehendes Magnetfeld wirkt auf einen rotierenden Anker. Dieser wird über Kohlebürsten und einen Kommutator gespeist, der die Stromrichtung bei jeder halben Umdrehung umkehrt, damit sich der Motor stets in dieselbe Richtung dreht.'},
        practical:{ar:'بسيط ورخيص وسهل التحكم في سرعته بتغيير الجهد، لكن الفرش تتآكل مع الوقت وتحتاج صيانة دورية، وهو مناسب للتطبيقات منخفضة التكلفة.', en:'Simple, cheap, and easy to speed-control by varying voltage, but the brushes wear over time and need periodic maintenance — a good fit for low-cost applications.', fr:'Simple, bon marché et facile à piloter en vitesse en faisant varier la tension. Mais les balais s\'usent avec le temps et doivent être entretenus régulièrement : un bon choix pour les applications à petit budget.', es:'Sencillo, barato y fácil de regular en velocidad variando la tensión. Pero las escobillas se desgastan con el tiempo y necesitan mantenimiento periódico: buena opción para aplicaciones de bajo coste.', de:'Einfach, günstig und per Spannungsänderung leicht in der Drehzahl zu regeln. Die Bürsten nutzen sich aber mit der Zeit ab und müssen regelmäßig gewartet werden – gut geeignet für preiswerte Anwendungen.'},
        specs:[{k:{ar:'كفاءة نمطية',en:'Typical efficiency', fr:'Rendement typique', es:'Eficiencia típica', de:'Typischer Wirkungsgrad'}, v:'75–85%'},{k:{ar:'الصيانة',en:'Maintenance', fr:'Entretien', es:'Mantenimiento', de:'Wartung'}, v:{ar:'دورية للفرش',en:'Periodic brush service', fr:'Entretien régulier des balais', es:'Revisión periódica de escobillas', de:'Regelmäßiger Bürstenservice'}}],
        illustration:'gear-spin'
      },
      {
        id:'bldc',
        name:{ar:'موتور BLDC بدون فرش', en:'Brushless DC (BLDC) Motor', fr:'Moteur Brushless DC (BLDC)', es:'Motor Brushless DC (BLDC)', de:'Brushless-DC-Motor (BLDC)'},
        summary:{ar:'كفاءة أعلى وعمر أطول، يحتاج وحدة تحكم إلكترونية.', en:'Higher efficiency and longer life, needs an electronic controller.', fr:'Rendement plus élevé et durée de vie accrue, mais nécessite un contrôleur électronique.', es:'Más eficiencia y vida útil más larga, pero necesita un controlador electrónico.', de:'Höherer Wirkungsgrad und längere Lebensdauer, braucht aber eine elektronische Steuerung.'},
        scientific:{ar:'يستبدل الفرش والحلقة الميكانيكية بتبديل إلكتروني (controller) يغذي ملفات ثابتة بترتيب متسلسل بناءً على موضع مغناطيس دوار، يُقاس عادة بحساسات هول.', en:'Replaces brushes and the mechanical commutator with an electronic controller that energizes fixed coils in sequence based on rotor position, usually measured with Hall sensors.', fr:'Les balais et le collecteur mécanique sont remplacés par un contrôleur électronique qui alimente des bobines fixes l\'une après l\'autre selon la position du rotor, généralement mesurée par des capteurs à effet Hall.', es:'Sustituye las escobillas y el conmutador mecánico por un controlador electrónico que alimenta bobinas fijas una tras otra según la posición del rotor, que suele medirse con sensores de efecto Hall.', de:'Bürsten und mechanischer Kommutator werden durch eine elektronische Steuerung ersetzt. Sie bestromt feststehende Spulen nacheinander, je nach Position des Rotors, die meist mit Hall-Sensoren gemessen wird.'},
        practical:{ar:'كفاءة أعلى وعمر تشغيلي أطول بدون تآكل ميكانيكي، وتحكم دقيق بالسرعة والعزم، لكنه أغلى ويحتاج وحدة تحكم إلكترونية (driver/ESC).', en:'Higher efficiency and longer working life with no mechanical wear, plus precise speed and torque control — but it costs more and needs an electronic driver/ESC.', fr:'Meilleur rendement et durée de vie plus longue, sans usure mécanique, avec un contrôle précis de la vitesse et du couple. En contrepartie, il coûte plus cher et exige un driver électronique (ESC, contrôleur électronique de vitesse).', es:'Más eficiencia y una vida útil más larga sin desgaste mecánico, además de un control preciso de velocidad y par. A cambio, cuesta más y necesita un driver electrónico (ESC, controlador electrónico de velocidad).', de:'Höherer Wirkungsgrad und längere Lebensdauer ohne mechanischen Verschleiß, dazu präzise Drehzahl- und Drehmomentregelung. Dafür ist er teurer und braucht einen elektronischen Treiber (ESC, elektronischer Drehzahlregler).'},
        specs:[{k:{ar:'كفاءة نمطية',en:'Typical efficiency', fr:'Rendement typique', es:'Eficiencia típica', de:'Typischer Wirkungsgrad'}, v:'85–95%'},{k:{ar:'يحتاج',en:'Requires', fr:'Nécessite', es:'Requiere', de:'Benötigt'}, v:{ar:'وحدة تحكم إلكترونية',en:'Electronic controller', fr:'Contrôleur électronique', es:'Controlador electrónico', de:'Elektronische Steuerung'}}],

      sub:{ar:'نظرة سريعة على أشهر أنواع المواتير المستخدمة صناعيًا، إزاي كل نوع بيشتغل، وأهم المواد المستخدمة فيه.', en:'A quick look at the most common motor types used industrially — how each one works, and the key materials inside it.', fr:'Un tour d\'horizon des moteurs les plus utilisés dans l\'industrie : comment chacun fonctionne et quels matériaux clés il contient.', es:'Un vistazo rápido a los motores más usados en la industria: cómo funciona cada uno y qué materiales clave lleva dentro.', de:'Ein kurzer Blick auf die gängigsten Industriemotoren – wie sie funktionieren und welche Schlüsselmaterialien in ihnen stecken.'},

          stat:{k:{ar:'أهم مادة',en:'Key material', fr:'Matériau clé', es:'Material clave', de:'Schlüsselmaterial'}, v:{ar:'فرش كربون + مغناطيس دائم',en:'Carbon brushes + permanent magnet', fr:'Balais en carbone + aimant permanent', es:'Escobillas de carbón + imán permanente', de:'Kohlebürsten + Permanentmagnet'}},
          blurb:{ar:'أبسط أنواع المواتير: مغناطيس ثابت وملف دوار بيتغذى عن طريق فرش كربونية بتلمس حلقة معدنية دايرة.', en:'The simplest motor type: a fixed magnet and a rotating coil fed through carbon brushes touching a spinning metal ring.', fr:'Le type de moteur le plus simple : un aimant fixe et une bobine en rotation, alimentée par des balais en carbone qui frottent sur un anneau métallique tournant.', es:'El tipo de motor más sencillo: un imán fijo y una bobina que gira, alimentada por escobillas de carbón que rozan un anillo metálico giratorio.', de:'Der einfachste Motortyp: ein feststehender Magnet und eine rotierende Spule, gespeist über Kohlebürsten, die auf einem sich drehenden Metallring schleifen.'},
          pros:[{ar:'رخيص وسهل التحكم فيه', en:'Cheap and easy to control', fr:'Bon marché et facile à piloter', es:'Barato y fácil de controlar', de:'Günstig und leicht zu steuern'}],
          cons:[{ar:'الفرش بتتآكل وتحتاج تغيير دوري', en:'Brushes wear down and need periodic replacement', fr:'Les balais s\'usent et doivent être remplacés régulièrement', es:'Las escobillas se desgastan y hay que cambiarlas cada cierto tiempo', de:'Bürsten verschleißen und müssen regelmäßig ersetzt werden'}],

          stat:{k:{ar:'أهم مادة',en:'Key material', fr:'Matériau clé', es:'Material clave', de:'Schlüsselmaterial'}, v:{ar:'مغناطيس نيوديميوم + وحدة تحكم',en:'Neodymium magnet + controller', fr:'Aimant néodyme + contrôleur', es:'Imán de neodimio + controlador', de:'Neodym-Magnet + Steuerung'}},
          blurb:{ar:'بيستبدل الفرش بمغناطيس دايم قوي ووحدة تحكم إلكترونية بتحدد توقيت التغذية، فمفيش احتكاك ميكانيكي خالص.', en:'Replaces brushes with a strong permanent magnet and an electronic controller that times the power feed — zero mechanical friction.', fr:'Les balais cèdent la place à un puissant aimant permanent et à un contrôleur électronique qui cadence l\'alimentation : zéro friction mécanique.', es:'Cambia las escobillas por un potente imán permanente y un controlador electrónico que sincroniza la alimentación: cero fricción mecánica.', de:'Statt Bürsten gibt es einen starken Permanentmagneten und eine elektronische Steuerung, die die Stromzufuhr taktet – ganz ohne mechanische Reibung.'},
          pros:[{ar:'كفاءة أعلى وعمر أطول بكتير', en:'Higher efficiency and a much longer life', fr:'Meilleur rendement et durée de vie bien plus longue', es:'Más eficiencia y una vida útil mucho más larga', de:'Höherer Wirkungsgrad und deutlich längere Lebensdauer'}],
          cons:[{ar:'أغلى ومحتاج وحدة تحكم إلكترونية', en:'More expensive and needs an electronic controller', fr:'Plus cher et nécessite un contrôleur électronique', es:'Más caro y necesita un controlador electrónico', de:'Teurer und benötigt eine elektronische Steuerung'}],

        {
          id:'ac-induction', name:{ar:'موتور الحث المتردد', en:'AC Induction Motor', fr:'Moteur asynchrone à courant alternatif', es:'Motor de inducción de corriente alterna', de:'Wechselstrom-Asynchronmotor'},
          stat:{k:{ar:'أهم مادة',en:'Key material', fr:'Matériau clé', es:'Material clave', de:'Schlüsselmaterial'}, v:{ar:'ملفات نحاس + قلب حديد صاج',en:'Copper windings + laminated steel core', fr:'Enroulements en cuivre + noyau en acier feuilleté', es:'Bobinados de cobre + núcleo de acero laminado', de:'Kupferwicklungen + geblechter Stahlkern'}},
          blurb:{ar:'بيدور من غير أي تلامس كهربي أو مغناطيس دائم خالص، التيار المتردد نفسه بيولّد مجال دوار بيسحب وراه جزء معدني (rotor) عن طريق تيارات مستحثة فيه.', en:'Spins with no electrical contact and no permanent magnet at all — the AC current itself creates a rotating field that drags a metal rotor along via currents induced inside it.', fr:'Il tourne sans aucun contact électrique ni aimant permanent : le courant alternatif crée lui-même un champ tournant qui entraîne un rotor métallique grâce aux courants induits à l\'intérieur de celui-ci.', es:'Gira sin ningún contacto eléctrico y sin imán permanente: la propia corriente alterna crea un campo giratorio que arrastra un rotor metálico gracias a las corrientes inducidas en su interior.', de:'Er dreht sich ganz ohne elektrischen Kontakt und ohne Permanentmagnet: Der Wechselstrom selbst erzeugt ein Drehfeld, das einen Metallrotor über darin induzierte Ströme mitzieht.'},
          pros:[{ar:'قوي، رخيص نسبيًا، وعمره طويل جدًا في الصناعة', en:'Rugged, relatively cheap, and very long-lived industrially', fr:'Robuste, relativement bon marché et très durable en milieu industriel', es:'Robusto, relativamente barato y muy duradero en la industria', de:'Robust, relativ günstig und in der Industrie sehr langlebig'}],
          cons:[{ar:'التحكم الدقيق في سرعته أصعب من الأنواع التانية', en:'Precise speed control is harder than other types', fr:'Un contrôle précis de la vitesse est plus difficile qu\'avec les autres types', es:'Controlar con precisión la velocidad es más difícil que con otros tipos', de:'Präzise Drehzahlregelung schwieriger als bei anderen Typen'}]
        },
        {
          id:'stepper', name:{ar:'الموتور الخطوي (Stepper)', en:'Stepper Motor', fr:'Moteur pas à pas', es:'Motor paso a paso', de:'Schrittmotor'},
          stat:{k:{ar:'أهم مادة',en:'Key material', fr:'Matériau clé', es:'Material clave', de:'Schlüsselmaterial'}, v:{ar:'أسنان مغناطيسية دقيقة + ملفات متعددة',en:'Precision magnetic teeth + multiple coils', fr:'Dents magnétiques de précision + plusieurs bobines', es:'Dientes magnéticos de precisión + varias bobinas', de:'Präzise Magnetzähne + mehrere Spulen'}},
          blurb:{ar:'بيدور بخطوات ثابتة ومحسوبة بدقة بدل الدوران المستمر، كل نبضة كهربية بتحركه خطوة واحدة بالظبط، فتقدر تعرف موضعه من غير ما تحتاج حساس إضافي.', en:'Rotates in precise, fixed steps instead of continuous spin — each electrical pulse moves it exactly one step, so you can track its position without an extra sensor.', fr:'Il tourne par pas précis et fixes plutôt qu\'en continu : chaque impulsion électrique le fait avancer d\'un pas exactement, ce qui permet de connaître sa position sans capteur supplémentaire.', es:'Gira en pasos fijos y precisos en lugar de hacerlo de forma continua: cada pulso eléctrico lo avanza exactamente un paso, así que puedes saber su posición sin un sensor adicional.', de:'Er dreht sich in exakten, festen Schritten statt kontinuierlich: Jeder elektrische Impuls bewegt ihn genau einen Schritt weiter, sodass sich seine Position ohne zusätzlichen Sensor verfolgen lässt.'},
          pros:[{ar:'تحكم دقيق جدًا في الموضع بدون حساسات إضافية', en:'Very precise position control with no extra sensors', fr:'Contrôle de position très précis sans capteur supplémentaire', es:'Control de posición muy preciso sin sensores adicionales', de:'Sehr präzise Positionierung ohne zusätzliche Sensoren'}],

          stat:{k:{ar:'أهم مادة',en:'Key material', fr:'Matériau clé', es:'Material clave', de:'Schlüsselmaterial'}, v:{ar:'موتور + حساس موضع + تغذية راجعة',en:'Motor + position sensor + feedback loop', fr:'Moteur + capteur de position + boucle de rétroaction', es:'Motor + sensor de posición + lazo de realimentación', de:'Motor + Positionssensor + Regelkreis'}},
          blurb:{ar:'مش نوع موتور مستقل بذاته، هو موتور (غالبًا DC أو BLDC) متجوز بحساس موضع ودائرة تغذية راجعة بتصحح نفسها باستمرار عشان توصل لموضع أو سرعة مطلوبة بالظبط.', en:'Not a standalone motor type, but a motor (usually DC or BLDC) paired with a position sensor and a feedback loop that keeps correcting itself to hit an exact target position or speed.', fr:'Ce n\'est pas un type de moteur à part entière, mais un moteur (en général DC ou BLDC) associé à un capteur de position et à une boucle de rétroaction qui se corrige sans cesse pour atteindre une position ou une vitesse cible exacte.', es:'No es un tipo de motor independiente, sino un motor (normalmente DC o BLDC) combinado con un sensor de posición y un lazo de realimentación que se corrige continuamente para alcanzar una posición o velocidad exacta.', de:'Kein eigener Motortyp, sondern ein Motor (meist DC oder BLDC) mit Positionssensor und Regelkreis, der sich ständig selbst korrigiert, um eine exakte Zielposition oder -drehzahl zu erreichen.'},
          pros:[{ar:'دقة عالية جدًا في التحكم بالموضع والسرعة', en:'Very high precision in position and speed control', fr:'Très grande précision de position et de vitesse', es:'Precisión muy alta en posición y velocidad', de:'Sehr hohe Präzision bei Position und Drehzahl'}],

        }
      ]

  {
    id:'sensors', icon:'sensors', color:'--dom-sensors',
    name:{ar:'الحساسات', en:'Sensors', fr:'Capteurs', es:'Sensores', de:'Sensoren'},
    tagline:{ar:'قياس العالم الفيزيائي وتحويله لإشارة كهربية.', en:'Measuring the physical world as an electrical signal.', fr:'Mesurer le monde physique sous forme de signal électrique.', es:'Medir el mundo físico como una señal eléctrica.', de:'Die physikalische Welt als elektrisches Signal messen.'},
    intro:{ar:'حساسات القياس الأساسية المستخدمة في الأتمتة الصناعية والمشاريع الكهربية، بمحتوى مبدئي هيتوسع لاحقًا.', en:'Core measurement sensors used in industrial automation and electrical projects — early content that will expand.', fr:'Les principaux capteurs de mesure utilisés en automatisation industrielle et dans les projets électriques. Un contenu de départ, appelé à s\'enrichir.', es:'Los sensores de medida básicos en la automatización industrial y en proyectos eléctricos. Contenido inicial que irá creciendo.', de:'Die wichtigsten Messsensoren für Industrieautomation und Elektroprojekte – ein erster Überblick, der weiter wachsen wird.'},
    materials:[
      {
        id:'thermo',
        name:{ar:'حساس الحرارة (ثرمستور/ثرموكابل)', en:'Temperature Sensor (Thermistor/Thermocouple)', fr:'Capteur de température (thermistance/thermocouple)', es:'Sensor de temperatura (termistor/termopar)', de:'Temperatursensor (Thermistor/Thermoelement)'},
        summary:{ar:'الثرمستور أدق لمدى محدود، والثرموكابل يتحمل حرارة أعلى بكثير.', en:'Thermistors are more precise over a limited range; thermocouples handle far higher heat.', fr:'La thermistance est plus précise sur une plage limitée ; le thermocouple supporte des chaleurs bien plus élevées.', es:'El termistor es más preciso en un rango limitado; el termopar aguanta temperaturas mucho más altas.', de:'Thermistoren sind in einem begrenzten Bereich genauer, Thermoelemente halten weit höhere Temperaturen aus.'},
        scientific:{ar:'الثرمستور مقاومة كهربية تتغير قيمتها بحدة مع الحرارة، بينما الثرموكابل يولّد جهدًا كهربيًا صغيرًا (تأثير سيبك) عند التقاء معدنين مختلفين في درجتي حرارة مختلفتين.', en:'A thermistor is a resistor whose value changes sharply with temperature, while a thermocouple generates a small voltage (the Seebeck effect) at the junction of two different metals at different temperatures.', fr:'Une thermistance est une résistance dont la valeur varie fortement avec la température. Un thermocouple, lui, génère une petite tension (l\'effet Seebeck) à la jonction de deux métaux différents portés à des températures différentes.', es:'Un termistor es una resistencia cuyo valor cambia mucho con la temperatura. Un termopar, en cambio, genera una pequeña tensión (el efecto Seebeck) en la unión de dos metales distintos que están a temperaturas diferentes.', de:'Ein Thermistor ist ein Widerstand, dessen Wert sich stark mit der Temperatur ändert. Ein Thermoelement erzeugt dagegen eine kleine Spannung (den Seebeck-Effekt) an der Verbindungsstelle zweier verschiedener Metalle mit unterschiedlicher Temperatur.'},
        practical:{ar:'الثرمستور أرخص وأدق في مدى محدود (منزلي/صناعي خفيف)، والثرموكابل يتحمل حرارة أعلى بكثير (تصل لآلاف الدرجات) ومناسب للتطبيقات الصناعية الثقيلة.', en:'Thermistors are cheaper and more precise over a limited range (home/light industrial); thermocouples handle far higher heat (up to thousands of degrees) and suit heavy industrial use.', fr:'Les thermistances sont moins chères et plus précises sur une plage limitée (usage domestique ou industrie légère). Les thermocouples supportent des températures bien plus élevées (jusqu\'à plusieurs milliers de degrés) et conviennent à l\'industrie lourde.', es:'Los termistores son más baratos y precisos en un rango limitado (uso doméstico o industria ligera). Los termopares soportan temperaturas mucho más altas (hasta miles de grados) y son ideales para la industria pesada.', de:'Thermistoren sind günstiger und in einem begrenzten Bereich genauer (Haushalt, leichte Industrie). Thermoelemente vertragen weit höhere Temperaturen (bis zu Tausenden Grad) und eignen sich für die Schwerindustrie.'},
        specs:[{k:{ar:'مدى الثرمستور',en:'Thermistor range', fr:'Plage de la thermistance', es:'Rango del termistor', de:'Messbereich Thermistor'}, v:'-40°C … 125°C'},{k:{ar:'مدى الثرموكابل',en:'Thermocouple range', fr:'Plage du thermocouple', es:'Rango del termopar', de:'Messbereich Thermoelement'}, v:{ar:'حتى 1800°م',en:'up to 1800°C', fr:'jusqu\'à 1800 °C', es:'hasta 1800 °C', de:'bis 1800 °C'}}],
        illustration:'cold-flake'
      },
      {
        id:'ir-sensor',
        name:{ar:'حساس الأشعة تحت الحمراء', en:'Infrared (IR) Sensor', fr:'Capteur infrarouge (IR)', es:'Sensor infrarrojo (IR)', de:'Infrarotsensor (IR)'},
        summary:{ar:'كشف حركة وقياس بدون تلامس، يتأثر بمصادر حرارة/ضوء أخرى.', en:'Contactless motion detection and measurement, sensitive to ambient heat/light.', fr:'Détection de mouvement et mesure sans contact, sensible à la chaleur et à la lumière ambiantes.', es:'Detección de movimiento y medición sin contacto, sensible al calor y la luz del entorno.', de:'Berührungslose Bewegungserkennung und Messung, empfindlich gegenüber Umgebungswärme und -licht.'},
        scientific:{ar:'يقيس الإشعاع الحراري المنبعث من الأجسام (IR غير مباشر) أو يعتمد على إرسال واستقبال حزمة IR لقياس وجود جسم أو مسافة (IR نشط)، ويُترجم التغير في الإشارة المستقبلة لقيمة رقمية.', en:'Measures thermal radiation emitted by objects (passive IR) or transmits and receives an IR beam to detect presence or distance (active IR), translating the received signal change into a digital value.', fr:'Il mesure le rayonnement thermique émis par les objets (IR passif) ou émet et reçoit un faisceau infrarouge pour détecter une présence ou une distance (IR actif), puis traduit la variation du signal reçu en valeur numérique.', es:'Mide la radiación térmica que emiten los objetos (IR pasivo) o emite y recibe un haz infrarrojo para detectar presencia o distancia (IR activo), y traduce el cambio de la señal recibida en un valor digital.', de:'Er misst die Wärmestrahlung von Objekten (passives IR) oder sendet und empfängt einen Infrarotstrahl, um Anwesenheit oder Abstand zu erkennen (aktives IR). Die Änderung des empfangenen Signals wird in einen digitalen Wert umgesetzt.'},
        practical:{ar:'يُستخدم في كشف الحركة، القياس عن بعد بدون تلامس، وأنظمة الأمان، لكنه يتأثر بمصادر حرارة أو ضوء أخرى في البيئة المحيطة.', en:'Used in motion detection, contactless remote measurement, and security systems — but it is sensitive to other ambient heat or light sources.', fr:'On l\'utilise pour la détection de mouvement, la mesure à distance sans contact et les systèmes de sécurité. Mais il est sensible aux autres sources de chaleur ou de lumière environnantes.', es:'Se usa en detección de movimiento, medición remota sin contacto y sistemas de seguridad, pero es sensible a otras fuentes de calor o de luz del entorno.', de:'Er kommt bei Bewegungserkennung, berührungsloser Fernmessung und Sicherheitssystemen zum Einsatz – reagiert aber empfindlich auf andere Wärme- oder Lichtquellen in der Umgebung.'},
        specs:[{k:{ar:'مدى الكشف النمطي',en:'Typical detection range', fr:'Portée de détection typique', es:'Alcance de detección típico', de:'Typische Erfassungsreichweite'}, v:{ar:'حتى عدة أمتار',en:'up to several meters', fr:'jusqu\'à plusieurs mètres', es:'hasta varios metros', de:'bis zu mehreren Metern'}}],
        illustration:'ir-beam'
      },
      {
        id:'ultrasonic',
        name:{ar:'الحساس بالموجات فوق الصوتية', en:'Ultrasonic Sensor', fr:'Capteur à ultrasons', es:'Sensor ultrasónico', de:'Ultraschallsensor'},
        summary:{ar:'بيقيس المسافة عن طريق حساب وقت رجوع صدى الصوت.', en:'Measures distance by timing how long a sound echo takes to return.', fr:'Mesure une distance en chronométrant le retour d\'un écho sonore.', es:'Mide la distancia cronometrando cuánto tarda en volver el eco de un sonido.', de:'Misst Abstände über die Laufzeit eines Schallechos.'},
        scientific:{ar:'الحساس بيطلق نبضة صوت عالية التردد (فوق مدى سمع الإنسان)، وبيقيس الزمن اللي بياخده الصدى عشان يرجعله بعد ما يرتد من أقرب جسم. بضرب الزمن ده في سرعة الصوت في الهواء وقسمته على اتنين، بيطلع المسافة بالظبط.', en:'The sensor emits a short high-frequency sound pulse, above the range of human hearing, and measures how long it takes for the echo to bounce back off the nearest object. Multiplying that time by the speed of sound in air and halving it gives the exact distance.', fr:'Le capteur émet une brève impulsion sonore à haute fréquence, inaudible pour l\'oreille humaine, puis mesure le temps que met l\'écho à revenir après avoir rebondi sur l\'objet le plus proche. En multipliant ce temps par la vitesse du son dans l\'air et en divisant par deux, on obtient la distance exacte.', es:'El sensor emite un breve pulso de sonido de alta frecuencia, inaudible para el oído humano, y mide cuánto tarda el eco en volver tras rebotar en el objeto más cercano. Si multiplicas ese tiempo por la velocidad del sonido en el aire y lo divides entre dos, obtienes la distancia exacta.', de:'Der Sensor sendet einen kurzen, hochfrequenten Schallimpuls oberhalb des menschlichen Hörbereichs aus und misst, wie lange das Echo vom nächstgelegenen Objekt zurück braucht. Diese Zeit multipliziert mit der Schallgeschwindigkeit in Luft und dann halbiert ergibt den genauen Abstand.'},
        practical:{ar:'شغال كويس مع كل أنواع الأسطح تقريبًا (حتى الشفافة أو السودا اللي بتوقع حساسات الليزر)، لكن أداؤه بيقل مع الأسطح اللي بتمتص الصوت زي القماش أو الإسفنج، وبيتأثر بدرجة الحرارة اللي بتغير سرعة الصوت شوية.', en:'Works well with almost any surface, including transparent or black ones that trip up laser sensors, but performance drops with sound-absorbing surfaces like fabric or foam, and it\'s mildly affected by temperature, which changes the speed of sound.', fr:'Il fonctionne bien sur presque toutes les surfaces, y compris transparentes ou noires, qui piègent les capteurs laser. En revanche, ses performances baissent face aux matériaux qui absorbent le son, comme le tissu ou la mousse, et il est légèrement influencé par la température, qui modifie la vitesse du son.', es:'Funciona bien con casi cualquier superficie, incluso transparentes o negras, que confunden a los sensores láser. Pero rinde peor con superficies que absorben el sonido, como la tela o la espuma, y la temperatura le afecta un poco, porque cambia la velocidad del sonido.', de:'Er funktioniert mit fast jeder Oberfläche, auch mit transparenten oder schwarzen, an denen Lasersensoren scheitern. Bei schallschluckenden Materialien wie Stoff oder Schaumstoff lässt die Leistung jedoch nach, und die Temperatur beeinflusst ihn leicht, weil sie die Schallgeschwindigkeit verändert.'},
        specs:[{k:{ar:'مدى الكشف النمطي',en:'Typical range', fr:'Portée typique', es:'Rango típico', de:'Typische Reichweite'}, v:{ar:'2 سم – 4 متر',en:'2cm – 4m', fr:'2 cm – 4 m', es:'2 cm – 4 m', de:'2 cm – 4 m'}},{k:{ar:'يتأثر بـ',en:'Affected by', fr:'Sensible à', es:'Le afecta', de:'Beeinflusst durch'}, v:{ar:'الحرارة والأسطح الماصة للصوت',en:'Temperature and sound-absorbing surfaces', fr:'La température et les surfaces absorbant le son', es:'La temperatura y las superficies que absorben el sonido', de:'Temperatur und schallschluckende Oberflächen'}}],
        illustration:'radar-pulse'
      }
    ]
  },

    tagline:{ar:'تخزين الطاقة الكهربية كيميائيًا لاستخدامها لاحقًا.', en:'Storing electric energy chemically for later use.', fr:'Stocker l\'énergie électrique sous forme chimique pour plus tard.', es:'Almacenar energía eléctrica de forma química para usarla después.', de:'Elektrische Energie chemisch speichern, um sie später zu nutzen.'},
    intro:{ar:'أنواع تخزين الطاقة الأساسية المرتبطة بمشاريع الطاقة الشمسية والتطبيقات الصناعية، بمحتوى مبدئي هيتوسع لاحقًا.', en:'Core energy storage types relevant to solar and industrial applications — early content that will expand.', fr:'Les principaux types de stockage d\'énergie utiles au solaire et à l\'industrie. Un contenu de départ, appelé à s\'enrichir.', es:'Los principales tipos de almacenamiento de energía para aplicaciones solares e industriales. Contenido inicial que irá creciendo.', de:'Die wichtigsten Energiespeicher für Solar- und Industrieanwendungen – ein erster Überblick, der weiter wachsen wird.'},

      {
        id:'lead-acid',
        name:{ar:'بطارية الرصاص الحمضية', en:'Lead-Acid Battery', fr:'Batterie plomb-acide', es:'Batería de plomo-ácido', de:'Blei-Säure-Batterie'},
        summary:{ar:'تكلفة منخفضة وموثوقية عالية، لكنها ثقيلة وعمرها أقصر.', en:'Low cost and high reliability, but heavy with a shorter life.', fr:'Peu coûteuse et très fiable, mais lourde et de durée de vie plus courte.', es:'Barata y muy fiable, pero pesada y de vida más corta.', de:'Günstig und sehr zuverlässig, aber schwer und kurzlebiger.'},
        scientific:{ar:'تفاعل كيميائي قابل للعكس بين ألواح رصاص وثاني أكسيد الرصاص داخل محلول حمض الكبريتيك، يعيد الشحن المواد لحالتها الأصلية.', en:'A reversible chemical reaction between lead plates and lead dioxide in a sulfuric acid solution; charging restores the materials to their original state.', fr:'Une réaction chimique réversible entre des plaques de plomb et du dioxyde de plomb, dans une solution d\'acide sulfurique. La charge ramène les matériaux à leur état d\'origine.', es:'Una reacción química reversible entre placas de plomo y dióxido de plomo en una solución de ácido sulfúrico; al cargarla, los materiales vuelven a su estado original.', de:'Eine umkehrbare chemische Reaktion zwischen Bleiplatten und Bleidioxid in Schwefelsäure. Beim Laden kehren die Materialien in ihren Ausgangszustand zurück.'},
        practical:{ar:'تكلفة منخفضة جدًا وموثوقية عالية في تطبيقات التيار العالي (مثل بدء تشغيل السيارات)، لكنها ثقيلة الوزن وكثافة طاقتها منخفضة وعمرها الافتراضي أقصر نسبيًا.', en:'Very low cost and high reliability for high-current applications (like starting a car engine), but heavy, with low energy density and a relatively shorter lifespan.', fr:'Très bon marché et très fiable pour les applications à fort courant (comme le démarrage d\'un moteur de voiture), mais lourde, avec une faible densité énergétique et une durée de vie relativement courte.', es:'Muy barata y fiable para aplicaciones de alta corriente (como arrancar el motor de un coche), pero pesada, con baja densidad energética y una vida útil relativamente corta.', de:'Sehr günstig und zuverlässig bei hohen Strömen (etwa zum Starten eines Automotors), aber schwer, mit geringer Energiedichte und vergleichsweise kurzer Lebensdauer.'},
        specs:[{k:{ar:'كثافة الطاقة',en:'Energy density', fr:'Densité énergétique', es:'Densidad energética', de:'Energiedichte'}, v:'30–50 Wh/kg'},{k:{ar:'دورات الشحن',en:'Charge cycles', fr:'Cycles de charge', es:'Ciclos de carga', de:'Ladezyklen'}, v:'300–500'}],
        illustration:'battery-cell'
      },
      {
        id:'li-ion-nmc',
        name:{ar:'ليثيوم أيون (NMC)', en:'Lithium-ion (NMC)', fr:'Lithium-ion (NMC)', es:'Ion-litio (NMC)', de:'Lithium-Ionen (NMC)'},
        summary:{ar:'كثافة طاقة أعلى وعمر أطول، تحتاج نظام إدارة بطارية.', en:'Higher energy density and longer life, needs a battery management system.', fr:'Densité énergétique plus élevée et durée de vie plus longue, mais nécessite un système de gestion de batterie.', es:'Más densidad energética y vida más larga, pero necesita un sistema de gestión de batería.', de:'Höhere Energiedichte und längere Lebensdauer, braucht aber ein Batteriemanagementsystem.'},
        scientific:{ar:'أيونات الليثيوم تنتقل بين قطب موجب (أكسيد نيكل-منجنيز-كوبالت) وقطب سالب (جرافيت) عبر إلكتروليت خلال الشحن والتفريغ، بدون تفاعل كيميائي مدمر للأقطاب.', en:'Lithium ions move between a positive electrode (nickel-manganese-cobalt oxide) and a negative electrode (graphite) through an electrolyte during charge and discharge, without a destructive chemical reaction at the electrodes.', fr:'Lors de la charge et de la décharge, les ions lithium circulent à travers un électrolyte entre une électrode positive (oxyde de nickel-manganèse-cobalt) et une électrode négative (graphite), sans réaction chimique destructrice au niveau des électrodes.', es:'Durante la carga y la descarga, los iones de litio se mueven a través de un electrolito entre un electrodo positivo (óxido de níquel-manganeso-cobalto) y uno negativo (grafito), sin una reacción química destructiva en los electrodos.', de:'Beim Laden und Entladen wandern Lithium-Ionen durch einen Elektrolyten zwischen einer positiven Elektrode (Nickel-Mangan-Kobalt-Oxid) und einer negativen Elektrode (Graphit) – ohne zerstörerische chemische Reaktion an den Elektroden.'},
        practical:{ar:'كثافة طاقة أعلى بكثير ووزن أخف وعمر أطول (800–1500 دورة)، مناسبة للتخزين المرتبط بالطاقة الشمسية وللتطبيقات المتنقلة، لكنها أغلى وتحتاج نظام إدارة بطارية (BMS) للأمان.', en:'Much higher energy density, lighter weight, and longer life (800–1500 cycles), suited to solar storage and mobile applications — but pricier and requires a battery management system (BMS) for safety.', fr:'Une densité énergétique bien supérieure, un poids réduit et une durée de vie plus longue (800–1500 cycles) : idéale pour le stockage solaire et les usages mobiles. Mais elle coûte plus cher et exige un BMS (système de gestion de batterie) pour la sécurité.', es:'Mucha más densidad energética, menos peso y una vida más larga (800–1500 ciclos), ideal para almacenamiento solar y aplicaciones móviles. Pero es más cara y necesita un BMS (sistema de gestión de batería) por seguridad.', de:'Deutlich höhere Energiedichte, weniger Gewicht und längere Lebensdauer (800–1500 Zyklen) – ideal für Solarspeicher und mobile Anwendungen. Dafür teurer, und aus Sicherheitsgründen ist ein BMS (Batteriemanagementsystem) nötig.'},
        specs:[{k:{ar:'كثافة الطاقة',en:'Energy density', fr:'Densité énergétique', es:'Densidad energética', de:'Energiedichte'}, v:'150–220 Wh/kg'},{k:{ar:'دورات الشحن',en:'Charge cycles', fr:'Cycles de charge', es:'Ciclos de carga', de:'Ladezyklen'}, v:'800–1500'}],
        illustration:'battery-cell'
      },
      {
        id:'lifepo4',
        name:{ar:'ليثيوم حديد فوسفات (LiFePO4)', en:'Lithium Iron Phosphate (LiFePO4)', fr:'Lithium fer phosphate (LiFePO4)', es:'Litio-ferrofosfato (LiFePO4)', de:'Lithium-Eisenphosphat (LiFePO4)'},
        summary:{ar:'أأمن أنواع بطاريات الليثيوم وأطولها عمرًا، الخيار المفضل لتخزين الطاقة الشمسية.', en:'The safest and longest-lived type of lithium battery — the top pick for solar energy storage.', fr:'Le type de batterie lithium le plus sûr et le plus durable : le premier choix pour stocker l\'énergie solaire.', es:'El tipo de batería de litio más seguro y duradero: la mejor opción para almacenar energía solar.', de:'Der sicherste und langlebigste Lithium-Akkutyp – erste Wahl für Solarspeicher.'},
        scientific:{ar:'بتستخدم فوسفات الحديد كقطب موجب بدل أكاسيد النيكل والكوبالت المستخدمة في أنواع ليثيوم تانية. الرابطة الكيميائية بين الحديد والفوسفات أكتر استقرارًا حراريًا، فاحتمال حدوث تفاعل حراري متسلسل أقل بكتير حتى في حالة تلف أو ارتفاع حرارة غير طبيعي.', en:'Uses iron phosphate as the positive electrode instead of the nickel and cobalt oxides used in other lithium types. The chemical bond between iron and phosphate is far more thermally stable, making a runaway thermal reaction much less likely even if the cell is damaged or overheats.', fr:'L\'électrode positive est en phosphate de fer, au lieu des oxydes de nickel et de cobalt des autres batteries lithium. La liaison chimique entre le fer et le phosphate est bien plus stable thermiquement, ce qui rend un emballement thermique beaucoup moins probable, même si la cellule est endommagée ou surchauffe.', es:'Usa fosfato de hierro como electrodo positivo en lugar de los óxidos de níquel y cobalto de otras baterías de litio. El enlace químico entre el hierro y el fosfato es mucho más estable térmicamente, así que una reacción térmica descontrolada es mucho menos probable, incluso si la celda se daña o se sobrecalienta.', de:'Als positive Elektrode dient Eisenphosphat statt der Nickel- und Kobaltoxide anderer Lithiumtypen. Die chemische Bindung zwischen Eisen und Phosphat ist thermisch viel stabiler – ein thermisches Durchgehen ist daher deutlich unwahrscheinlicher, selbst wenn die Zelle beschädigt ist oder überhitzt.'},
        practical:{ar:'كثافة طاقتها أقل شوية من أنواع ليثيوم تانية (يعني وزن أكبر شوية لنفس السعة)، لكنها بتعوض ده بعمر افتراضي أطول بكتير (يتجاوز 2000 دورة شحن) وأمان أعلى، وده اللي بيخليها الاختيار المفضل لأنظمة تخزين الطاقة الشمسية الثابتة اللي مش محتاجة تكون خفيفة الوزن.', en:'Its energy density is a bit lower than other lithium types (so slightly more weight for the same capacity), but it makes up for that with a much longer lifespan (often beyond 2000 charge cycles) and higher safety — which is exactly why it\'s the preferred choice for stationary solar storage systems that don\'t need to be lightweight.', fr:'Sa densité énergétique est un peu plus faible que celle des autres batteries lithium (donc un peu plus de poids pour la même capacité). Elle compense largement par une durée de vie bien plus longue (souvent plus de 2000 cycles) et une sécurité accrue. C\'est justement pour cela qu\'elle est privilégiée pour le stockage solaire fixe, où la légèreté importe peu.', es:'Su densidad energética es algo menor que la de otras baterías de litio (algo más de peso para la misma capacidad), pero lo compensa con una vida mucho más larga (a menudo más de 2000 ciclos) y más seguridad. Por eso es la opción preferida para el almacenamiento solar fijo, donde el peso no importa.', de:'Die Energiedichte ist etwas geringer als bei anderen Lithiumtypen (also etwas mehr Gewicht bei gleicher Kapazität). Das gleicht sie mit einer viel längeren Lebensdauer (oft über 2000 Ladezyklen) und höherer Sicherheit aus – genau deshalb ist sie die bevorzugte Wahl für stationäre Solarspeicher, bei denen das Gewicht keine Rolle spielt.'},
        specs:[{k:{ar:'كثافة الطاقة',en:'Energy density', fr:'Densité énergétique', es:'Densidad energética', de:'Energiedichte'}, v:'90–160 Wh/kg'},{k:{ar:'دورات الشحن',en:'Charge cycles', fr:'Cycles de charge', es:'Ciclos de carga', de:'Ladezyklen'}, v:'2000+'},{k:{ar:'الأمان الحراري',en:'Thermal safety', fr:'Sécurité thermique', es:'Seguridad térmica', de:'Thermische Sicherheit'}, v:{ar:'الأعلى بين أنواع الليثيوم',en:'Highest among lithium types', fr:'La plus élevée des batteries lithium', es:'La más alta entre las de litio', de:'Höchste unter den Lithiumtypen'}}],
        illustration:'battery-cell'
      }
    ]
  },

    intro:{ar:'تطبيقات الذكاء الاصطناعي والتحكم الآلي في السياق الصناعي، بمحتوى مبدئي هيتوسع لاحقًا.', en:'AI and automation applications in an industrial context — early content that will expand.', fr:'Les applications de l\'IA et de l\'automatisation dans l\'industrie. Un contenu de départ, appelé à s\'enrichir.', es:'Aplicaciones de la IA y la automatización en la industria. Contenido inicial que irá creciendo.', de:'KI- und Automatisierungsanwendungen im industriellen Umfeld – ein erster Überblick, der weiter wachsen wird.'},
