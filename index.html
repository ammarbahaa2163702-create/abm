/* ---------------- state ---------------- */
let LANG = 'ar';
try{ const saved = localStorage.getItem('abm_lang'); if(saved) LANG = saved; }catch(e){}

let db = null;
let researchByDomain = {};
let allResearch = [];
let analytics = {total:0, byDomain:{}};

function setResearch(list){
  allResearch = list;
  researchByDomain = {};
  allResearch.forEach(r=>{ (researchByDomain[r.domain] ||= []).push(r); });
  refreshData();
}
/* Public/static hosting (e.g. GitHub Pages): no Claude runtime, so research
   comes from data/research.json and the admin area is hidden. */
const STATIC_SITE = (typeof claude === 'undefined') || !claude || !claude.use;
if(STATIC_SITE){
  document.documentElement.classList.add('static-site');
  fetch('research.json').then(r=>r.json()).then(list=>{
    list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    setResearch(list);
  }).catch(e=>console.warn('research load failed', e));
}
if(!STATIC_SITE) claude.use('db').then(ns=>{
  db = ns;
  if(!db) return;
  db.collection('research').orderBy('createdAt','desc').limit(500).onSnapshot(snap=>{
    setResearch(snap.docs.map(d=>({id:d.id, ...d.data()})));
  }, err=>{ console.warn('research snapshot error', err); });

  db.doc('analytics/summary').onSnapshot(snap=>{
    analytics = snap.exists ? {total:0, byDomain:{}, ...snap.data()} : {total:0, byDomain:{}};
    refreshData();
  }, err=>{ console.warn('analytics snapshot error', err); });
}).catch(()=>{ db = null; });

function t(key){ return I18N[LANG][key] ?? key; }

function setLang(l){
  LANG = l;
  try{ localStorage.setItem('abm_lang', l); }catch(e){}
  applyLang();
  render();
}
function applyLang(){
  document.documentElement.setAttribute('dir', LANG==='ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', LANG);
  document.body.classList.toggle('lang-en', LANG!=='ar');
  const langSel = document.getElementById('lang-select'); if(langSel) langSel.value = LANG;
  const fab = document.getElementById('wa-fab'); if(fab) fab.href = waLink(t('wa.hello'));
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.getAttribute('data-t')); });
}

function toggleMobileMenu(){
  document.getElementById('topnav').classList.toggle('open');
}

function showToast(msg){
  const el = document.getElementById('toast-msg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

function bi(field){ return field && typeof field === 'object' ? (field[LANG] ?? field.en ?? field.ar ?? '') : field; }
/* Research docs store each language as a flat field (titleAr, titleEn, titleFr, titleEs, titleDe...). */
const LANG_SUFFIX = {ar:'Ar', en:'En', fr:'Fr', es:'Es', de:'De'};
function rf(r, base){ const o={}; for(const l in LANG_SUFFIX){ const v=r[base+LANG_SUFFIX[l]]; if(v) o[l]=v; } return bi(o); }
const DATE_LOCALE = {ar:'ar-EG', en:'en-GB', fr:'fr-FR', es:'es-ES', de:'de-DE'};

function findDomain(id){ return DOMAINS.find(d=>d.id===id); }
function findMaterial(domain, id){ return domain?.materials.find(m=>m.id===id); }
function findFundamental(id){ return FUNDAMENTALS.find(f=>f.id===id); }

const CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 6"/></svg>';
const CROSS_ICON = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* Generic "quick-glance comparison" section — used for the solar
   technology comparison and the motor-type comparison. Reads d.compare
   so a future domain gets the same section just by adding the data. */
function compareSection(d){
  if(!d.compare) return '';
  const cards = d.compare.items.map(it=>{
    const pros = (it.pros||[]).map(p=>`<div class="row pro">${CHECK_ICON}<span>${escapeHtml(bi(p))}</span></div>`).join('');
    const cons = (it.cons||[]).map(c=>`<div class="row con">${CROSS_ICON}<span>${escapeHtml(bi(c))}</span></div>`).join('');
    const link = it.linkMaterial ? `<a class="link" href="#material/${d.id}/${it.linkMaterial}">${t('compare.details')}</a>` : '';
    return `<div class="compare-card">
      <h4>${escapeHtml(bi(it.name))}</h4>
      ${it.stat ? `<span class="stat-chip">${escapeHtml(bi(it.stat.k))}: <b>${escapeHtml(bi(it.stat.v))}</b></span>` : ''}
      <p class="blurb">${escapeHtml(bi(it.blurb))}</p>
      <div class="proscons">
        ${pros ? `<div class="eyebrow" style="font-size:11px">${t('compare.pros')}</div>${pros}` : ''}
        ${cons ? `<div class="eyebrow" style="font-size:11px;color:var(--text-faint)">${t('compare.cons')}</div>${cons}` : ''}
      </div>
      ${link}
    </div>`;
  }).join('');
  const seeAlso = (d.compare.seeAlso||[]).map(id=>findFundamental(id)).filter(Boolean);
  const seeAlsoRow = seeAlso.length ? `<div class="pill-row" style="margin-top:14px;margin-bottom:0">${seeAlso.map(f=>`<a href="#fundamentals/${f.id}">${escapeHtml(bi(f.name))}</a>`).join('')}</div>` : '';
  return `<div class="compare-head">
      <h2 class="section-title" style="font-size:22px">${escapeHtml(bi(d.compare.title))}</h2>
      <p>${escapeHtml(bi(d.compare.sub))}</p>
      ${seeAlsoRow}
    </div>
    <div class="compare-grid">${cards}</div>`;
}

/* ---------------- analytics tracking (approximate demo counter) ---------------- */
async function trackView(section){
  if(!db) return;
  try{
    const ref = db.doc('analytics/summary');
    const snap = await ref.get();
    const data = snap.exists ? (snap.data() || {}) : {};
    const byDomain = {...(data.byDomain||{})};
    byDomain[section] = (byDomain[section]||0) + 1;
    const payload = { total:(data.total||0)+1, byDomain, lastUpdated:Date.now() };
    if(snap.exists) await ref.update(payload); else await ref.set(payload);
  }catch(e){ /* best-effort demo counter, ignore failures */ }
}

/* ---------------- research feed rendering ---------------- */
function researchCard(r, opts={}){
  const d = findDomain(r.domain);
  const visualKey = RESEARCH_VISUALS[r.visual] ? r.visual : 'didyouknow';
  const c = d ? `var(${d.color})` : 'var(--accent)';
  const illoKey = r.illustration && RESEARCH_ILLUSTRATIONS[r.illustration] ? r.illustration : null;
  const illo = illoKey ? `<div class="research-illustration" style="--c:${c}">${RESEARCH_ILLUSTRATIONS[illoKey]}</div>` : '';
  return `<div class="research-card">
    <div class="research-main">
      <span class="research-visual" style="--c:${c}" title="${escapeHtml(bi(RESEARCH_VISUAL_LABELS[visualKey]))}">${RESEARCH_VISUALS[visualKey]}</span>
      <div class="research-body">
        ${opts.showDomain && d ? `<div class="eyebrow">${escapeHtml(bi(d.name))}</div>` : ''}
        <h5><a href="#research/${r.id}">${escapeHtml(rf(r,'title'))}</a></h5>
        <div class="meta">${new Date(r.createdAt||Date.now()).toLocaleDateString(DATE_LOCALE[LANG]||'en-GB')}</div>
        <p>${escapeHtml(rf(r,'scientific'))}</p>
        <p>${escapeHtml(rf(r,'practical'))}</p>
      </div>
    </div>
    ${illo}
    ${interactiveWidget(r)}
    <a class="readmore" href="#research/${r.id}">${t('research.readmore')}</a>
  </div>`;
}
function findResearch(id){ return allResearch.find(r=>r.id===id); }
function relatedResearch(r, count=4){
  const rTags = new Set(r.tags||[]);
  return allResearch
    .filter(x=>x.id!==r.id)
    .map(x=>{
      let score = (x.domain===r.domain) ? 2 : 0;
      if(rTags.size && Array.isArray(x.tags)) score += x.tags.filter(tg=>rTags.has(tg)).length;
      return {x, score};
    })
    .filter(o=>o.score>0)
    .sort((a,b)=> b.score-a.score || (b.x.createdAt||0)-(a.x.createdAt||0))
    .slice(0,count)
    .map(o=>o.x);
}
function pageResearchDetail(id){
  const r = findResearch(id);
  if(!r) return pageNotFound();
  const d = findDomain(r.domain);
  const c = d ? `var(${d.color})` : 'var(--accent)';
  const illoKey = r.illustration && RESEARCH_ILLUSTRATIONS[r.illustration] ? r.illustration : null;
  const illo = illoKey ? `<div class="research-illustration detail-illustration" style="--c:${c}">${RESEARCH_ILLUSTRATIONS[illoKey]}</div>` : '';
  const deeper = r.deeper ? `<div class="panel deeper-panel"><span class="tag">${t('material.deeper')}</span><p>${escapeHtml(bi(r.deeper))}</p></div>` : '';
  const rel = relatedResearch(r, 4);
  const relItems = rel.map(x=>{
    const xd = findDomain(x.domain);
    return `<a class="related-card" href="#research/${x.id}">
      <div class="eyebrow">${xd?escapeHtml(bi(xd.name)):''}</div>
      <h5>${escapeHtml(rf(x,'title'))}</h5>
    </a>`;
  }).join('');
  const related = rel.length ? `<h3 style="font-size:16px;margin-top:40px">${t('research.related')}</h3><div class="related-grid">${relItems}</div>` : '';
  return `<section class="route wrap">
    <div class="breadcrumb"><a href="#home">${t('nav.home')}</a> / <a href="#research">${t('nav.research')}</a>${d?` / <a href="#domain/${d.id}">${escapeHtml(bi(d.name))}</a>`:''}</div>
    ${d?`<span class="icon-badge" style="--c:${c}">${ICONS[d.icon]}</span>`:''}
    <h1 class="detail-title" style="margin-top:14px">${escapeHtml(rf(r,'title'))}</h1>
    <div class="meta">${new Date(r.createdAt||Date.now()).toLocaleDateString(DATE_LOCALE[LANG]||'en-GB')}</div>
    ${illo}
    <div class="split">
      <div class="panel">
        <span class="tag sci">${t('material.scientific')}</span>
        <p>${escapeHtml(rf(r,'scientific'))}</p>
      </div>
      <div class="panel">
        <span class="tag prac">${t('material.practical')}</span>
        <p>${escapeHtml(rf(r,'practical'))}</p>
      </div>
    </div>
    ${deeper}
    ${interactiveWidget(r)}
    ${related}
    <div style="margin-top:36px"><a class="btn btn-ghost btn-sm" href="#research">${t('research.back')}</a></div>
  </section>`;
}
function researchFeed(domainId){
  const list = researchByDomain[domainId] || [];
  if(!list.length){ return `<div class="empty-state">${t('empty.research')}</div>`; }
  return list.map(r=>researchCard(r,{showDomain:false})).join('');
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function pageAdmin(){
  const totalViews = analytics.total || 0;
  const byDomain = analytics.byDomain || {};
  const maxViews = Math.max(1, ...DOMAINS.map(d=>byDomain[d.id]||0));
  const bars = DOMAINS.map(d=>{
    const v = byDomain[d.id]||0;
    const pct = Math.round((v/maxViews)*100);
    return `<div class="bar-row"><div class="name">${escapeHtml(bi(d.name))}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="val">${v}</div></div>`;
  }).join('');

  const domainOptions = DOMAINS.map(d=>`<option value="${d.id}">${escapeHtml(bi(d.name))}</option>`).join('');

  const manageRows = allResearch.length ? allResearch.map(r=>{
    const d = findDomain(r.domain);
    return `<div class="manage-row">
      <div class="info">
        <h5>${escapeHtml(rf(r,'title'))}</h5>
        <div class="meta">${d?escapeHtml(bi(d.name)):''} · ${new Date(r.createdAt||Date.now()).toLocaleDateString(DATE_LOCALE[LANG]||'en-GB')}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="deleteResearch('${r.id}')">${t('admin.delete')}</button>
    </div>`;
  }).join('') : `<div class="empty-state">${t('admin.manage.empty')}</div>`;

  return `<section class="route wrap">
    <h2 class="section-title">${t('admin.title')}</h2>
    <div class="admin-note" style="margin-top:14px">${t('admin.sub')}</div>

    <div class="admin-grid">
      <div class="stat-tile"><div class="num">${totalViews}</div><div class="label">${t('admin.stat.total')}</div></div>
      <div class="stat-tile"><div class="num">${allResearch.length}</div><div class="label">${t('admin.stat.research')}</div></div>
      <div class="stat-tile"><div class="num">${PRODUCTS.length}</div><div class="label">${t('admin.stat.products')}</div></div>
    </div>

    <h3 style="font-size:16px;margin-bottom:4px">${t('admin.views.title')}</h3>
    <div style="margin-top:12px;margin-bottom:40px">${bars}</div>

    <h3 style="font-size:16px">${t('admin.add.title')}</h3>
    <form class="admin-form" style="margin-top:16px" onsubmit="submitResearch(event)">
      <div class="grid2">
        <div>
          <label>${t('admin.add.domain')}</label>
          <select id="f-domain" required>${domainOptions}</select>
        </div>
        <div>
          <label>${t('admin.add.visual')}</label>
          <select id="f-visual" required>${Object.keys(RESEARCH_VISUALS).map(k=>`<option value="${k}">${escapeHtml(bi(RESEARCH_VISUAL_LABELS[k]))}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid2">
        <div><label>${t('admin.add.title_ar')}</label><input id="f-title-ar" required></div>
        <div><label>${t('admin.add.title_en')}</label><input id="f-title-en" required></div>
      </div>
      <div class="grid2">
        <div><label>${t('admin.add.sci_ar')}</label><textarea id="f-sci-ar" required></textarea></div>
        <div><label>${t('admin.add.sci_en')}</label><textarea id="f-sci-en" required></textarea></div>
      </div>
      <div class="grid2">
        <div><label>${t('admin.add.prac_ar')}</label><textarea id="f-prac-ar" required></textarea></div>
        <div><label>${t('admin.add.prac_en')}</label><textarea id="f-prac-en" required></textarea></div>
      </div>
      <div><button class="btn btn-primary" type="submit">${t('admin.add.submit')}</button></div>
    </form>

    <h3 style="font-size:16px;margin-top:48px">${t('admin.manage.title')}</h3>
    <div style="margin-top:12px">${manageRows}</div>
  </section>`;
}

async function submitResearch(ev){
  ev.preventDefault();
  if(!db){ showToast('DB unavailable'); return; }
  const payload = {
    domain: document.getElementById('f-domain').value,
    visual: document.getElementById('f-visual').value,
    titleAr: document.getElementById('f-title-ar').value,
    titleEn: document.getElementById('f-title-en').value,
    scientificAr: document.getElementById('f-sci-ar').value,
    scientificEn: document.getElementById('f-sci-en').value,
    practicalAr: document.getElementById('f-prac-ar').value,
    practicalEn: document.getElementById('f-prac-en').value,
    createdAt: Date.now()
  };
  try{
    await db.collection('research').add(payload);
    showToast(t('toast.published'));
    ev.target.reset();
  }catch(e){ showToast('Error: ' + (e?.message||e)); }
}

async function deleteResearch(id){
  if(!db) return;
  try{
    await db.doc('research/'+id).delete();
    showToast(t('toast.deleted'));
  }catch(e){ showToast('Error: ' + (e?.message||e)); }
}

/* ---------------- router ---------------- */
function currentRoute(){
  const hash = location.hash.replace('#','');
  const parts = hash.split('/');
  return { name: parts[0] || 'home', args: parts.slice(1) };
}

function renderPage(){
  const { name, args } = currentRoute();
  const app = document.getElementById('app');
  let html = '';
  let navKey = name;
  switch(name){
    case '': case 'home': html = pageHome(); navKey='home'; break;
    case 'about': html = pageAbout(); navKey='about'; break;
    case 'domain': html = pageDomain(args[0]); navKey=''; break;
    case 'material': html = pageMaterial(args[0], args[1]); navKey=''; break;
    case 'fundamentals': html = args[0] ? pageFundamentalDetail(args[0]) : pageFundamentals(); navKey = args[0] ? '' : 'fundamentals'; break;
    case 'research': html = args[0] ? pageResearchDetail(args[0]) : pageResearch(); navKey = args[0] ? '' : 'research'; break;
    case 'store': html = pageStore(); navKey='store'; break;
    case 'admin': html = STATIC_SITE ? pageNotFound() : pageAdmin(); navKey='admin'; break;
    case 'contact': html = pageContact(); navKey=''; break;
    default: html = pageNotFound(); navKey='';
  }
  app.innerHTML = html;
  document.querySelectorAll('[data-route-link]').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-route-link')===navKey);
  });
  applyLang();
  document.getElementById('topnav').classList.remove('open');
  return name || 'home';
}

/* Full navigation: repaints, jumps to top, and logs one page view. Only ever
   called from an actual navigation event (hash change, initial load, language
   switch) — never from a live data listener, so it can't create a feedback loop. */
function render(){
  const name = renderPage();
  window.scrollTo({top:0});
  trackView(name);
}

/* Live-data repaint: the research/analytics snapshot listeners call this when
   the underlying data changes. It repaints in place without resetting scroll
   position and, crucially, without calling trackView() again — trackView()
   itself writes to analytics/summary, and that same document is what one of
   these listeners watches, so calling render() here would write -> notify ->
   write -> notify forever, which also made the page jump to the top on every
   loop tick and made it feel like scrolling was completely broken. */
function refreshData(){
  renderPage();
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ applyLang(); render(); });
</script>
