      {k:{ar:'وحدة القدرة',en:'Power unit', fr:'Unité de puissance', es:'Unidad de potencia', de:'Einheit der Leistung'}, v:{ar:'واط (W)',en:'Watt (W)', fr:'Watt (W)', es:'Vatio (W)', de:'Watt (W)'}},
      {k:{ar:'وحدة فاتورة الكهرباء',en:'Billing unit', fr:'Unité de facturation', es:'Unidad de facturación', de:'Abrechnungseinheit'}, v:{ar:'كيلوواط ساعة (kWh)',en:'Kilowatt-hour (kWh)', fr:'Kilowattheure (kWh)', es:'Kilovatio hora (kWh)', de:'Kilowattstunde (kWh)'}}
    ],
    illustration:'power-bolt',
    deeper:{
      ar:'في دوائر التيار المتردد، القدرة الفعلية المستفادة (Real Power) ممكن تكون أقل من حاصل ضرب الجهد في التيار الظاهري، بسبب فرق التوقيت بين موجتي الجهد والتيار في أحمال معينة زي المواتير، وده اللي بيؤدي لمفهوم "معامل القدرة" (Power Factor) في التطبيقات الصناعية.',
      en:'In AC circuits, the real usable power can be less than the simple voltage-times-current product, because of a timing offset between the voltage and current waves in certain loads like motors — which is exactly where the concept of "power factor" comes from in industrial applications.', fr:'Dans les circuits AC, la puissance réellement utilisable peut être inférieure au simple produit tension × courant, à cause d\'un décalage temporel entre les ondes de tension et de courant avec certaines charges comme les moteurs. C\'est précisément de là que vient la notion de « facteur de puissance » dans les applications industrielles.', es:'En los circuitos de AC, la potencia realmente aprovechable puede ser menor que el simple producto de tensión por corriente, debido a un desfase entre las ondas de tensión y de corriente en ciertas cargas, como los motores. De ahí sale precisamente el concepto de «factor de potencia» en las aplicaciones industriales.', de:'In AC-Stromkreisen kann die tatsächlich nutzbare Leistung kleiner sein als das einfache Produkt aus Spannung und Strom. Grund ist eine zeitliche Verschiebung zwischen Spannungs- und Stromwelle bei bestimmten Lasten wie Motoren. Genau daher stammt in der Industrie der Begriff „Leistungsfaktor“.'
    }
  },
  {
    id:'series-parallel',
    name:{ar:'التوصيل على التوالي والتوازي', en:'Series vs Parallel Circuits', fr:'Circuits en série et en parallèle', es:'Circuitos en serie y en paralelo', de:'Reihen- und Parallelschaltung'},
    summary:{ar:'طريقتان أساسيتان لتوصيل عناصر الدائرة، وكل واحدة بتوزع الجهد والتيار بشكل مختلف تمامًا.', en:'Two fundamental ways to wire circuit components — each distributes voltage and current completely differently.', fr:'Deux façons fondamentales de câbler les composants d\'un circuit, qui répartissent tension et courant de manière totalement différente.', es:'Dos formas básicas de conectar los componentes de un circuito, y cada una reparte la tensión y la corriente de manera totalmente distinta.', de:'Zwei grundlegende Arten, Bauteile zu verschalten – und jede verteilt Spannung und Strom völlig anders.'},
    scientific:{
      ar:'في التوصيل على التوالي، نفس التيار بيمر بكل العناصر بالترتيب، والجهد الكلي بيتوزع عليهم، فلو عنصر واحد اتقطع الدائرة كلها بتقف. في التوصيل على التوازي، كل العناصر بتاخد نفس الجهد، لكن التيار بيتوزع بينهم حسب مقاومة كل فرع، فلو فرع اتقطع الباقي فاضل شغال.',
      en:'In a series connection, the same current flows through every component in sequence, and total voltage is split across them — if one component breaks, the whole circuit stops. In a parallel connection, every component sees the same voltage, but current splits between branches based on each branch\'s resistance — if one branch breaks, the rest keeps working.', fr:'En série, le même courant traverse chaque composant l\'un après l\'autre, et la tension totale se répartit entre eux : si un composant lâche, tout le circuit s\'arrête. En parallèle, chaque composant reçoit la même tension, mais le courant se partage entre les branches selon la résistance de chacune : si une branche lâche, les autres continuent de fonctionner.', es:'En una conexión en serie, la misma corriente pasa por todos los componentes uno tras otro y la tensión total se reparte entre ellos: si uno se rompe, todo el circuito se detiene. En una conexión en paralelo, cada componente recibe la misma tensión, pero la corriente se divide entre las ramas según la resistencia de cada una: si una rama falla, las demás siguen funcionando.', de:'In einer Reihenschaltung fließt derselbe Strom nacheinander durch alle Bauteile, und die Gesamtspannung teilt sich auf sie auf – fällt ein Bauteil aus, steht der ganze Stromkreis still. In einer Parallelschaltung liegt an jedem Bauteil dieselbe Spannung an, der Strom teilt sich aber je nach Widerstand auf die Zweige auf – fällt ein Zweig aus, arbeiten die anderen weiter.'
    },
    practical:{
      ar:'لمبات الزينة القديمة كانت موصلة على التوالي، عشان كده لو لمبة واحدة تلفت كل السلسلة بتطفي، أما الأسلاك المنزلية الحديثة كلها موصلة على التوازي، عشان كل غرفة تشتغل لوحدها حتى لو جهاز في غرفة تانية اتعطل.',
      en:'Old-style holiday lights were wired in series, which is why one burnt bulb would kill the whole string, while modern home wiring is entirely parallel, so each room keeps working independently even if a device in another room fails.', fr:'Les anciennes guirlandes de Noël étaient câblées en série : une seule ampoule grillée éteignait toute la guirlande. L\'installation électrique d\'une maison moderne, elle, est entièrement en parallèle, si bien que chaque pièce continue de fonctionner même si un appareil tombe en panne dans une autre.', es:'Las antiguas guirnaldas de luces se conectaban en serie, por eso una sola bombilla fundida apagaba toda la tira. En cambio, la instalación eléctrica de una casa moderna es totalmente en paralelo, así que cada habitación sigue funcionando aunque falle un aparato en otra.', de:'Alte Lichterketten waren in Reihe geschaltet – deshalb legte eine einzige durchgebrannte Birne die ganze Kette lahm. Die Hausinstallation ist heute dagegen komplett parallel aufgebaut: Jeder Raum funktioniert weiter, auch wenn in einem anderen ein Gerät ausfällt.'
    },
    specs:[
      {k:{ar:'توالي: التيار',en:'Series: current', fr:'Série : courant', es:'Serie: corriente', de:'Reihe: Strom'}, v:{ar:'واحد يمر في الكل',en:'One value through all', fr:'Une seule valeur partout', es:'Un mismo valor en todo', de:'Überall derselbe Wert'}},
      {k:{ar:'توازي: الجهد',en:'Parallel: voltage', fr:'Parallèle : tension', es:'Paralelo: tensión', de:'Parallel: Spannung'}, v:{ar:'نفس القيمة على كل فرع',en:'Same value across every branch', fr:'Même valeur dans chaque branche', es:'El mismo valor en cada rama', de:'Gleicher Wert in jedem Zweig'}}
    ],
    illustration:'circuit-branch',
    deeper:{
      ar:'المقاومة الكلية للدوائر بتتحسب بشكل مختلف تمامًا حسب التوصيل: على التوالي بنجمع قيم المقاومات ببساطة، لكن على التوازي المقاومة الكلية بتقل عن أصغر مقاومة موجودة في الفروع، وده بيفسر ليه توصيل مصابيح كتير على التوازي بيسحب تيار أعلى بكتير من التوصيل على التوالي.',
      en:'Total circuit resistance is calculated completely differently depending on wiring: in series you simply add resistor values, but in parallel the total resistance actually drops below the smallest resistor in any branch — which explains why wiring many bulbs in parallel draws far more current than wiring them in series.', fr:'La résistance totale d\'un circuit se calcule de façon totalement différente selon le câblage : en série, on additionne simplement les résistances, alors qu\'en parallèle la résistance totale descend même sous celle de la plus petite résistance d\'une branche. Voilà pourquoi brancher de nombreuses ampoules en parallèle tire bien plus de courant que de les brancher en série.', es:'La resistencia total de un circuito se calcula de forma completamente distinta según el cableado: en serie basta con sumar los valores, pero en paralelo la resistencia total baja incluso por debajo de la resistencia más pequeña de cualquier rama. Eso explica por qué conectar muchas bombillas en paralelo consume mucha más corriente que conectarlas en serie.', de:'Der Gesamtwiderstand wird je nach Schaltung völlig unterschiedlich berechnet: In Reihe addiert man einfach die Widerstandswerte, parallel dagegen sinkt der Gesamtwiderstand sogar unter den kleinsten Widerstand eines Zweigs. Das erklärt, warum viele parallel geschaltete Lampen weit mehr Strom ziehen als in Reihe geschaltete.'
    }
  },
  {
    id:'diodes',
    name:{ar:'الدايود (Diode)', en:'Diodes', fr:'Diodes', es:'Diodos', de:'Dioden'},
    summary:{ar:'عنصر بيسمح للتيار يمر في اتجاه واحد بس، زي صمام أحادي الاتجاه للكهرباء.', en:'A component that only lets current flow in one direction — a one-way valve for electricity.', fr:'Un composant qui ne laisse passer le courant que dans un seul sens : un clapet anti-retour pour l\'électricité.', es:'Un componente que solo deja pasar la corriente en un sentido: una válvula antirretorno para la electricidad.', de:'Ein Bauteil, das Strom nur in eine Richtung durchlässt – ein Rückschlagventil für Elektrizität.'},
    scientific:{
      ar:'الدايود مصنوع من ملتقى مادتين شبه موصلتين مختلفتين (P-N Junction). في اتجاه واحد (الانحياز الأمامي)، الإلكترونات بتقدر تعبر الملتقى بسهولة، وفي الاتجاه المعاكس (الانحياز العكسي)، منطقة استنزاف بتتكون عند الملتقى بتمنع مرور التيار تقريبًا تمامًا.',
      en:'A diode is made from the junction of two different semiconductor materials (a P-N junction). In one direction (forward bias), electrons cross the junction easily; in the reverse direction (reverse bias), a depletion region forms at the junction that blocks current flow almost entirely.', fr:'Une diode est formée par la jonction de deux matériaux semi-conducteurs différents (une jonction P-N, où se rencontrent une zone riche en électrons et une zone qui en manque). Dans un sens (polarisation directe), les électrons franchissent facilement la jonction ; dans le sens inverse (polarisation inverse), une zone de déplétion se forme à la jonction et bloque presque totalement le courant.', es:'Un diodo se forma con la unión de dos materiales semiconductores distintos (una unión P-N, donde se encuentran una zona con electrones de sobra y otra a la que le faltan). En un sentido (polarización directa), los electrones cruzan la unión con facilidad; en el sentido contrario (polarización inversa), se forma en la unión una zona de agotamiento que bloquea casi por completo el paso de corriente.', de:'Eine Diode entsteht aus dem Übergang zwischen zwei unterschiedlichen Halbleitermaterialien (einem P-N-Übergang, an dem eine Zone mit Elektronenüberschuss auf eine mit Elektronenmangel trifft). In einer Richtung (Durchlassrichtung) überqueren die Elektronen den Übergang mühelos; in der Gegenrichtung (Sperrrichtung) bildet sich am Übergang eine Verarmungszone, die den Stromfluss fast vollständig blockiert.'
    },
    practical:{
      ar:'الدايود بيستخدم على نطاق واسع لحماية الدوائر من توصيل البطارية بالعكس بالغلط، ولتحويل التيار المتردد لتيار مستمر (تقويم Rectification) جوه أي شاحن أو محول كهربائي، وأشهر أنواعه هو الـ LED اللي بيضيء لما التيار يمر فيه في الاتجاه الصح.',
      en:'Diodes are widely used to protect circuits from a battery being connected backwards by mistake, and to convert AC into DC (rectification) inside any charger or power adapter — the most familiar type being the LED, which lights up when current flows through it in the right direction.', fr:'Les diodes servent beaucoup à protéger les circuits contre une batterie branchée à l\'envers par erreur, et à convertir l\'AC en DC (redressement) dans tous les chargeurs et adaptateurs secteur. Le type le plus connu est la LED, qui s\'allume quand le courant la traverse dans le bon sens.', es:'Los diodos se usan mucho para proteger los circuitos si alguien conecta una batería al revés por error, y para convertir AC en DC (rectificación) dentro de cualquier cargador o adaptador. El tipo más conocido es el LED, que se enciende cuando la corriente lo atraviesa en el sentido correcto.', de:'Dioden schützen Schaltungen häufig davor, dass eine Batterie versehentlich verpolt angeschlossen wird, und wandeln in jedem Ladegerät und Netzteil AC in DC um (Gleichrichtung). Der bekannteste Typ ist die LED, die leuchtet, wenn Strom in der richtigen Richtung durch sie fließt.'
    },
    specs:[
      {k:{ar:'الاتجاه المسموح',en:'Allowed direction', fr:'Sens autorisé', es:'Sentido permitido', de:'Erlaubte Richtung'}, v:{ar:'اتجاه واحد فقط',en:'One direction only', fr:'Un seul sens', es:'Un solo sentido', de:'Nur eine Richtung'}},
      {k:{ar:'استخدام شائع',en:'Common use', fr:'Usage courant', es:'Uso habitual', de:'Typische Anwendung'}, v:{ar:'تقويم AC إلى DC',en:'Rectifying AC to DC', fr:'Redresser l\'AC en DC', es:'Rectificar AC a DC', de:'Gleichrichtung von AC zu DC'}}
    ],
    illustration:'diode-symbol',
    deeper:{
      ar:'أي دايود لازم يتحمل قيمة جهد معينة في الاتجاه العكسي قبل ما "ينهار" ويسمح للتيار يمر عكس اتجاهه الطبيعي، وده اسمه جهد الانهيار العكسي، ودايود خاص اسمه Zener اتصمم عمدًا يشتغل بأمان في منطقة الانهيار دي، وده بيخليه مفيد جدًا في تثبيت الجهد عند قيمة معينة.',
      en:'Every diode must withstand a certain reverse voltage before it "breaks down" and lets current flow backwards — called the reverse breakdown voltage. A special type called a Zener diode is intentionally designed to operate safely in that breakdown region, which makes it very useful for holding voltage steady at a fixed value.', fr:'Chaque diode doit supporter une certaine tension inverse avant de « claquer » et de laisser le courant passer à rebours : c\'est la tension de claquage inverse. Un type particulier, la diode Zener, est justement conçu pour fonctionner sans danger dans cette zone de claquage, ce qui la rend très utile pour maintenir une tension stable à une valeur fixe.', es:'Todo diodo tiene que soportar cierta tensión inversa antes de «romperse» y dejar pasar la corriente al revés: es la llamada tensión de ruptura inversa. Un tipo especial, el diodo Zener, está diseñado a propósito para trabajar con seguridad en esa zona de ruptura, lo que lo hace muy útil para mantener la tensión estable en un valor fijo.', de:'Jede Diode hält eine bestimmte Sperrspannung aus, bevor sie „durchbricht“ und Strom rückwärts fließen lässt – die sogenannte Durchbruchspannung. Ein spezieller Typ, die Zener-Diode, ist bewusst dafür gebaut, sicher in diesem Durchbruchbereich zu arbeiten. Dadurch eignet sie sich hervorragend, um eine Spannung auf einem festen Wert stabil zu halten.'
    }
  },
  {
    id:'transistors',
    name:{ar:'الترانزستور (Transistor)', en:'Transistors', fr:'Transistors', es:'Transistores', de:'Transistoren'},
    summary:{ar:'مفتاح كهربي فائق السرعة بيتحكم فيه إشارة صغيرة، وأساس كل المعالجات الحديثة.', en:'An ultra-fast electrical switch controlled by a tiny signal — the basis of every modern processor.', fr:'Un interrupteur électrique ultrarapide commandé par un signal minuscule, à la base de tous les processeurs modernes.', es:'Un interruptor eléctrico ultrarrápido controlado por una señal diminuta: la base de todos los procesadores modernos.', de:'Ein ultraschneller elektrischer Schalter, gesteuert von einem winzigen Signal – die Grundlage jedes modernen Prozessors.'},
    scientific:{
      ar:'الترانزستور عنده ثلاث أطراف: قاعدة (Base)، وباعث (Emitter)، ومجمّع (Collector)، وإشارة صغيرة جدًا على القاعدة بتتحكم في تيار أكبر بكتير بين الباعث والمجمّع، فبيشتغل إما كمفتاح إلكتروني (يفتح أو يقفل) أو كمكبّر إشارة.',
      en:'A transistor has three terminals — base, emitter, and collector — and a very small signal on the base controls a much larger current between the emitter and collector, letting it act either as an electronic switch (on/off) or as a signal amplifier.', fr:'Un transistor possède trois broches : la base, l\'émetteur et le collecteur. Un tout petit signal appliqué sur la base contrôle un courant bien plus fort entre l\'émetteur et le collecteur. Le transistor peut ainsi servir d\'interrupteur électronique (marche/arrêt) ou d\'amplificateur de signal.', es:'Un transistor tiene tres terminales: base, emisor y colector. Una señal muy pequeña en la base controla una corriente mucho mayor entre el emisor y el colector, así que puede funcionar como interruptor electrónico (encendido/apagado) o como amplificador de señal.', de:'Ein Transistor hat drei Anschlüsse: Basis, Emitter und Kollektor. Ein sehr kleines Signal an der Basis steuert einen viel größeren Strom zwischen Emitter und Kollektor. So kann er entweder als elektronischer Schalter (ein/aus) oder als Signalverstärker arbeiten.'
    },
    practical:{
      ar:'المعالج جوه أي كمبيوتر أو موبايل فيه مليارات الترانزستورات الدقيقة جدًا، كل واحد بيشتغل كمفتاح تشغيل/إطفاء فائق السرعة، وتجميع مليارات المفاتيح دي بترتيب معين هو اللي بيمكّن أي عملية حسابية أو منطقية يعملها الجهاز.',
      en:'The processor inside any computer or phone contains billions of extremely tiny transistors, each acting as an ultra-fast on/off switch, and combining billions of these switches in a specific arrangement is exactly what enables any computation or logic the device performs.', fr:'Le processeur de n\'importe quel ordinateur ou téléphone renferme des milliards de transistors minuscules, chacun jouant le rôle d\'un interrupteur marche/arrêt ultrarapide. C\'est l\'agencement précis de ces milliards d\'interrupteurs qui rend possible chaque calcul et chaque opération logique de l\'appareil.', es:'El procesador de cualquier ordenador o móvil contiene miles de millones de transistores diminutos, y cada uno actúa como un interruptor de encendido y apagado ultrarrápido. Combinar esos miles de millones de interruptores con una disposición concreta es justo lo que permite cualquier cálculo o lógica que haga el dispositivo.', de:'Im Prozessor jedes Computers und Smartphones stecken Milliarden winziger Transistoren, von denen jeder als ultraschneller Ein-/Aus-Schalter arbeitet. Erst die gezielte Anordnung dieser Milliarden Schalter macht jede Berechnung und jede logische Operation des Geräts möglich.'
    },
    specs:[
      {k:{ar:'الأطراف',en:'Terminals', fr:'Broches', es:'Terminales', de:'Anschlüsse'}, v:{ar:'قاعدة، باعث، مجمّع',en:'Base, emitter, collector', fr:'Base, émetteur, collecteur', es:'Base, emisor, colector', de:'Basis, Emitter, Kollektor'}},
      {k:{ar:'الوظيفة الأساسية',en:'Core function', fr:'Fonction principale', es:'Función principal', de:'Hauptfunktion'}, v:{ar:'تكبير أو تبديل إشارة',en:'Amplifying or switching a signal', fr:'Amplifier ou commuter un signal', es:'Amplificar o conmutar una señal', de:'Signal verstärken oder schalten'}}
    ],
    illustration:'transistor-symbol',
    deeper:{
      ar:'كل قفزة كبيرة في قوة المعالجات على مدار العقود الماضية جت أساسًا من تصغير حجم الترانزستور نفسه، عشان تقدر تحط عدد أكبر بكتير منه في نفس مساحة الشريحة، وأحدث المعالجات دلوقتي فيها ترانزستورات بحجم أصغر من فيروس بكتير.',
      en:'Nearly every big leap in processor power over the past decades came primarily from shrinking the transistor itself, packing far more of them into the same chip area — the newest processors today have transistors far smaller than a virus.', fr:'Presque tous les grands bonds de puissance des processeurs au cours des dernières décennies sont venus avant tout de la miniaturisation du transistor lui-même, qui permet d\'en loger beaucoup plus sur la même surface de puce. Dans les processeurs les plus récents, les transistors sont bien plus petits qu\'un virus.', es:'Casi todos los grandes saltos de potencia de los procesadores en las últimas décadas se deben, sobre todo, a que el propio transistor se ha hecho más pequeño, lo que permite meter muchísimos más en la misma superficie de chip. En los procesadores más nuevos, los transistores son mucho más pequeños que un virus.', de:'Fast jeder große Leistungssprung bei Prozessoren in den letzten Jahrzehnten kam vor allem daher, dass der Transistor selbst geschrumpft ist – so passen weit mehr davon auf dieselbe Chipfläche. In den neuesten Prozessoren sind die Transistoren heute deutlich kleiner als ein Virus.'
    }
  },
  {
    id:'inductors',
    name:{ar:'الملفات (Inductors)', en:'Inductors', fr:'Bobines (inductances)', es:'Bobinas (inductores)', de:'Spulen (Induktivitäten)'},
    summary:{ar:'سلك ملفوف بيقاوم أي تغيير مفاجئ في التيار المار بيه، وبيخزن طاقة في مجال مغناطيسي.', en:'A coiled wire that resists any sudden change in current, storing energy in a magnetic field.', fr:'Un fil enroulé qui s\'oppose à toute variation brusque du courant en stockant de l\'énergie dans un champ magnétique.', es:'Un cable enrollado que se opone a cualquier cambio brusco de corriente y almacena energía en un campo magnético.', de:'Ein aufgewickelter Draht, der sich jeder plötzlichen Stromänderung widersetzt und Energie in einem Magnetfeld speichert.'},
    scientific:{
      ar:'لما تيار يمر في سلك ملفوف على هيئة ملف، بيتولد مجال مغناطيسي حوليه. لو التيار اتغير، المجال المغناطيسي المتغير بيولد جهد معاكس بيقاوم التغيير ده (قانون فاراداي-لينز)، وده اللي بيدي الملف خاصيته المميزة في مقاومة التغيرات المفاجئة في التيار.',
      en:'When current flows through a coiled wire, it generates a surrounding magnetic field. If the current changes, that changing magnetic field induces an opposing voltage that resists the change (Faraday-Lenz law), which is exactly the property that gives an inductor its resistance to sudden current shifts.', fr:'Quand un courant traverse un fil enroulé, il crée un champ magnétique autour de lui. Si le courant varie, ce champ changeant induit une tension opposée qui freine la variation (loi de Faraday-Lenz, selon laquelle la tension induite s\'oppose toujours à sa cause). C\'est précisément cette propriété qui permet à une bobine de résister aux changements brusques de courant.', es:'Cuando la corriente pasa por un cable enrollado, genera un campo magnético a su alrededor. Si la corriente cambia, ese campo variable induce una tensión opuesta que frena el cambio (ley de Faraday-Lenz, según la cual la tensión inducida siempre se opone a su causa). Esa es justo la propiedad que permite a una bobina resistirse a los cambios bruscos de corriente.', de:'Fließt Strom durch einen aufgewickelten Draht, entsteht um ihn herum ein Magnetfeld. Ändert sich der Strom, induziert dieses sich wandelnde Feld eine Gegenspannung, die die Änderung bremst (Faraday-Lenz-Gesetz: Die induzierte Spannung wirkt ihrer Ursache stets entgegen). Genau diese Eigenschaft sorgt dafür, dass eine Spule plötzlichen Stromänderungen Widerstand leistet.'
    },
    practical:{
      ar:'الملفات بتستخدم في تنعيم التيار جوه أي محول كهربائي (بالتزامن مع المكثفات)، وفي دوائر تخزين وتفريغ الطاقة بمحولات الجهد (DC-DC converters)، وكمان في مكبرات الصوت كجزء من فلاتر التردد.',
      en:'Inductors are used to smooth current inside any power adapter (alongside capacitors), in energy storage/release circuits within DC-DC voltage converters, and inside audio speakers as part of frequency filters.', fr:'Les bobines servent à lisser le courant dans tous les adaptateurs secteur (avec les condensateurs), à stocker puis restituer l\'énergie dans les convertisseurs de tension DC-DC (qui transforment une tension continue en une autre), et à filtrer les fréquences dans les haut-parleurs.', es:'Las bobinas se usan para suavizar la corriente en cualquier adaptador de corriente (junto con los condensadores), para almacenar y liberar energía en los convertidores de tensión DC-DC (que transforman una tensión continua en otra) y en los altavoces, como parte de los filtros de frecuencia.', de:'Spulen glätten den Strom in jedem Netzteil (zusammen mit Kondensatoren), speichern und liefern Energie in DC-DC-Spannungswandlern (die eine Gleichspannung in eine andere umsetzen) und sitzen in Lautsprechern als Teil von Frequenzweichen.'
    },
    specs:[
      {k:{ar:'الوحدة',en:'Unit', fr:'Unité', es:'Unidad', de:'Einheit'}, v:{ar:'هنري (H)',en:'Henry (H)', fr:'Henry (H)', es:'Henrio (H)', de:'Henry (H)'}},
      {k:{ar:'استخدام شائع',en:'Common use', fr:'Usage courant', es:'Uso habitual', de:'Typische Anwendung'}, v:{ar:'تنعيم التيار وتحويل الجهد',en:'Smoothing current and voltage conversion', fr:'Lissage du courant et conversion de tension', es:'Suavizar la corriente y convertir la tensión', de:'Stromglättung und Spannungswandlung'}}
    ],
    illustration:'inductor-coil',
    deeper:{
      ar:'الملف والمكثف بيعملوا عكس بعض تقريبًا: المكثف بيقاوم أي تغيير مفاجئ في الجهد بينما الملف بيقاوم أي تغيير مفاجئ في التيار، وده اللي بيخلي دمجهم مع بعض في دوائر معينة يعمل فلاتر بتسمح بمرور ترددات معينة وتمنع غيرها.',
      en:'Inductors and capacitors are almost mirror opposites: a capacitor resists sudden voltage changes while an inductor resists sudden current changes, which is exactly why combining them in certain circuits creates filters that let specific frequencies through while blocking others.', fr:'Bobines et condensateurs sont presque des opposés parfaits : le condensateur s\'oppose aux variations brusques de tension, la bobine aux variations brusques de courant. C\'est justement pour cela qu\'en les associant dans certains circuits, on obtient des filtres qui laissent passer certaines fréquences et en bloquent d\'autres.', es:'Bobinas y condensadores son casi opuestos exactos: el condensador se resiste a los cambios bruscos de tensión y la bobina, a los cambios bruscos de corriente. Por eso, al combinarlos en ciertos circuitos se crean filtros que dejan pasar unas frecuencias y bloquean otras.', de:'Spulen und Kondensatoren sind fast spiegelbildliche Gegenstücke: Ein Kondensator widersetzt sich plötzlichen Spannungsänderungen, eine Spule plötzlichen Stromänderungen. Genau deshalb entstehen aus ihrer Kombination in bestimmten Schaltungen Filter, die manche Frequenzen durchlassen und andere sperren.'
    }
  },
  {
    id:'transformers',
    name:{ar:'المحولات الكهربية (Transformers)', en:'Transformers', fr:'Transformateurs', es:'Transformadores', de:'Transformatoren'},
    summary:{ar:'جهاز برفع أو يخفض جهد التيار المتردد من غير أي أجزاء متحركة خالص.', en:'A device that steps AC voltage up or down with zero moving parts at all.', fr:'Un appareil qui élève ou abaisse une tension alternative sans la moindre pièce mobile.', es:'Un dispositivo que sube o baja la tensión alterna sin ninguna pieza móvil.', de:'Ein Gerät, das Wechselspannung hoch- oder heruntersetzt – ganz ohne bewegliche Teile.'},
    scientific:{
      ar:'المحول بيتكون من ملفين منفصلين ملفوفين حوالين قلب حديدي مشترك: ملف ابتدائي وملف ثانوي. التيار المتردد في الملف الابتدائي بيولد مجال مغناطيسي متغير في القلب الحديدي، والمجال ده بيحث جهد جديد في الملف الثانوي، ونسبة عدد لفات الملفين هي اللي بتحدد نسبة رفع أو خفض الجهد.',
      en:'A transformer consists of two separate coils wound around a shared iron core — a primary and a secondary. AC current in the primary coil creates a changing magnetic field in the core, and that field induces a new voltage in the secondary coil, with the ratio of coil turns determining how much the voltage steps up or down.', fr:'Un transformateur se compose de deux bobines distinctes, le primaire et le secondaire, enroulées autour d\'un même noyau de fer. Le courant alternatif dans le primaire crée un champ magnétique variable dans le noyau, et ce champ induit une nouvelle tension dans le secondaire. C\'est le rapport entre les nombres de spires des deux bobines qui fixe de combien la tension monte ou descend.', es:'Un transformador está formado por dos bobinas separadas, la primaria y la secundaria, enrolladas en un mismo núcleo de hierro. La corriente alterna de la bobina primaria crea un campo magnético variable en el núcleo, y ese campo induce una nueva tensión en la secundaria. La relación entre el número de vueltas de cada bobina determina cuánto sube o baja la tensión.', de:'Ein Transformator besteht aus zwei getrennten Spulen – Primär- und Sekundärspule –, die auf einen gemeinsamen Eisenkern gewickelt sind. Der Wechselstrom in der Primärspule erzeugt im Kern ein wechselndes Magnetfeld, das in der Sekundärspule eine neue Spannung induziert. Das Verhältnis der Windungszahlen bestimmt, wie stark die Spannung herauf- oder herabgesetzt wird.'
    },
    practical:{
      ar:'المحولات هي أساس نقل الكهرباء لمسافات طويلة على جهد عالي جدًا (لتقليل الفقد في الأسلاك) ثم خفضه لجهد آمن قبل ما يوصل للمنازل، وأي شاحن موبايل فيه محول صغير جدًا بيخفض 220 فولت لجهد آمن للبطارية.',
      en:'Transformers are the foundation of transmitting electricity over long distances at very high voltage (to cut wire losses), then stepping it down to a safe voltage before it reaches homes — and any phone charger contains a tiny transformer stepping 220V down to a safe voltage for the battery.', fr:'Les transformateurs sont la clé du transport de l\'électricité sur de longues distances à très haute tension (pour réduire les pertes dans les câbles), puis de son abaissement à une tension sûre avant d\'arriver chez vous. Et chaque chargeur de téléphone contient un petit transformateur qui abaisse le 220V à une tension sans danger pour la batterie.', es:'Los transformadores son la base para transportar electricidad a largas distancias con una tensión muy alta (para reducir las pérdidas en los cables) y luego bajarla a una tensión segura antes de que llegue a las casas. Además, cualquier cargador de móvil lleva un pequeño transformador que baja los 220V a una tensión segura para la batería.', de:'Transformatoren sind die Grundlage dafür, Strom mit sehr hoher Spannung über weite Strecken zu übertragen (um Leitungsverluste zu senken) und ihn dann auf eine sichere Spannung herabzusetzen, bevor er die Haushalte erreicht. Auch jedes Handyladegerät enthält einen winzigen Transformator, der 220V auf eine für den Akku sichere Spannung herunterregelt.'
    },
    specs:[
      {k:{ar:'يشتغل مع',en:'Works with', fr:'Fonctionne avec', es:'Funciona con', de:'Funktioniert mit'}, v:{ar:'التيار المتردد فقط',en:'AC only', fr:'AC uniquement', es:'Solo AC', de:'Nur AC'}},
      {k:{ar:'نسبة الجهد',en:'Voltage ratio', fr:'Rapport de tension', es:'Relación de tensión', de:'Spannungsverhältnis'}, v:{ar:'حسب نسبة عدد اللفات',en:'Set by the coil turns ratio', fr:'Fixé par le rapport du nombre de spires', es:'Lo fija la relación de vueltas', de:'Durch das Windungsverhältnis bestimmt'}}
    ],
    illustration:'transformer-core',
    deeper:{
      ar:'المحول مش بيشتغل خالص مع التيار المستمر، لأن التيار المستمر بيولد مجال مغناطيسي ثابت مش متغير، والمجال الثابت مبيحثش أي جهد في الملف الثانوي، وده بالظبط سبب استخدام التيار المتردد أصلًا في شبكات نقل الكهرباء عالميًا.',
      en:'A transformer simply doesn\'t work with DC at all, because DC creates a constant magnetic field, not a changing one, and a constant field induces no voltage in the secondary coil — which is precisely why AC is used for power grids worldwide in the first place.', fr:'Un transformateur ne fonctionne tout simplement pas en courant continu : le DC crée un champ magnétique constant et non variable, et un champ constant n\'induit aucune tension dans le secondaire. C\'est précisément pour cette raison que les réseaux électriques du monde entier utilisent le courant alternatif.', es:'Un transformador simplemente no funciona con corriente continua, porque la DC crea un campo magnético constante y no variable, y un campo constante no induce ninguna tensión en la bobina secundaria. Precisamente por eso las redes eléctricas de todo el mundo usan corriente alterna.', de:'Mit Gleichstrom funktioniert ein Transformator schlicht nicht: DC erzeugt ein konstantes statt eines wechselnden Magnetfelds, und ein konstantes Feld induziert in der Sekundärspule keine Spannung. Genau deshalb setzen Stromnetze weltweit überhaupt auf Wechselstrom.'
    }
  },
  {
    id:'three-phase',
    name:{ar:'التيار ثلاثي الأطوار (Three-Phase Power)', en:'Three-Phase Power', fr:'Courant triphasé', es:'Corriente trifásica', de:'Drehstrom (Dreiphasenstrom)'},
    summary:{ar:'طريقة نقل كهرباء أقوى وأكثر استقرارًا باستخدام ثلاثة تيارات متزامنة بدل واحد.', en:'A stronger, more stable way to deliver power using three synchronized currents instead of one.', fr:'Une façon plus puissante et plus stable de fournir de l\'énergie, avec trois courants synchronisés au lieu d\'un seul.', es:'Una forma más potente y estable de suministrar energía con tres corrientes sincronizadas en lugar de una.', de:'Eine stärkere, stabilere Art der Energieversorgung mit drei synchronisierten Strömen statt einem.'},
    scientific:{
      ar:'بدل موجة AC واحدة، الشبكة ثلاثية الأطوار بتنقل ثلاث موجات متساوية في التردد والجهد لكن مزاحة زمنيًا عن بعضها بمقدار ثلث الدورة (120 درجة). النتيجة إن مجموع القدرة اللحظية المنقولة بيفضل شبه ثابت طول الوقت، بدل ما يتذبذب زي الطور الواحد.',
      en:'Instead of one AC wave, a three-phase grid carries three equal waves at the same frequency and voltage, offset from each other by a third of a cycle (120 degrees). The result is that total instantaneous delivered power stays nearly constant at all times, instead of pulsing the way single-phase power does.', fr:'Au lieu d\'une seule onde alternative, un réseau triphasé transporte trois ondes identiques, de même fréquence et de même tension, décalées l\'une de l\'autre d\'un tiers de cycle (120 degrés). Résultat : la puissance totale fournie à chaque instant reste presque constante, au lieu de pulser comme en monophasé.', es:'En lugar de una sola onda alterna, una red trifásica lleva tres ondas iguales, con la misma frecuencia y tensión, desfasadas entre sí un tercio de ciclo (120 grados). Así, la potencia total entregada en cada instante se mantiene casi constante, en vez de ir a pulsos como ocurre con la corriente monofásica.', de:'Statt einer einzigen Wechselstromwelle führt ein Drehstromnetz drei gleiche Wellen mit derselben Frequenz und Spannung, die jeweils um ein Drittel einer Periode (120 Grad) gegeneinander verschoben sind. Dadurch bleibt die insgesamt gelieferte Momentanleistung nahezu konstant, statt wie bei Einphasenstrom zu pulsieren.'
    },
    practical:{
      ar:'المصانع والمباني الكبيرة بتستخدم التغذية ثلاثية الأطوار لتشغيل الموتورات الصناعية الكبيرة، لأنها بتديها عزم دوران أنعم وأقوى وأكفأ من نفس الموتور لو اشتغل بطور واحد بس، وده سبب رئيسي ليه المصانع محتاجة توصيلة كهربا مختلفة عن المنازل العادية.',
      en:'Factories and large buildings use three-phase supply to run large industrial motors, because it gives them smoother, stronger, more efficient torque than the same motor running on a single phase alone — a key reason factories need a different electrical connection from ordinary homes.', fr:'Usines et grands bâtiments utilisent le triphasé pour faire tourner les gros moteurs industriels, qui obtiennent ainsi un couple plus régulier, plus fort et plus efficace qu\'en monophasé. C\'est l\'une des principales raisons pour lesquelles une usine a besoin d\'un raccordement électrique différent de celui d\'un logement ordinaire.', es:'Las fábricas y los edificios grandes usan suministro trifásico para mover grandes motores industriales, porque así obtienen un par más suave, más fuerte y más eficiente que el mismo motor con una sola fase. Es una de las razones clave por las que una fábrica necesita una conexión eléctrica distinta a la de una vivienda normal.', de:'Fabriken und große Gebäude nutzen Drehstrom für große Industriemotoren, weil er ihnen ein gleichmäßigeres, stärkeres und effizienteres Drehmoment liefert als derselbe Motor an nur einer Phase. Das ist ein wichtiger Grund, warum Fabriken einen anderen Stromanschluss brauchen als normale Wohnhäuser.'
    },
    specs:[
      {k:{ar:'عدد الأطوار',en:'Number of phases', fr:'Nombre de phases', es:'Número de fases', de:'Anzahl der Phasen'}, v:'3'},
      {k:{ar:'الإزاحة الزمنية بين الأطوار',en:'Phase offset', fr:'Décalage de phase', es:'Desfase', de:'Phasenverschiebung'}, v:'120°'}
    ],
    illustration:'three-phase-wave',
    deeper:{
      ar:'من فوائد ثلاثي الأطوار الأقل شهرة إنه بيسمح بتوصيلتين مختلفتين للموتورات: توصيلة نجمة (Star) بتدي جهد أقل وعزم بدء أقل وأنعم، وتوصيلة مثلث (Delta) بتدي جهد أعلى وعزم بدء أقوى، وده أساس طريقة بدء التشغيل نجمة-مثلث اللي بتستخدم لتقليل تيار الاندفاع في الموتورات الكبيرة.',
      en:'One less-known benefit of three-phase is that it allows two different motor connections: a star (Y) connection giving lower voltage and a gentler, lower starting torque, and a delta connection giving higher voltage and stronger starting torque — exactly the basis of the star-delta starting method used to cut inrush current on large motors.', fr:'Un avantage moins connu du triphasé : il permet deux branchements différents du moteur. Le couplage étoile (Y) donne une tension plus basse et un couple de démarrage plus doux et plus faible, le couplage triangle (delta) une tension plus élevée et un couple de démarrage plus fort. C\'est tout le principe du démarrage étoile-triangle, utilisé pour limiter le courant d\'appel des gros moteurs.', es:'Una ventaja menos conocida de la corriente trifásica es que permite dos conexiones distintas del motor: la conexión en estrella (Y), con menor tensión y un par de arranque más suave y bajo, y la conexión en triángulo (delta), con mayor tensión y un par de arranque más fuerte. Esa es la base del arranque estrella-triángulo, que se usa para reducir la corriente de arranque en motores grandes.', de:'Ein weniger bekannter Vorteil von Drehstrom: Er erlaubt zwei verschiedene Motorschaltungen. Die Sternschaltung (Y) liefert eine niedrigere Spannung und ein sanfteres, geringeres Anlaufmoment, die Dreieckschaltung (Delta) eine höhere Spannung und ein stärkeres Anlaufmoment. Genau darauf beruht der Stern-Dreieck-Anlauf, mit dem man den Einschaltstrom großer Motoren begrenzt.'
    }
  },
  {
    id:'digital-analog',
    name:{ar:'الإشارة الرقمية والتناظرية', en:'Digital vs Analog Signals', fr:'Signaux numériques et analogiques', es:'Señales digitales y analógicas', de:'Digitale und analoge Signale'},
    summary:{ar:'إشارة بتتغير بسلاسة عبر قيم لا نهائية، مقابل إشارة بتاخد قيمتين ثابتتين بس.', en:'A signal that changes smoothly across infinite values, versus one that only ever takes two fixed values.', fr:'Un signal qui varie en douceur sur une infinité de valeurs, face à un signal qui ne prend que deux valeurs fixes.', es:'Una señal que cambia de forma suave entre infinitos valores frente a otra que solo toma dos valores fijos.', de:'Ein Signal, das stufenlos unendlich viele Werte annimmt, im Vergleich zu einem, das nur zwei feste Werte kennt.'},
    scientific:{
      ar:'الإشارة التناظرية (Analog) بتتغير باستمرار وبسلاسة عبر مدى كامل من القيم، زي موجة صوت حقيقية. الإشارة الرقمية (Digital) بتاخد قيمتين ثابتتين بس عادة (0 و1، أو تشغيل وإطفاء)، وأي معلومة تانية بتتشفر عن طريق تتابع سريع جدًا من التشغيل والإطفاء ده.',
      en:'An analog signal varies continuously and smoothly across a full range of values, like a real sound wave. A digital signal typically only ever takes two fixed values (0 and 1, or on and off), and any other information gets encoded as a very fast sequence of those on/off states.', fr:'Un signal analogique varie de façon continue et progressive sur toute une plage de valeurs, comme une véritable onde sonore. Un signal numérique ne prend généralement que deux valeurs fixes (0 et 1, ou allumé et éteint), et toute autre information est codée sous forme d\'une suite très rapide de ces états.', es:'Una señal analógica varía de forma continua y suave en todo un rango de valores, como una onda de sonido real. Una señal digital normalmente solo toma dos valores fijos (0 y 1, o encendido y apagado), y cualquier otra información se codifica como una secuencia muy rápida de esos estados.', de:'Ein analoges Signal ändert sich kontinuierlich und fließend über einen ganzen Wertebereich, wie eine echte Schallwelle. Ein digitales Signal kennt meist nur zwei feste Werte (0 und 1 bzw. ein und aus), und jede weitere Information wird als sehr schnelle Abfolge dieser Zustände codiert.'
    },
    practical:{
      ar:'الميكروفون بيلتقط صوتك كإشارة تناظرية، لكن الموبايل بيحولها فورًا لإشارة رقمية (تحويل تناظري-رقمي) عشان يقدر يخزنها أو يبعتها من غير ما تتأثر بالضوضاء زي الإشارة التناظرية الأصلية اللي بتضعف مع المسافة.',
      en:'A microphone captures your voice as an analog signal, but a phone immediately converts it into a digital signal (analog-to-digital conversion) so it can be stored or transmitted without degrading from noise the way the original analog signal would over distance.', fr:'Un micro capte votre voix sous forme de signal analogique, mais le téléphone la convertit aussitôt en signal numérique (conversion analogique-numérique). Elle peut alors être stockée ou transmise sans être dégradée par le bruit, comme le serait le signal analogique d\'origine sur la distance.', es:'Un micrófono capta tu voz como una señal analógica, pero el móvil la convierte al instante en señal digital (conversión analógico-digital) para poder guardarla o enviarla sin que el ruido la degrade, como le pasaría a la señal analógica original con la distancia.', de:'Ein Mikrofon nimmt Ihre Stimme als analoges Signal auf, doch das Smartphone wandelt sie sofort in ein digitales Signal um (Analog-Digital-Wandlung). So lässt sie sich speichern oder übertragen, ohne durch Rauschen zu leiden – anders als das ursprüngliche analoge Signal über größere Entfernungen.'
    },
    specs:[
      {k:{ar:'قيم تناظرية',en:'Analog values', fr:'Valeurs analogiques', es:'Valores analógicos', de:'Analoge Werte'}, v:{ar:'مستمرة وغير محدودة',en:'Continuous, unlimited', fr:'Continues, illimitées', es:'Continuos, ilimitados', de:'Kontinuierlich, unbegrenzt'}},
      {k:{ar:'قيم رقمية',en:'Digital values', fr:'Valeurs numériques', es:'Valores digitales', de:'Digitale Werte'}, v:{ar:'ثابتتان (0 و1)',en:'Fixed (0 and 1)', fr:'Fixes (0 et 1)', es:'Fijos (0 y 1)', de:'Fest (0 und 1)'}}
    ],
    illustration:'binary-wave',
    deeper:{
      ar:'الميزة الكبرى للإشارة الرقمية إنها أكتر مقاومة للضوضاء: لو ضوضاء صغيرة أثرت على إشارة تناظرية، القيمة بتتشوه فورًا وبشكل دائم، أما لو نفس الضوضاء أثرت على إشارة رقمية، طالما مأثرتش بشكل كافي تقلب 0 لـ1، المعلومة بتفضل سليمة تمامًا، وده سبب رئيسي لتفوق الأنظمة الرقمية في نقل وتخزين المعلومات بدقة عالية.',
      en:'The big advantage of digital signals is far greater noise resistance: a small noise hit on an analog signal instantly and permanently distorts its value, while the same noise on a digital signal leaves the information perfectly intact as long as it isn\'t strong enough to flip a 0 into a 1 — a key reason digital systems excel at transmitting and storing information with high accuracy.', fr:'Le grand atout des signaux numériques, c\'est leur bien meilleure résistance au bruit. Une petite perturbation sur un signal analogique déforme immédiatement et définitivement sa valeur. Sur un signal numérique, la même perturbation laisse l\'information parfaitement intacte, tant qu\'elle n\'est pas assez forte pour transformer un 0 en 1. C\'est l\'une des raisons pour lesquelles les systèmes numériques excellent à transmettre et stocker l\'information avec une grande précision.', es:'La gran ventaja de las señales digitales es que resisten mucho mejor el ruido. Una pequeña perturbación en una señal analógica distorsiona su valor al instante y para siempre, mientras que esa misma perturbación en una señal digital deja la información intacta, siempre que no sea tan fuerte como para convertir un 0 en un 1. Por eso los sistemas digitales son tan buenos transmitiendo y almacenando información con gran precisión.', de:'Der große Vorteil digitaler Signale ist ihre weit höhere Störfestigkeit. Schon eine kleine Störung verfälscht ein analoges Signal sofort und dauerhaft. Bei einem digitalen Signal bleibt die Information bei derselben Störung dagegen völlig erhalten – solange sie nicht stark genug ist, um aus einer 0 eine 1 zu machen. Das ist ein Hauptgrund, warum digitale Systeme Informationen so präzise übertragen und speichern.'
    }
  },
  {
    id:'semiconductors',
    name:{ar:'أشباه الموصلات (Semiconductors)', en:'Semiconductors', fr:'Semi-conducteurs', es:'Semiconductores', de:'Halbleiter'},
    summary:{ar:'مواد ذكية موصليتها الكهربية ممكن تتحكم فيها، وأساس كل الإلكترونيات الحديثة.', en:'Smart materials whose electrical conductivity can be controlled — the basis of all modern electronics.', fr:'Des matériaux « intelligents » dont on peut contrôler la conductivité électrique, à la base de toute l\'électronique moderne.', es:'Materiales «inteligentes» cuya conductividad eléctrica se puede controlar: la base de toda la electrónica moderna.', de:'Clevere Materialien, deren elektrische Leitfähigkeit sich steuern lässt – die Grundlage aller modernen Elektronik.'},
    scientific:{
      ar:'أشباه الموصلات (زي السيليكون) موصليتها الكهربية بين المعادن (موصل جيد جدًا) والعوازل (مش موصلة خالص). إضافة كميات دقيقة جدًا من عناصر تانية لبلورة السيليكون (عملية اسمها التطعيم أو Doping) بتغير موصليتها بشكل متحكم فيه بدقة، وده اللي بيمكّن صناعة الدايودات والترانزستورات.',
      en:'Semiconductors (like silicon) have conductivity somewhere between metals (excellent conductors) and insulators (non-conductive at all). Adding tiny precise amounts of other elements to a silicon crystal, a process called doping, controllably alters its conductivity, which is exactly what makes manufacturing diodes and transistors possible.', fr:'Les semi-conducteurs (comme le silicium) ont une conductivité située entre celle des métaux (excellents conducteurs) et celle des isolants (qui ne conduisent pas du tout). En ajoutant à un cristal de silicium des quantités infimes et précises d\'autres éléments, un procédé appelé dopage, on modifie sa conductivité de façon contrôlée. C\'est précisément ce qui permet de fabriquer diodes et transistors.', es:'Los semiconductores (como el silicio) tienen una conductividad a medio camino entre los metales (excelentes conductores) y los aislantes (que no conducen nada). Si se añaden cantidades diminutas y precisas de otros elementos a un cristal de silicio, un proceso llamado dopaje, su conductividad cambia de forma controlada, y eso es justo lo que hace posible fabricar diodos y transistores.', de:'Halbleiter (wie Silizium) haben eine Leitfähigkeit irgendwo zwischen Metallen (hervorragende Leiter) und Isolatoren (die gar nicht leiten). Gibt man einem Siliziumkristall winzige, genau dosierte Mengen anderer Elemente bei – ein Vorgang namens Dotierung –, verändert sich seine Leitfähigkeit gezielt. Genau das macht die Herstellung von Dioden und Transistoren möglich.'
    },
    practical:{
      ar:'كل شريحة إلكترونية في أي جهاز حولك، من الموبايل للثلاجة، مبنية أساسًا على بلورات سيليكون مطعّمة بدقة فائقة، وصناعة أشباه الموصلات دي من أكتر الصناعات تعقيدًا وحساسية في العالم، محتاجة نظافة تفوق غرف العمليات الجراحية.',
      en:'Every electronic chip in every device around you, from a phone to a refrigerator, is fundamentally built on silicon crystals doped with extreme precision, and semiconductor manufacturing is one of the most complex, sensitive industries in the world, requiring cleanliness that exceeds a surgical operating room.', fr:'Chaque puce électronique qui vous entoure, du téléphone au réfrigérateur, repose fondamentalement sur des cristaux de silicium dopés avec une précision extrême. La fabrication des semi-conducteurs est l\'une des industries les plus complexes et les plus délicates au monde, avec des exigences de propreté supérieures à celles d\'un bloc opératoire.', es:'Cada chip electrónico de los aparatos que te rodean, del móvil a la nevera, se basa en cristales de silicio dopados con una precisión extrema. La fabricación de semiconductores es una de las industrias más complejas y delicadas del mundo, y exige una limpieza superior a la de un quirófano.', de:'Jeder elektronische Chip in den Geräten um Sie herum, vom Smartphone bis zum Kühlschrank, beruht im Kern auf Siliziumkristallen, die mit äußerster Präzision dotiert wurden. Die Halbleiterfertigung gehört zu den komplexesten und empfindlichsten Industrien der Welt und verlangt eine Sauberkeit, die jeden OP-Saal übertrifft.'
    },
    specs:[
      {k:{ar:'أشهر مادة',en:'Most common material', fr:'Matériau le plus courant', es:'Material más común', de:'Häufigstes Material'}, v:{ar:'السيليكون',en:'Silicon', fr:'Silicium', es:'Silicio', de:'Silizium'}},
      {k:{ar:'العملية الأساسية',en:'Core process', fr:'Procédé clé', es:'Proceso clave', de:'Kernprozess'}, v:{ar:'التطعيم (Doping)',en:'Doping', fr:'Dopage', es:'Dopaje', de:'Dotierung'}}
    ],
    illustration:'semiconductor-band',
    deeper:{
      ar:'التطعيم بيتم بنوعين: تطعيم من النوع N بيضيف إلكترونات إضافية حرة الحركة، وتطعيم من النوع P بيخلق "فجوات" ناقصة إلكترون بتتصرف كأنها شحنة موجبة متحركة. ملتقى منطقة N مع منطقة P هو بالظبط اللي بيكوّن الدايود، وده أبسط مثال على قوة التطعيم في بناء عناصر إلكترونية كاملة من مادة واحدة.',
      en:'Doping comes in two types: N-type adds extra freely-moving electrons, while P-type creates electron-missing "holes" that behave like a moving positive charge. The junction where an N region meets a P region is exactly what forms a diode — the simplest example of how doping can build complete electronic components out of a single material.', fr:'Il existe deux types de dopage. Le type N ajoute des électrons supplémentaires libres de se déplacer, tandis que le type P crée des « trous » (des places où il manque un électron) qui se comportent comme une charge positive mobile. La jonction entre une zone N et une zone P forme justement une diode : l\'exemple le plus simple de la façon dont le dopage permet de construire des composants électroniques complets à partir d\'un seul matériau.', es:'El dopaje es de dos tipos: el tipo N añade electrones extra que se mueven libremente, y el tipo P crea «huecos» (lugares donde falta un electrón) que se comportan como una carga positiva en movimiento. La unión entre una zona N y una zona P es justo lo que forma un diodo, el ejemplo más sencillo de cómo el dopaje permite construir componentes electrónicos completos a partir de un solo material.', de:'Es gibt zwei Arten der Dotierung: Beim N-Typ kommen zusätzliche frei bewegliche Elektronen hinzu, beim P-Typ entstehen „Löcher“ (Stellen, an denen ein Elektron fehlt), die sich wie eine wandernde positive Ladung verhalten. Wo ein N-Bereich auf einen P-Bereich trifft, entsteht eine Diode – das einfachste Beispiel dafür, wie sich durch Dotierung komplette elektronische Bauteile aus einem einzigen Material bauen lassen.'
    }
  },
  {
    id:'grounding',
    name:{ar:'التأريض (Grounding/Earthing)', en:'Grounding (Earthing)', fr:'Mise à la terre', es:'Puesta a tierra', de:'Erdung'},
    summary:{ar:'مسار أمان بديل بيوجه أي تسريب كهربي بعيد عن جسم الإنسان ومباشرة للأرض.', en:'A safe alternate path that routes any electrical leakage away from a person and straight into the earth.', fr:'Un chemin de secours sûr qui évacue toute fuite électrique loin des personnes, directement dans la terre.', es:'Un camino alternativo seguro que desvía cualquier fuga eléctrica lejos de las personas y directamente a tierra.', de:'Ein sicherer Ausweichweg, der Fehlerströme von Menschen fernhält und direkt ins Erdreich ableitet.'},
    scientific:{
      ar:'التأريض بيربط الأجزاء المعدنية غير الموصلة عادةً (زي هيكل جهاز كهربائي) بسلك موصل مباشرة للأرض، اللي بتعتبر مصدر أو مصرف شحنة عمليًا لا نهائي. لو حصل تماس بين سلك حي وهيكل الجهاز، التيار بيلاقي مسار أسهل بكتير للأرض عن مسار جسم الإنسان، فبيقل خطر الصدمة الكهربية بشكل كبير.',
      en:'Grounding connects normally non-conductive metal parts (like an appliance\'s casing) to a conductor running directly into the earth, which acts as a practically infinite charge source or sink. If a live wire touches the casing, current finds a far easier path to earth than through a person\'s body, dramatically cutting shock risk.', fr:'La mise à la terre relie les parties métalliques normalement hors tension (comme le boîtier d\'un appareil) à un conducteur qui descend directement dans le sol, lequel agit comme un réservoir de charges pratiquement infini. Si un fil sous tension touche le boîtier, le courant trouve un chemin vers la terre bien plus facile que le corps humain, ce qui réduit considérablement le risque d\'électrocution.', es:'La puesta a tierra conecta las partes metálicas que normalmente no llevan corriente (como la carcasa de un electrodoméstico) a un conductor que va directo a la tierra, que actúa como una fuente o sumidero de carga prácticamente infinito. Si un cable con tensión toca la carcasa, la corriente encuentra un camino hacia tierra mucho más fácil que el cuerpo de una persona, lo que reduce muchísimo el riesgo de descarga.', de:'Die Erdung verbindet normalerweise spannungsfreie Metallteile (etwa das Gehäuse eines Geräts) mit einem Leiter, der direkt ins Erdreich führt – und das wirkt praktisch wie ein unendlicher Ladungsspeicher. Berührt ein spannungsführender Draht das Gehäuse, findet der Strom einen viel leichteren Weg zur Erde als durch den Körper eines Menschen. Das senkt die Stromschlaggefahr drastisch.'
    },
    practical:{
      ar:'أي مقبس كهربا حديث فيه ثلاثة أطراف مش اتنين، الطرف الثالث ده هو التأريض، وقطعه أو تجاهله (زي استخدام محول بطرفين بس) بيلغي طبقة الحماية دي بالكامل حتى لو الجهاز شغال عادي وميديش أي علامة على وجود مشكلة.',
      en:'Any modern power outlet has three prongs, not two — that third prong is the ground connection, and cutting it or bypassing it (like using a two-prong adapter) completely removes that protective layer, even if the device runs perfectly normally with no sign of a problem.', fr:'Toute prise moderne a trois contacts et non deux : le troisième, c\'est la terre. Le couper ou le contourner (par exemple avec un adaptateur à deux broches) supprime totalement cette protection, même si l\'appareil fonctionne parfaitement sans aucun signe de problème.', es:'Cualquier enchufe moderno tiene tres contactos, no dos: ese tercer contacto es la toma de tierra. Cortarlo o saltárselo (por ejemplo, con un adaptador de dos patas) elimina por completo esa capa de protección, aunque el aparato funcione con total normalidad y sin señales de problema.', de:'Jede moderne Steckdose hat drei Kontakte statt zwei – der dritte ist der Schutzleiter. Wer ihn kappt oder umgeht (etwa mit einem zweipoligen Adapter), entfernt diese Schutzschicht vollständig, selbst wenn das Gerät ganz normal und ohne erkennbares Problem läuft.'
    },
    specs:[
      {k:{ar:'عدد أطراف المقبس الحديث',en:'Modern outlet prongs', fr:'Contacts d\'une prise moderne', es:'Contactos de un enchufe moderno', de:'Kontakte moderner Steckdosen'}, v:'3'},
      {k:{ar:'الوظيفة الأساسية',en:'Core function', fr:'Fonction principale', es:'Función principal', de:'Hauptfunktion'}, v:{ar:'توفير مسار آمن للتسريب',en:'Providing a safe leakage path', fr:'Offrir un chemin de fuite sûr', es:'Ofrecer un camino seguro para las fugas', de:'Sicheren Ableitweg für Fehlerströme bieten'}}
    ],
    illustration:'ground-symbol',
    deeper:{
      ar:'التأريض مش نفسه القاطع التفاضلي (RCD/GFCI)، الاتنين بيشتغلوا مع بعض لكن بطريقة مختلفة: التأريض بيوفر مسار بديل للتيار، بينما القاطع التفاضلي بيراقب باستمرار الفرق بين التيار الداخل والخارج من الدائرة، ولو لاحظ أي فرق ولو صغير جدًا (علامة على تسريب) بيقطع الكهرباء فورًا في أجزاء من الثانية.',
      en:'Grounding is not the same as a residual-current device (RCD/GFCI) — the two work together but differently: grounding provides an alternate current path, while an RCD continuously monitors the difference between current entering and leaving a circuit, cutting power instantly, in a fraction of a second, if it detects even a tiny mismatch (a sign of leakage).', fr:'La mise à la terre n\'est pas la même chose qu\'un dispositif différentiel RCD/GFCI (qui coupe le courant en cas de fuite) : les deux travaillent ensemble, mais différemment. La terre offre un chemin alternatif au courant, tandis que le RCD surveille en continu la différence entre le courant qui entre dans un circuit et celui qui en sort, et coupe l\'alimentation instantanément, en une fraction de seconde, dès qu\'il détecte le moindre écart (signe d\'une fuite).', es:'La puesta a tierra no es lo mismo que un diferencial RCD/GFCI (dispositivo que corta la corriente si detecta una fuga): ambos trabajan juntos, pero de forma distinta. La toma de tierra ofrece un camino alternativo para la corriente, mientras que el RCD vigila continuamente la diferencia entre la corriente que entra y la que sale de un circuito, y corta la alimentación al instante, en una fracción de segundo, si detecta la más mínima diferencia (señal de una fuga).', de:'Erdung ist nicht dasselbe wie ein RCD/GFCI (Fehlerstrom-Schutzschalter, der bei Fehlerströmen abschaltet): Beide arbeiten zusammen, aber auf unterschiedliche Weise. Die Erdung bietet dem Strom einen alternativen Weg, während der RCD ständig den Unterschied zwischen dem in einen Stromkreis hinein- und dem herausfließenden Strom überwacht. Erkennt er auch nur eine winzige Abweichung (ein Zeichen für einen Fehlerstrom), schaltet er den Strom in Sekundenbruchteilen ab.'
    }
  },
  {
    id:'fuses-breakers',
    name:{ar:'الفيوزات والقواطع الكهربية', en:'Fuses and Circuit Breakers', fr:'Fusibles et disjoncteurs', es:'Fusibles e interruptores automáticos', de:'Sicherungen und Leitungsschutzschalter'},
    summary:{ar:'خط الدفاع الأول اللي بيقطع الكهرباء تلقائيًا قبل ما تيار زايد يحرق الأسلاك أو يسبب حريق.', en:'The first line of defense that automatically cuts power before excess current burns wiring or starts a fire.', fr:'La première ligne de défense, qui coupe automatiquement le courant avant qu\'un excès ne fasse fondre les câbles ou ne déclenche un incendie.', es:'La primera línea de defensa: corta la corriente automáticamente antes de que un exceso queme el cableado o provoque un incendio.', de:'Die erste Verteidigungslinie: Sie unterbricht den Strom automatisch, bevor zu viel Strom Leitungen verschmoren lässt oder einen Brand auslöst.'},
    scientific:{
      ar:'الفيوز سلك معدني رفيع مصمم يدوب وينقطع فورًا لو التيار المار فيه تعدى قيمة معينة، وده بيقطع الدائرة كليًا. القاطع الكهربائي (Breaker) بيعمل نفس الوظيفة لكن عن طريق آلية ميكانيكية أو كهرومغناطيسية بتفصل الدائرة بدل ما تدوب، وده اللي بيخليه قابل لإعادة التشغيل بعد ما السبب يتصلح، عكس الفيوز اللي لازم يتغير.',
      en:'A fuse is a thin metal wire designed to melt and break instantly if current through it exceeds a set value, cutting the circuit entirely. A circuit breaker does the same job but through a mechanical or electromagnetic mechanism that disconnects the circuit rather than melting, which lets it be reset once the cause is fixed, unlike a fuse that must be replaced.', fr:'Un fusible est un fin fil métallique conçu pour fondre et se rompre instantanément si le courant qui le traverse dépasse une valeur donnée, ce qui coupe complètement le circuit. Un disjoncteur fait le même travail, mais grâce à un mécanisme mécanique ou électromagnétique qui ouvre le circuit au lieu de fondre. On peut donc le réarmer une fois le problème réglé, alors qu\'un fusible doit être remplacé.', es:'Un fusible es un hilo metálico fino diseñado para fundirse y romperse al instante si la corriente que lo atraviesa supera un valor determinado, cortando el circuito por completo. Un interruptor automático hace lo mismo, pero con un mecanismo mecánico o electromagnético que desconecta el circuito en lugar de fundirse, así que se puede rearmar cuando se soluciona la causa, mientras que el fusible hay que cambiarlo.', de:'Eine Schmelzsicherung ist ein dünner Metalldraht, der sofort schmilzt und durchbrennt, wenn der Strom einen festgelegten Wert überschreitet – damit ist der Stromkreis vollständig unterbrochen. Ein Leitungsschutzschalter erledigt dieselbe Aufgabe, trennt den Stromkreis aber mechanisch oder elektromagnetisch, statt zu schmelzen. Deshalb lässt er sich nach Behebung der Ursache wieder einschalten, während eine Sicherung ersetzt werden muss.'
    },
    practical:{
      ar:'أي لوحة كهرباء منزلية حديثة فيها قواطع بدل الفيوزات القديمة، لأنها أسرع في إعادة التشغيل وأسهل في الصيانة، لكن المبدأ الأساسي واحد: حماية الأسلاك والأجهزة من تيار زايد عن الحد الآمن بيهدد يسبب حريق.',
      en:'Any modern home electrical panel uses breakers instead of old-style fuses, since they\'re faster to reset and easier to maintain, but the core principle is the same: protecting wiring and devices from excess current that risks starting a fire.', fr:'Les tableaux électriques modernes utilisent des disjoncteurs plutôt que des fusibles à l\'ancienne, car ils se réarment plus vite et s\'entretiennent plus facilement. Mais le principe reste le même : protéger câbles et appareils contre un excès de courant qui risquerait de provoquer un incendie.', es:'Los cuadros eléctricos modernos usan interruptores automáticos en lugar de los fusibles de antes, porque se rearman más rápido y son más fáciles de mantener. Pero el principio es el mismo: proteger el cableado y los aparatos de un exceso de corriente que podría provocar un incendio.', de:'Moderne Sicherungskästen nutzen Leitungsschutzschalter statt altmodischer Schmelzsicherungen, weil sie sich schneller wieder einschalten lassen und wartungsfreundlicher sind. Das Grundprinzip bleibt aber gleich: Leitungen und Geräte vor zu hohem Strom schützen, der einen Brand auslösen könnte.'
    },
    specs:[
      {k:{ar:'الفيوز',en:'Fuse', fr:'Fusible', es:'Fusible', de:'Sicherung'}, v:{ar:'يستهلك مرة واحدة',en:'Single-use, must be replaced', fr:'À usage unique, à remplacer', es:'De un solo uso, hay que cambiarlo', de:'Einweg, muss ersetzt werden'}},
      {k:{ar:'القاطع',en:'Breaker', fr:'Disjoncteur', es:'Interruptor automático', de:'Leitungsschutzschalter'}, v:{ar:'قابل لإعادة التشغيل',en:'Resettable', fr:'Réarmable', es:'Rearmable', de:'Wieder einschaltbar'}}
    ],
    illustration:'fuse-break',
    deeper:{
      ar:'اختيار قيمة الفيوز أو القاطع مش تخمين عشوائي، لازم يتحسب بناءً على أقصى تيار آمن للسلك نفسه (اللي بيعتمد على سمك السلك وطول المسار)، مش بس على استهلاك الجهاز المتوقع، عشان لو حد غير الجهاز بجهاز أقوى يسحب تيار أعلى، السلك نفسه يفضل محمي زي ما هو.',
      en:'Choosing a fuse or breaker rating isn\'t a random guess — it must be calculated based on the maximum safe current for the wire itself (which depends on wire thickness and run length), not just the expected device load, so that if someone later swaps in a stronger device drawing more current, the wire itself stays protected regardless.', fr:'Le calibre d\'un fusible ou d\'un disjoncteur ne se choisit pas au hasard. Il doit être calculé d\'après le courant maximal que le câble peut supporter sans danger (qui dépend de sa section et de sa longueur), et pas seulement d\'après la charge prévue. Ainsi, si quelqu\'un branche plus tard un appareil plus puissant qui tire davantage de courant, le câble reste protégé quoi qu\'il arrive.', es:'El calibre de un fusible o de un interruptor automático no se elige al azar: hay que calcularlo según la corriente máxima segura del propio cable (que depende de su grosor y de su longitud), no solo según la carga prevista del aparato. Así, si alguien conecta más adelante un aparato más potente que consume más corriente, el cable seguirá protegido pase lo que pase.', de:'Der Nennwert einer Sicherung oder eines Leitungsschutzschalters ist kein Zufallswert. Er muss anhand des maximal zulässigen Stroms der Leitung selbst berechnet werden (der von Querschnitt und Länge abhängt) – nicht nur anhand der erwarteten Last. Schließt später jemand ein stärkeres Gerät mit höherem Stromverbrauch an, bleibt die Leitung trotzdem geschützt.'
    }
  },
  {
    id:'switches-relays',
    name:{ar:'المفاتيح والريلايات (Switches & Relays)', en:'Switches and Relays', fr:'Interrupteurs et relais', es:'Interruptores y relés', de:'Schalter und Relais'},
    summary:{ar:'مفتاح بتشغله بإيدك، ومفتاح تاني بتشغله إشارة كهربية صغيرة بدل إيدك.', en:'A switch your hand flips, and another kind a small electrical signal flips instead of your hand.', fr:'Un interrupteur qu\'on actionne à la main, et un autre qu\'un petit signal électrique actionne à sa place.', es:'Un interruptor que acciona tu mano y otro que acciona una pequeña señal eléctrica en su lugar.', de:'Ein Schalter, den Ihre Hand betätigt – und einer, den stattdessen ein kleines elektrisches Signal umlegt.'},
    scientific:{
      ar:'المفتاح العادي عنصر ميكانيكي بسيط بيوصل أو يفصل الدائرة يدويًا. الريلاي مفتاح كهرومغناطيسي: إشارة كهربية صغيرة بتغذي ملف داخلي، والملف ده بيولد مجال مغناطيسي بيجذب ذراع معدني يقفل أو يفتح دائرة تانية منفصلة تمامًا، وممكن تكون بجهد أو تيار أعلى بكتير من إشارة التحكم الأصلية.',
      en:'An ordinary switch is a simple mechanical part that manually connects or breaks a circuit. A relay is an electromagnetic switch: a small electrical signal energizes an internal coil, and that coil creates a magnetic field pulling a metal arm to close or open a completely separate circuit — one that can carry a far higher voltage or current than the original control signal.', fr:'Un interrupteur ordinaire est une simple pièce mécanique qui ouvre ou ferme un circuit à la main. Un relais, lui, est un interrupteur électromagnétique : un petit signal électrique alimente une bobine interne, dont le champ magnétique attire un bras métallique qui ferme ou ouvre un circuit totalement séparé. Ce second circuit peut transporter une tension ou un courant bien plus élevés que le signal de commande.', es:'Un interruptor normal es una pieza mecánica sencilla que abre o cierra un circuito a mano. Un relé es un interruptor electromagnético: una pequeña señal eléctrica activa una bobina interna, y esa bobina crea un campo magnético que atrae un brazo metálico para cerrar o abrir un circuito totalmente independiente, que puede llevar una tensión o una corriente mucho mayores que la señal de control original.', de:'Ein gewöhnlicher Schalter ist ein einfaches mechanisches Bauteil, das einen Stromkreis von Hand schließt oder öffnet. Ein Relais ist dagegen ein elektromagnetischer Schalter: Ein kleines elektrisches Signal speist eine interne Spule, deren Magnetfeld einen Metallarm anzieht. Dieser schließt oder öffnet einen völlig getrennten Stromkreis, der eine weit höhere Spannung oder Stromstärke führen kann als das Steuersignal.'
    },
    practical:{
      ar:'الريلاي هو اللي بيسمح لدائرة تحكم ضعيفة جدًا (زي إشارة من مايكروكنترولر بجهد 5 فولت بس) إنها تتحكم في حمل قوي جدًا (زي موتور أو لمبة بجهد 220 فولت)، من غير ما التيار العالي يمر خالص جوه دائرة التحكم الحساسة.',
      en:'A relay is exactly what lets a very weak control circuit (like a 5-volt signal from a microcontroller) control a very powerful load (like a motor or a 220-volt lamp), without the high current ever passing through the sensitive control circuit at all.', fr:'Le relais permet justement à un circuit de commande très faible (comme un signal de 5 volts issu d\'un microcontrôleur) de piloter une charge très puissante (un moteur ou une lampe en 220 volts, par exemple), sans que le fort courant ne traverse jamais le circuit de commande, plus fragile.', es:'Un relé es justo lo que permite que un circuito de control muy débil (como una señal de 5 voltios de un microcontrolador) controle una carga muy potente (como un motor o una lámpara de 220 voltios), sin que la corriente alta pase nunca por el delicado circuito de control.', de:'Genau ein Relais ermöglicht es, dass ein sehr schwacher Steuerkreis (etwa ein 5-Volt-Signal eines Mikrocontrollers) eine sehr starke Last steuert (zum Beispiel einen Motor oder eine 220-Volt-Lampe), ohne dass der hohe Strom jemals durch den empfindlichen Steuerkreis fließt.'
    },
    specs:[
      {k:{ar:'المفتاح العادي',en:'Ordinary switch', fr:'Interrupteur ordinaire', es:'Interruptor normal', de:'Gewöhnlicher Schalter'}, v:{ar:'تحكم يدوي مباشر',en:'Direct manual control', fr:'Commande manuelle directe', es:'Control manual directo', de:'Direkte manuelle Steuerung'}},
      {k:{ar:'الريلاي',en:'Relay', fr:'Relais', es:'Relé', de:'Relais'}, v:{ar:'تحكم كهربي غير مباشر',en:'Indirect electrical control', fr:'Commande électrique indirecte', es:'Control eléctrico indirecto', de:'Indirekte elektrische Steuerung'}}
    ],
    illustration:'switch-relay',
    deeper:{
      ar:'الريلايات الميكانيكية التقليدية فيها جزء متحرك فعليًا (بيسمع صوت طقطقة خفيف لما يشتغل)، وده بيحد من عدد مرات التبديل قبل ما يتآكل، عشان كده في التطبيقات اللي محتاجة تبديل سريع جدًا ومتكرر بيتم استبداله بريلاي بالحالة الصلبة (Solid-State Relay) اللي بيستخدم إلكترونيات شبه موصلة بدل أي جزء متحرك خالص.',
      en:'Traditional mechanical relays have an actual moving part (you can hear a faint click when one switches), which limits how many times it can switch before wearing out. For applications needing very fast, frequent switching, a solid-state relay is used instead — semiconductor electronics with no moving part at all.', fr:'Les relais mécaniques classiques ont une vraie pièce mobile (on entend un léger clic quand ils basculent), ce qui limite le nombre de commutations avant usure. Pour les applications qui exigent des commutations très rapides et fréquentes, on utilise plutôt un relais statique, ou solid-state relay : de l\'électronique à semi-conducteurs, sans aucune pièce mobile.', es:'Los relés mecánicos tradicionales tienen una pieza móvil real (se oye un leve clic al conmutar), lo que limita cuántas veces pueden conmutar antes de desgastarse. Para aplicaciones que necesitan conmutaciones muy rápidas y frecuentes se usa un relé de estado sólido (solid-state relay): electrónica de semiconductores sin ninguna pieza móvil.', de:'Klassische mechanische Relais haben ein echtes bewegliches Teil (beim Schalten hört man ein leises Klicken), was die Zahl der Schaltvorgänge bis zum Verschleiß begrenzt. Für Anwendungen mit sehr schnellem, häufigem Schalten nimmt man stattdessen ein Halbleiterrelais (Solid-State-Relais) – Halbleiterelektronik ganz ohne bewegliche Teile.'
    }
  }
];
