      {
        id:'computer-vision',
        name:{ar:'الرؤية الحاسوبية للفحص الصناعي', en:'Computer Vision for Industrial Inspection', fr:'Vision par ordinateur pour l\'inspection industrielle', es:'Visión artificial para inspección industrial', de:'Computer Vision für die industrielle Prüfung'},
        summary:{ar:'كشف العيوب البصرية تلقائيًا بدقة تعتمد على بيانات التدريب.', en:'Automatic visual defect detection, with accuracy tied to training data.', fr:'Détection visuelle automatique des défauts, dont la précision dépend des données d\'entraînement.', es:'Detección visual automática de defectos, con una precisión que depende de los datos de entrenamiento.', de:'Automatische visuelle Fehlererkennung – die Genauigkeit hängt von den Trainingsdaten ab.'},
        scientific:{ar:'نماذج تعلم عميق (شبكات عصبية التفافية CNN) تُدرَّب على آلاف الصور لتتعرف تلقائيًا على عيوب أو أنماط بصرية (شروخ، خدوش، عدم انتظام) في زمن قريب من الفوري.', en:'Deep learning models (convolutional neural networks) trained on thousands of images to automatically recognize visual defects or patterns — cracks, scratches, irregularities — in near real time.', fr:'Des modèles de deep learning (réseaux de neurones convolutifs), entraînés sur des milliers d\'images, reconnaissent automatiquement des défauts ou motifs visuels (fissures, rayures, irrégularités) quasiment en temps réel.', es:'Modelos de deep learning (redes neuronales convolucionales) entrenados con miles de imágenes que reconocen automáticamente defectos o patrones visuales (grietas, arañazos, irregularidades) casi en tiempo real.', de:'Deep-Learning-Modelle (Convolutional Neural Networks), trainiert mit Tausenden Bildern, erkennen automatisch visuelle Fehler oder Muster – Risse, Kratzer, Unregelmäßigkeiten – nahezu in Echtzeit.'},
        practical:{ar:'يقلل الاعتماد على الفحص البشري اليدوي، ويعمل على مدار الساعة بدون تعب، لكن دقته تعتمد بشكل مباشر على جودة وتنوع بيانات التدريب المتاحة له.', en:'Reduces reliance on manual human inspection and runs around the clock without fatigue, but its accuracy depends directly on the quality and variety of its training data.', fr:'Elle réduit la dépendance à l\'inspection manuelle et fonctionne jour et nuit sans fatigue. Mais sa précision dépend directement de la qualité et de la diversité de ses données d\'entraînement.', es:'Reduce la dependencia de la inspección manual y funciona día y noche sin cansarse, pero su precisión depende directamente de la calidad y la variedad de sus datos de entrenamiento.', de:'Sie verringert die Abhängigkeit von manueller Sichtprüfung und arbeitet rund um die Uhr ohne Ermüdung. Ihre Genauigkeit hängt aber direkt von Qualität und Vielfalt der Trainingsdaten ab.'},
        specs:[{k:{ar:'يحتاج',en:'Requires', fr:'Nécessite', es:'Requiere', de:'Benötigt'}, v:{ar:'كاميرا + وحدة معالجة',en:'Camera + processing unit', fr:'Caméra + unité de traitement', es:'Cámara + unidad de procesamiento', de:'Kamera + Recheneinheit'}}],
        illustration:'camera-eye'
      },
      {
        id:'predictive-maintenance',
        name:{ar:'الصيانة التنبؤية بالتعلم الآلي', en:'ML-based Predictive Maintenance', fr:'Maintenance prédictive par ML', es:'Mantenimiento predictivo con ML', de:'Predictive Maintenance mit ML'},
        summary:{ar:'توقع الأعطال قبل حدوثها من بيانات الحساسات.', en:'Predicting failures before they happen from sensor data.', fr:'Prévoir les pannes avant qu\'elles ne surviennent grâce aux données des capteurs.', es:'Predecir averías antes de que ocurran a partir de datos de sensores.', de:'Ausfälle anhand von Sensordaten vorhersagen, bevor sie passieren.'},
        scientific:{ar:'نماذج تعلم آلي تحلل بيانات حساسات مستمرة (اهتزاز، حرارة، تيار) من المعدات لتتعرف على أنماط تسبق الأعطال قبل حدوثها فعليًا.', en:'Machine learning models analyze continuous sensor data (vibration, heat, current) from equipment to recognize patterns that precede failures before they actually occur.', fr:'Des modèles de machine learning analysent en continu les données des capteurs d\'un équipement (vibrations, chaleur, courant) pour repérer les signes qui précèdent une panne, avant qu\'elle ne se produise réellement.', es:'Modelos de machine learning analizan datos continuos de los sensores de un equipo (vibración, calor, corriente) para reconocer los patrones que anuncian una avería antes de que llegue a producirse.', de:'Machine-Learning-Modelle werten laufend Sensordaten von Anlagen aus (Vibration, Wärme, Strom) und erkennen Muster, die einem Ausfall vorausgehen – bevor er tatsächlich eintritt.'},
        practical:{ar:'يقلل التوقف غير المخطط له وتكاليف الصيانة الطارئة، لكنه يحتاج فترة جمع بيانات كافية قبل أن تصبح تنبؤاته موثوقة.', en:'Reduces unplanned downtime and emergency maintenance costs, but needs a sufficient data-collection period before its predictions become reliable.', fr:'Elle réduit les arrêts imprévus et les coûts de maintenance d\'urgence, mais il faut une période de collecte de données suffisante avant que ses prévisions deviennent fiables.', es:'Reduce las paradas imprevistas y los costes de mantenimiento de urgencia, pero necesita un periodo suficiente de recogida de datos antes de que sus predicciones sean fiables.', de:'Sie reduziert ungeplante Stillstände und Kosten für Notreparaturen, braucht aber eine ausreichend lange Datensammelphase, bis ihre Vorhersagen zuverlässig sind.'},
        specs:[{k:{ar:'يحتاج',en:'Requires', fr:'Nécessite', es:'Requiere', de:'Benötigt'}, v:{ar:'حساسات مستمرة + سجل أعطال',en:'Continuous sensors + failure history', fr:'Capteurs en continu + historique des pannes', es:'Sensores continuos + historial de averías', de:'Kontinuierliche Sensoren + Ausfallhistorie'}}],
        illustration:'gauge-arc'
      },
      {
        id:'plc',
        name:{ar:'وحدة التحكم المنطقي القابلة للبرمجة (PLC)', en:'Programmable Logic Controller (PLC)', fr:'Automate programmable (PLC)', es:'Controlador lógico programable (PLC)', de:'Speicherprogrammierbare Steuerung (PLC)'},
        summary:{ar:'الكمبيوتر الصناعي اللي بيدير خطوط الإنتاج بموثوقية تتحمل بيئة المصنع القاسية.', en:'The industrial computer that runs production lines reliably enough to survive a harsh factory floor.', fr:'L\'ordinateur industriel qui pilote les lignes de production, assez fiable pour résister à l\'atelier le plus rude.', es:'El ordenador industrial que gobierna las líneas de producción, tan fiable que aguanta las duras condiciones de una fábrica.', de:'Der Industriecomputer, der Produktionslinien steuert – robust genug für den rauen Fabrikalltag.'},
        scientific:{ar:'الـ PLC جهاز حاسوبي مصمم خصيصًا يقرأ إشارات دخول من حساسات (زرار، حساس حرارة، حساس حركة) وينفذ منطق برمجي بسيط ومتكرر (لو كذا احصل كذا) عشان يتحكم في مخارج زي موتورات وصمامات ولمبات، وده كل ده في زمن استجابة شبه فوري وثابت.', en:'A PLC is a specialized computer that reads input signals from sensors (a button, a temperature sensor, a motion sensor) and runs simple, repetitive programmed logic (if this happens, do that) to control outputs like motors, valves, and lights — all with near-instant, consistent response time.', fr:'Un PLC (automate programmable industriel) est un ordinateur spécialisé qui lit les signaux d\'entrée des capteurs (un bouton, un capteur de température, un détecteur de mouvement) et exécute une logique programmée simple et répétitive (si ceci se produit, fais cela). Il commande ainsi des sorties comme des moteurs, des vannes ou des lampes, avec un temps de réponse quasi instantané et constant.', es:'Un PLC (controlador lógico programable) es un ordenador especializado que lee señales de entrada de sensores (un botón, un sensor de temperatura, un sensor de movimiento) y ejecuta una lógica programada sencilla y repetitiva (si pasa esto, haz aquello). Así controla salidas como motores, válvulas y luces, con un tiempo de respuesta casi instantáneo y constante.', de:'Eine PLC (speicherprogrammierbare Steuerung) ist ein spezialisierter Computer, der Eingangssignale von Sensoren liest (ein Taster, ein Temperatursensor, ein Bewegungsmelder) und eine einfache, sich wiederholende programmierte Logik ausführt (wenn dies passiert, tue das). So steuert sie Ausgänge wie Motoren, Ventile und Lampen – mit nahezu sofortiger, gleichbleibender Reaktionszeit.'},
        practical:{ar:'بعكس الكمبيوتر العادي، الـ PLC مصمم يتحمل الاهتزاز والغبار وتقلبات الحرارة والتيار لسنين طويلة من غير أي توقف، وده اللي بيخليه المعيار الفعلي في أتمتة المصانع بدل أي حل برمجي عادي.', en:'Unlike a regular computer, a PLC is built to withstand vibration, dust, and temperature and power swings for years without downtime, which is exactly why it\'s the real-world standard in factory automation rather than any ordinary software solution.', fr:'Contrairement à un ordinateur classique, un PLC est conçu pour résister pendant des années aux vibrations, à la poussière et aux variations de température et d\'alimentation, sans interruption. C\'est justement pour cela qu\'il s\'est imposé comme la norme en automatisation d\'usine, plutôt qu\'une simple solution logicielle.', es:'A diferencia de un ordenador normal, un PLC está hecho para soportar vibraciones, polvo y cambios de temperatura y de suministro eléctrico durante años sin pararse. Por eso es el estándar real en la automatización de fábricas, y no una solución de software cualquiera.', de:'Anders als ein normaler Computer ist eine PLC dafür gebaut, jahrelang Vibrationen, Staub sowie Temperatur- und Stromschwankungen ohne Ausfall zu überstehen. Genau deshalb ist sie in der Fabrikautomation der Praxisstandard – und nicht irgendeine gewöhnliche Softwarelösung.'},
        specs:[{k:{ar:'زمن الاستجابة',en:'Response time', fr:'Temps de réponse', es:'Tiempo de respuesta', de:'Reaktionszeit'}, v:{ar:'أجزاء من المللي ثانية',en:'Fractions of a millisecond', fr:'Fractions de milliseconde', es:'Fracciones de milisegundo', de:'Bruchteile einer Millisekunde'}},{k:{ar:'بيئة التشغيل',en:'Operating environment', fr:'Environnement d\'utilisation', es:'Entorno de trabajo', de:'Einsatzumgebung'}, v:{ar:'مصمم لظروف المصنع القاسية',en:'Built for harsh factory conditions', fr:'Conçu pour les conditions difficiles de l\'usine', es:'Diseñado para las duras condiciones de fábrica', de:'Für raue Fabrikbedingungen gebaut'}}],
        illustration:'plc-panel'
      }
    ]
  },
  {
    id:'computing', icon:'computing', color:'--dom-computing',
    name:{ar:'الحوسبة والبرمجة', en:'Computing & Programming', fr:'Informatique & programmation', es:'Informática y programación', de:'Computer & Programmierung'},
    tagline:{ar:'الأنظمة واللغات اللي بتشغل كل جهاز رقمي حوالينا.', en:'The systems and languages that run every digital device around us.', fr:'Les systèmes et langages qui font tourner tous les appareils numériques qui nous entourent.', es:'Los sistemas y lenguajes que hacen funcionar todos los dispositivos digitales que nos rodean.', de:'Die Systeme und Sprachen, die jedes digitale Gerät um uns herum antreiben.'},
    intro:{
      ar:'قسم جديد بيتناول الطبقة البرمجية اللي بتشغل كل الأجهزة: أنظمة التشغيل اللي بتدير العتاد، ولغات البرمجة اللي بيتكتب بيها كل برنامج وتطبيق، بشرح علمي وعملي زي باقي أقسام الموقع.',
      en:'A new section covering the software layer that runs every device: the operating systems that manage hardware, and the programming languages every program and app is written in — explained scientifically and practically like every other section on the site.', fr:'Une nouvelle rubrique consacrée à la couche logicielle de chaque appareil : les systèmes d\'exploitation qui gèrent le matériel et les langages de programmation dans lesquels sont écrits tous les programmes et applications. Le tout expliqué sous l\'angle scientifique et pratique, comme partout ailleurs sur le site.', es:'Una nueva sección sobre la capa de software que hace funcionar cada dispositivo: los sistemas operativos que gestionan el hardware y los lenguajes de programación con los que se escribe cada programa y cada app. Todo explicado desde el lado científico y práctico, como el resto del sitio.', de:'Ein neuer Bereich über die Softwareschicht, die jedes Gerät antreibt: die Betriebssysteme, die die Hardware verwalten, und die Programmiersprachen, in denen jedes Programm und jede App geschrieben ist – wissenschaftlich und praktisch erklärt wie alle anderen Bereiche der Seite.'
    },
    materials:[
      {
        id:'lang-python',
        name:{ar:'بايثون (Python)', en:'Python', fr:'Python', es:'Python', de:'Python'},
        summary:{ar:'لغة مفسَّرة سهلة القراءة، الأكثر انتشارًا في الذكاء الاصطناعي وتحليل البيانات.', en:'An easy-to-read interpreted language, the most widely used in AI and data analysis.', fr:'Un langage interprété facile à lire, le plus utilisé en IA et en analyse de données.', es:'Un lenguaje interpretado fácil de leer, el más usado en IA y análisis de datos.', de:'Eine gut lesbare interpretierte Sprache, die meistgenutzte in KI und Datenanalyse.'},
        scientific:{
          ar:'بايثون لغة مفسَّرة (Interpreted) وديناميكية النوع: الكود بيتحول لصيغة وسيطة (bytecode) وقت التشغيل وبتنفذها آلة افتراضية (CPython VM) بدل ما يتحول مباشرة لتعليمات المعالج زي اللغات المُصرَّفة، وده اللي بيديها مرونة عالية لكن سرعة تنفيذ خام أقل.',
          en:'Python is an interpreted, dynamically-typed language: code is translated into an intermediate bytecode at runtime and executed by a virtual machine (the CPython VM) instead of being compiled directly into processor instructions like compiled languages — giving it high flexibility but lower raw execution speed.', fr:'Python est un langage interprété à typage dynamique : le code est traduit à l\'exécution en un bytecode (code intermédiaire) exécuté par une machine virtuelle (la CPython VM), au lieu d\'être compilé directement en instructions processeur comme dans les langages compilés. Résultat : une grande souplesse, mais une vitesse d\'exécution brute plus faible.', es:'Python es un lenguaje interpretado y de tipado dinámico: el código se traduce en tiempo de ejecución a un bytecode (código intermedio) que ejecuta una máquina virtual (la CPython VM), en lugar de compilarse directamente a instrucciones del procesador como en los lenguajes compilados. Eso le da mucha flexibilidad, pero menos velocidad de ejecución bruta.', de:'Python ist eine interpretierte, dynamisch typisierte Sprache: Der Code wird zur Laufzeit in einen Bytecode (Zwischencode) übersetzt und von einer virtuellen Maschine (der CPython VM) ausgeführt, statt wie bei kompilierten Sprachen direkt in Prozessorbefehle übersetzt zu werden. Das macht Python sehr flexibel, aber in der reinen Ausführung langsamer.'
        },
        practical:{
          ar:'بفضل مكتباتها الضخمة (NumPy، PyTorch، Pandas) بقت اللغة شبه الرسمية للذكاء الاصطناعي وتحليل البيانات والأتمتة، ورغم إنها أبطأ من لغات زي C في التنفيذ الخام، سرعة كتابة الكود بيها بتعوض ده في أغلب التطبيقات.',
          en:'Thanks to its massive libraries (NumPy, PyTorch, Pandas) it has become the near-official language of AI, data analysis, and automation. Though it runs slower than languages like C in raw execution, its fast development speed makes up for that in most applications.', fr:'Grâce à ses immenses bibliothèques (NumPy, PyTorch, Pandas), il est devenu le langage quasi officiel de l\'IA, de l\'analyse de données et de l\'automatisation. Certes, il s\'exécute plus lentement que des langages comme le C, mais sa rapidité de développement compense largement dans la plupart des cas.', es:'Gracias a sus enormes bibliotecas (NumPy, PyTorch, Pandas), se ha convertido en el lenguaje casi oficial de la IA, el análisis de datos y la automatización. Aunque se ejecuta más despacio que lenguajes como C, lo rápido que permite desarrollar lo compensa en la mayoría de las aplicaciones.', de:'Dank riesiger Bibliotheken (NumPy, PyTorch, Pandas) ist Python zur quasi offiziellen Sprache für KI, Datenanalyse und Automatisierung geworden. In der reinen Ausführung ist es zwar langsamer als Sprachen wie C, doch die schnelle Entwicklung gleicht das in den meisten Anwendungen aus.'
        },
        specs:[
          {k:{ar:'النوع',en:'Type', fr:'Type', es:'Tipo', de:'Typ'}, v:{ar:'مفسَّرة، ديناميكية النوع',en:'Interpreted, dynamically typed', fr:'Interprété, typage dynamique', es:'Interpretado, tipado dinámico', de:'Interpretiert, dynamisch typisiert'}},
          {k:{ar:'أول ظهور',en:'First appeared', fr:'Première apparition', es:'Año de aparición', de:'Erstmals erschienen'}, v:'1991'},
          {k:{ar:'أشهر استخدام',en:'Most common use', fr:'Usage le plus courant', es:'Uso más habitual', de:'Häufigste Verwendung'}, v:{ar:'الذكاء الاصطناعي وتحليل البيانات',en:'AI and data analysis', fr:'IA et analyse de données', es:'IA y análisis de datos', de:'KI und Datenanalyse'}}
        ],
        illustration:'binary-wave',
        deeper:{
          ar:'بايثون فيها قفل داخلي اسمه Global Interpreter Lock (GIL) بيمنع أكتر من خيط تنفيذ (thread) واحد يشغّل كود بايثون فعليًا في نفس اللحظة داخل نفس العملية، وده بيحد من الاستفادة الكاملة من المعالجات متعددة الأنوية، فالمبرمجين بيلجأوا لاستخدام عمليات منفصلة (multiprocessing) بدل الخيوط لتحقيق توازي حقيقي.',
          en:'Python has an internal lock called the Global Interpreter Lock (GIL) that prevents more than one thread from actually executing Python code at the same instant within one process, limiting full use of multi-core processors — which is why developers reach for separate processes (multiprocessing) instead of threads to achieve true parallelism.', fr:'Python possède un verrou interne, le Global Interpreter Lock (GIL), qui empêche plusieurs threads d\'exécuter réellement du code Python au même instant dans un même processus. Cela limite l\'exploitation complète des processeurs multicœurs, et c\'est pourquoi les développeurs se tournent vers des processus séparés (multiprocessing) plutôt que vers des threads pour obtenir un vrai parallélisme.', es:'Python tiene un bloqueo interno llamado Global Interpreter Lock (GIL) que impide que más de un hilo ejecute realmente código Python en el mismo instante dentro de un proceso. Esto limita el aprovechamiento completo de los procesadores multinúcleo, y por eso los desarrolladores recurren a procesos separados (multiprocessing) en lugar de hilos para lograr un paralelismo real.', de:'Python hat eine interne Sperre namens Global Interpreter Lock (GIL), die verhindert, dass innerhalb eines Prozesses mehr als ein Thread gleichzeitig tatsächlich Python-Code ausführt. Das bremst die volle Nutzung von Mehrkernprozessoren – deshalb setzen Entwickler für echte Parallelität auf separate Prozesse (multiprocessing) statt auf Threads.'
        }
      },
      {
        id:'lang-c',
        name:{ar:'لغة C', en:'C', fr:'C', es:'C', de:'C'},
        summary:{ar:'تحكم مباشر وقريب من العتاد، أساس أنظمة التشغيل والأنظمة المدمجة.', en:'Direct, close-to-hardware control — the foundation of operating systems and embedded systems.', fr:'Un contrôle direct, au plus près du matériel : la base des systèmes d\'exploitation et des systèmes embarqués.', es:'Control directo y cercano al hardware: la base de los sistemas operativos y los sistemas embebidos.', de:'Direkte, hardwarenahe Kontrolle – das Fundament von Betriebssystemen und Embedded-Systemen.'},
        scientific:{
          ar:'C لغة مُصرَّفة (Compiled) بتتحول مباشرة لتعليمات معالج ثنائية قبل التشغيل، ومفيش فيها جامع قمامة تلقائي (Garbage Collector)؛ المبرمج نفسه مسؤول عن حجز الذاكرة وتحريرها يدويًا، وده بيديها سرعة وتحكم عاليين جدًا لكن بيحمّل المبرمج مسؤولية تجنب الأخطاء.',
          en:'C is a compiled language, translated directly into binary processor instructions before running, with no automatic garbage collector — the programmer is personally responsible for manually allocating and freeing memory, giving very high speed and control but placing the burden of avoiding mistakes on the programmer.', fr:'Le C est un langage compilé : il est traduit directement en instructions binaires pour le processeur avant l\'exécution, et il n\'a pas de garbage collector (ramasse-miettes qui libère automatiquement la mémoire inutilisée). C\'est au programmeur d\'allouer et de libérer lui-même la mémoire. On gagne ainsi énormément en vitesse et en contrôle, mais c\'est à lui d\'éviter les erreurs.', es:'C es un lenguaje compilado: se traduce directamente a instrucciones binarias del procesador antes de ejecutarse y no tiene garbage collector (recolector que libera automáticamente la memoria que ya no se usa). El programador se encarga en persona de reservar y liberar la memoria, lo que da muchísima velocidad y control, pero deja en sus manos la tarea de no cometer errores.', de:'C ist eine kompilierte Sprache: Sie wird vor dem Ausführen direkt in binäre Prozessorbefehle übersetzt und hat keinen Garbage Collector (automatische Freigabe nicht mehr genutzten Speichers). Die Programmiererin oder der Programmierer muss Speicher selbst anlegen und wieder freigeben – das bringt enorme Geschwindigkeit und Kontrolle, legt die Verantwortung für Fehlervermeidung aber ganz in ihre Hände.'
        },
        practical:{
          ar:'نواة نظام لينكس نفسها مكتوبة بلغة C، وكذلك أغلب برمجيات الأنظمة المدمجة والمتحكمات الدقيقة، لأن التحكم المباشر في الذاكرة والعتاد ضروري في التطبيقات اللي محتاجة أداء وموثوقية أقصى.',
          en:'The Linux kernel itself is written in C, along with most embedded systems and microcontroller software, because direct control over memory and hardware is essential in applications that need maximum performance and reliability.', fr:'Le noyau Linux lui-même est écrit en C, tout comme la plupart des systèmes embarqués et des logiciels de microcontrôleurs, car le contrôle direct de la mémoire et du matériel est indispensable dès qu\'il faut des performances et une fiabilité maximales.', es:'El propio kernel de Linux está escrito en C, igual que la mayoría de los sistemas embebidos y el software de microcontroladores, porque controlar directamente la memoria y el hardware es esencial cuando se necesita el máximo rendimiento y fiabilidad.', de:'Der Linux-Kernel selbst ist in C geschrieben, ebenso die meisten Embedded-Systeme und Mikrocontroller-Programme – denn wo maximale Leistung und Zuverlässigkeit gefragt sind, ist direkte Kontrolle über Speicher und Hardware unverzichtbar.'
        },
        specs:[
          {k:{ar:'النوع',en:'Type', fr:'Type', es:'Tipo', de:'Typ'}, v:{ar:'مُصرَّفة (Compiled)',en:'Compiled', fr:'Compilé', es:'Compilado', de:'Kompiliert'}},
          {k:{ar:'أول ظهور',en:'First appeared', fr:'Première apparition', es:'Año de aparición', de:'Erstmals erschienen'}, v:'1972'},
          {k:{ar:'أشهر استخدام',en:'Most common use', fr:'Usage le plus courant', es:'Uso más habitual', de:'Häufigste Verwendung'}, v:{ar:'أنظمة التشغيل والأنظمة المدمجة',en:'Operating systems and embedded systems', fr:'Systèmes d\'exploitation et systèmes embarqués', es:'Sistemas operativos y sistemas embebidos', de:'Betriebssysteme und Embedded-Systeme'}}
        ],
        illustration:'circuit-branch',
        deeper:{
          ar:'غياب أي فحص تلقائي لحدود الذاكرة في C هو السبب الجذري وراء ثغرة أمنية شهيرة جدًا اسمها فيضان المخزن المؤقت (Buffer Overflow)، لما برنامج يكتب بيانات أكتر من المساحة المخصصة له في الذاكرة، وده لسه لحد دلوقتي واحد من أكتر أنواع الثغرات استغلالًا في البرمجيات المكتوبة بلغات منخفضة المستوى.',
          en:'The complete absence of automatic memory-bounds checking in C is the root cause of a very famous security vulnerability called a buffer overflow, where a program writes more data than its allocated memory space — still one of the most commonly exploited vulnerability types in software written in low-level languages today.', fr:'L\'absence totale de vérification automatique des limites mémoire en C est à l\'origine d\'une faille de sécurité très célèbre, le buffer overflow (dépassement de tampon) : un programme écrit plus de données que l\'espace mémoire qui lui est alloué. C\'est encore aujourd\'hui l\'un des types de failles les plus exploités dans les logiciels écrits en langages de bas niveau.', es:'La ausencia total de comprobación automática de los límites de memoria en C es el origen de una vulnerabilidad de seguridad muy famosa, el buffer overflow (desbordamiento de búfer): un programa escribe más datos de los que caben en el espacio de memoria que se le asignó. Sigue siendo hoy uno de los tipos de vulnerabilidad más explotados en el software escrito en lenguajes de bajo nivel.', de:'Dass C Speichergrenzen überhaupt nicht automatisch prüft, ist die Wurzel einer sehr bekannten Sicherheitslücke: des Buffer Overflow (Pufferüberlauf). Dabei schreibt ein Programm mehr Daten, als in den ihm zugewiesenen Speicherbereich passen. Bis heute zählt er zu den am häufigsten ausgenutzten Schwachstellen in Software, die in hardwarenahen Sprachen geschrieben ist.'
        }
      },
      {
        id:'lang-javascript',
        name:{ar:'جافاسكريبت (JavaScript)', en:'JavaScript', fr:'JavaScript', es:'JavaScript', de:'JavaScript'},
        summary:{ar:'اللغة الوحيدة اللي بتشتغل جوه كل متصفح، أساس الويب التفاعلي.', en:'The one language that runs inside every browser — the foundation of the interactive web.', fr:'Le seul langage qui tourne dans tous les navigateurs : la base du web interactif.', es:'El único lenguaje que funciona en todos los navegadores: la base de la web interactiva.', de:'Die eine Sprache, die in jedem Browser läuft – das Fundament des interaktiven Webs.'},
        scientific:{
          ar:'جافاسكريبت لغة مفسَّرة وديناميكية النوع، بتتنفذ عن طريق محرك JIT (زي V8 في كروم) بيحوّل الكود لتعليمات معالج وقت التشغيل نفسه لتحسين الأداء. اللغة أحادية الخيط (Single-threaded) لكن بتتعامل مع العمليات البطيئة (زي طلبات الشبكة) عن طريق حلقة أحداث (Event Loop) بدل ما توقف التنفيذ كله.',
          en:'JavaScript is an interpreted, dynamically-typed language executed through a JIT engine (like V8 in Chrome) that compiles code into processor instructions at runtime for better performance. The language is single-threaded, but handles slow operations (like network requests) through an event loop instead of blocking all execution.', fr:'JavaScript est un langage interprété à typage dynamique, exécuté par un moteur JIT (compilation « juste à temps », pendant l\'exécution) comme V8 dans Chrome, qui compile le code en instructions processeur au moment de l\'exécution pour de meilleures performances. Le langage est monothread, mais il gère les opérations lentes (comme les requêtes réseau) grâce à un event loop (boucle d\'événements qui traite les tâches en attente) au lieu de bloquer toute l\'exécution.', es:'JavaScript es un lenguaje interpretado y de tipado dinámico que se ejecuta mediante un motor JIT (compilación «justo a tiempo», durante la ejecución) como V8 en Chrome, que compila el código a instrucciones del procesador en tiempo de ejecución para rendir mejor. El lenguaje es de un solo hilo, pero gestiona las operaciones lentas (como las peticiones de red) con un event loop (bucle de eventos que atiende las tareas pendientes) en lugar de bloquear toda la ejecución.', de:'JavaScript ist eine interpretierte, dynamisch typisierte Sprache, die von einer JIT-Engine (Just-in-time-Kompilierung, also während der Ausführung) wie V8 in Chrome ausgeführt wird. Diese übersetzt den Code zur Laufzeit in Prozessorbefehle, um schneller zu sein. Die Sprache ist single-threaded, bewältigt langsame Vorgänge (etwa Netzwerkanfragen) aber über einen Event Loop (Ereignisschleife, die wartende Aufgaben abarbeitet), statt die gesamte Ausführung zu blockieren.'
        },
        practical:{
          ar:'أي متصفح إنترنت بيشغّل جافاسكريبت فورًا من غير أي تثبيت، وده اللي خلاها أساس كل موقع تفاعلي، ومع ظهور Node.js بقت تُستخدم في السيرفرات كمان، فبقت اللغة الوحيدة اللي ممكن تكتب بيها الواجهة الأمامية والخلفية معًا.',
          en:'Every web browser runs JavaScript instantly with no installation, which is exactly why it underlies every interactive website, and with Node.js it now runs on servers too — making it the one language that can write both the front end and back end together.', fr:'Tous les navigateurs exécutent JavaScript instantanément, sans installation. C\'est justement pour cela qu\'il se trouve derrière chaque site web interactif, et avec Node.js il tourne désormais aussi sur les serveurs : c\'est le seul langage capable d\'écrire à la fois le front end et le back end.', es:'Todos los navegadores ejecutan JavaScript al instante y sin instalar nada, y por eso está detrás de cada web interactiva. Con Node.js ahora también funciona en servidores, lo que lo convierte en el único lenguaje capaz de escribir a la vez el front end y el back end.', de:'Jeder Webbrowser führt JavaScript sofort und ohne Installation aus – genau deshalb steckt es hinter jeder interaktiven Website. Mit Node.js läuft es inzwischen auch auf Servern und ist damit die eine Sprache, mit der sich Front End und Back End zugleich schreiben lassen.'
        },
        specs:[
          {k:{ar:'التنفيذ',en:'Execution', fr:'Exécution', es:'Ejecución', de:'Ausführung'}, v:{ar:'محرك JIT وقت التشغيل',en:'JIT engine at runtime', fr:'Moteur JIT à l\'exécution', es:'Motor JIT en tiempo de ejecución', de:'JIT-Engine zur Laufzeit'}},
          {k:{ar:'أول ظهور',en:'First appeared', fr:'Première apparition', es:'Año de aparición', de:'Erstmals erschienen'}, v:'1995'},
          {k:{ar:'بيئة التشغيل',en:'Runs in', fr:'Fonctionne dans', es:'Funciona en', de:'Läuft in'}, v:{ar:'المتصفح + السيرفر (Node.js)',en:'Browser + server (Node.js)', fr:'Navigateur + serveur (Node.js)', es:'Navegador + servidor (Node.js)', de:'Browser + Server (Node.js)'}}
        ],
        illustration:'code-brackets',
        deeper:{
          ar:'حلقة الأحداث (Event Loop) هي اللي بتفسر إزاي لغة أحادية الخيط زي جافاسكريبت بتقدر تتعامل مع آلاف الطلبات المتزامنة من غير ما تتجمد؛ أي عملية بطيئة بتتحط في طابور منفصل، ومحرك اللغة بيرجع يتفقده تاني بعد ما ينتهي من تنفيذ الكود المتزامن الحالي، بدل ما ينتظر العملية البطيئة تخلص فورًا.',
          en:'The event loop is exactly what explains how a single-threaded language like JavaScript can handle thousands of concurrent requests without freezing: any slow operation gets placed in a separate queue, and the engine circles back to check it only after finishing the currently running synchronous code, rather than waiting for the slow operation to finish immediately.', fr:'C\'est l\'event loop qui explique comment un langage monothread comme JavaScript peut gérer des milliers de requêtes simultanées sans se figer : toute opération lente est placée dans une file d\'attente séparée, et le moteur n\'y revient qu\'après avoir terminé le code synchrone en cours, au lieu d\'attendre sur-le-champ la fin de l\'opération lente.', es:'El event loop es justo lo que explica cómo un lenguaje de un solo hilo como JavaScript puede atender miles de peticiones simultáneas sin congelarse: cualquier operación lenta se coloca en una cola aparte, y el motor vuelve a revisarla solo después de terminar el código síncrono que está ejecutando, en lugar de quedarse esperando a que acabe la operación lenta.', de:'Genau der Event Loop erklärt, wie eine single-threaded Sprache wie JavaScript Tausende gleichzeitige Anfragen bewältigen kann, ohne einzufrieren: Jeder langsame Vorgang kommt in eine separate Warteschlange, und die Engine sieht erst dann wieder nach, wenn der gerade laufende synchrone Code fertig ist – statt sofort auf das Ende des langsamen Vorgangs zu warten.'
        }
      },
      {
        id:'lang-assembly',
        name:{ar:'لغة التجميع (Assembly)', en:'Assembly Language', fr:'Langage assembleur', es:'Lenguaje ensamblador', de:'Assemblersprache'},
        summary:{ar:'أقرب لغة للعتاد نفسه، كل تعليمة فيها بتقابل أمر واحد بالظبط بيفهمه المعالج.', en:'The language closest to the hardware itself — every instruction maps almost exactly to one command the processor understands.', fr:'Le langage le plus proche du matériel : chaque instruction correspond presque exactement à une commande comprise par le processeur.', es:'El lenguaje más cercano al propio hardware: cada instrucción equivale casi exactamente a una orden que entiende el procesador.', de:'Die Sprache, die der Hardware am nächsten ist – jeder Befehl entspricht fast genau einem Befehl, den der Prozessor versteht.'},
        scientific:{
          ar:'لغة التجميع مش زي أي لغة برمجة عادية بتتصرّف، كل تعليمة فيها بتقابل تعليمة واحدة فعلية بيفهمها معالج معين مباشرة، وبتتحول لصيغة ثنائية عن طريق مُجمِّع (Assembler) لا يقارن بمترجم عادي في التعقيد. كل معمارية معالج (x86 أو ARM مثلًا) ليها لغة تجميع خاصة بيها مش متوافقة مع غيرها.',
          en:'Assembly language doesn\'t behave like an ordinary programming language — each instruction maps almost directly to one actual instruction a specific processor understands, and it\'s converted into binary by an assembler, far simpler than an ordinary compiler. Every processor architecture (x86 or ARM, for example) has its own assembly language, incompatible with any other.', fr:'L\'assembleur ne se comporte pas comme un langage de programmation ordinaire : chaque instruction correspond presque directement à une véritable instruction comprise par un processeur précis. Il est converti en binaire par un assembler (le programme d\'assemblage), bien plus simple qu\'un compilateur classique. Chaque architecture de processeur (x86 ou ARM, par exemple) a son propre langage assembleur, incompatible avec les autres.', es:'El ensamblador no se comporta como un lenguaje de programación normal: cada instrucción corresponde casi directamente a una instrucción real que entiende un procesador concreto, y un assembler (el programa ensamblador), mucho más sencillo que un compilador normal, lo convierte a binario. Cada arquitectura de procesador (x86 o ARM, por ejemplo) tiene su propio lenguaje ensamblador, incompatible con los demás.', de:'Assembler verhält sich nicht wie eine gewöhnliche Programmiersprache: Jeder Befehl entspricht fast direkt einem echten Befehl, den ein bestimmter Prozessor versteht. Übersetzt wird er von einem Assembler-Programm in Binärcode – viel einfacher als ein normaler Compiler. Jede Prozessorarchitektur (etwa x86 oder ARM) hat ihre eigene Assemblersprache, die mit keiner anderen kompatibel ist.'
        },
        practical:{
          ar:'بتُستخدم في كتابة برامج الإقلاع الأولى (Bootloaders) ودرايفرات العتاد وأجزاء صغيرة جدًا وحرجة الأداء داخل برامج تانية، لكن كتابة برنامج كامل بيها نادرة جدًا حاليًا لأنها بطيئة الكتابة وغير قابلة لإعادة الاستخدام بين معماريات مختلفة.',
          en:'It\'s used to write early bootloaders, hardware drivers, and very small, performance-critical fragments inside larger programs, but writing an entire program in it is very rare today since it\'s slow to write and can\'t be reused across different processor architectures.', fr:'On l\'utilise pour écrire les tout premiers bootloaders (programmes de démarrage qui lancent le système), les pilotes matériels et de très petits fragments critiques pour les performances au sein de programmes plus vastes. En revanche, écrire tout un programme en assembleur est devenu très rare : c\'est lent à écrire et impossible à réutiliser d\'une architecture de processeur à l\'autre.', es:'Se usa para escribir los primeros bootloaders (programas de arranque que ponen en marcha el sistema), drivers de hardware y fragmentos muy pequeños y críticos para el rendimiento dentro de programas más grandes. Pero escribir un programa entero en ensamblador es muy raro hoy, porque es lento y no se puede reutilizar entre arquitecturas de procesador distintas.', de:'Man nutzt Assembler für frühe Bootloader (Startprogramme, die das System hochfahren), Hardwaretreiber und sehr kleine, leistungskritische Teile größerer Programme. Ein ganzes Programm darin zu schreiben, ist heute jedoch sehr selten – es dauert lange und lässt sich nicht auf andere Prozessorarchitekturen übertragen.'
        },
        specs:[
          {k:{ar:'المستوى',en:'Level', fr:'Niveau', es:'Nivel', de:'Ebene'}, v:{ar:'أقرب لغة للعتاد',en:'Closest language to hardware', fr:'Le langage le plus proche du matériel', es:'El lenguaje más cercano al hardware', de:'Die Sprache, die der Hardware am nächsten ist'}},
          {k:{ar:'قابلية النقل',en:'Portability', fr:'Portabilité', es:'Portabilidad', de:'Portabilität'}, v:{ar:'غير محمولة بين المعماريات',en:'Not portable across architectures', fr:'Non portable d\'une architecture à l\'autre', es:'No es portable entre arquitecturas', de:'Nicht zwischen Architekturen portierbar'}},
          {k:{ar:'أشهر استخدام',en:'Most common use', fr:'Usage le plus courant', es:'Uso más habitual', de:'Häufigste Verwendung'}, v:{ar:'Bootloaders ودرايفرات العتاد',en:'Bootloaders and hardware drivers', fr:'Bootloaders et pilotes matériels', es:'Bootloaders y controladores de hardware', de:'Bootloader und Hardwaretreiber'}}
        ],
        illustration:'semiconductor-band',
        deeper:{
          ar:'أي لغة برمجة عالية المستوى بتتحول في النهاية لتعليمات تجميع كخطوة وسيطة قبل ما تتحول لثنائي كامل، وده معناه إن فهم لغة التجميع بيديك رؤية مباشرة لما بيحصل فعليًا جوه المعالج لحظة تنفيذ أي برنامج، بغض النظر عن اللغة عالية المستوى اللي اتكتب بيها أصلًا.',
          en:'Every high-level programming language ultimately gets translated into assembly instructions as an intermediate step before becoming full binary, which means understanding assembly gives direct insight into what actually happens inside the processor the instant any program runs, regardless of the high-level language it was originally written in.', fr:'Tout langage de programmation de haut niveau finit par être traduit en instructions assembleur, une étape intermédiaire avant le code binaire final. Comprendre l\'assembleur, c\'est donc voir directement ce qui se passe dans le processeur à l\'instant où un programme s\'exécute, quel que soit le langage de haut niveau dans lequel il a été écrit.', es:'Todo lenguaje de programación de alto nivel acaba traducido a instrucciones en ensamblador, un paso intermedio antes de convertirse en binario. Por eso, entender el ensamblador te permite ver directamente lo que ocurre dentro del procesador en el instante en que se ejecuta cualquier programa, sin importar en qué lenguaje de alto nivel se escribió.', de:'Jede Hochsprache wird letztlich in Assembler-Befehle übersetzt – ein Zwischenschritt, bevor daraus reiner Binärcode wird. Wer Assembler versteht, sieht also direkt, was im Prozessor in dem Moment passiert, in dem ein Programm läuft – ganz gleich, in welcher Hochsprache es ursprünglich geschrieben wurde.'
        }
      },
      {
        id:'lang-rust',
        name:{ar:'لغة رست (Rust)', en:'Rust', fr:'Rust', es:'Rust', de:'Rust'},
        summary:{ar:'لغة حديثة بتجمع بين أداء C وأمان الذاكرة من غير جامع قمامة.', en:'A modern language combining C\'s performance with memory safety and no garbage collector.', fr:'Un langage moderne qui allie les performances du C à la sécurité mémoire, sans garbage collector.', es:'Un lenguaje moderno que combina el rendimiento de C con la seguridad de memoria, sin garbage collector.', de:'Eine moderne Sprache, die die Performance von C mit Speichersicherheit verbindet – ganz ohne Garbage Collector.'},
        scientific:{
          ar:'رست بتستخدم نظام "الملكية والاستعارة" (Ownership & Borrowing) بيتفحصه المترجم وقت التصريف نفسه، فبيمنع أخطاء ذاكرة كتيرة (زي الوصول لذاكرة اتحررت أو تسابق البيانات بين خيوط متعددة) قبل ما البرنامج يشتغل خالص، من غير الحاجة لجامع قمامة بيعمل فحص وقت التشغيل زي لغات تانية.',
          en:'Rust uses an "ownership and borrowing" system checked entirely by the compiler at compile time, preventing many memory bugs (like accessing already-freed memory or data races between threads) before the program even runs at all, without needing a garbage collector that checks at runtime like other languages.', fr:'Rust repose sur un système de « possession et d\'emprunt » (ownership and borrowing) entièrement vérifié par le compilateur au moment de la compilation. Il bloque ainsi de nombreux bugs mémoire (comme l\'accès à une mémoire déjà libérée ou les accès concurrents entre threads) avant même que le programme ne tourne, sans recourir à un garbage collector (mécanisme qui libère automatiquement la mémoire inutilisée) qui vérifie tout pendant l\'exécution, comme dans d\'autres langages.', es:'Rust usa un sistema de «propiedad y préstamo» (ownership and borrowing) que el compilador comprueba por completo en tiempo de compilación. Así evita muchos errores de memoria (como acceder a memoria ya liberada o las carreras de datos entre hilos) antes incluso de que el programa se ejecute, sin necesitar un garbage collector (mecanismo que libera automáticamente la memoria que ya no se usa) que vigile durante la ejecución, como en otros lenguajes.', de:'Rust nutzt ein System aus „Besitz und Ausleihen“ (Ownership and Borrowing), das der Compiler vollständig schon beim Kompilieren prüft. So werden viele Speicherfehler (etwa der Zugriff auf bereits freigegebenen Speicher oder Data Races zwischen Threads) verhindert, bevor das Programm überhaupt läuft – ohne einen Garbage Collector (ein Mechanismus, der ungenutzten Speicher automatisch freigibt), der wie bei anderen Sprachen zur Laufzeit kontrolliert.'
        },
        practical:{
          ar:'بقت تُستخدم بشكل متزايد في برمجة الأنظمة، وأجزاء من متصفحات زي فايرفوكس، وأنظمة تشغيل تجريبية، وبرمجيات مدمجة حساسة للأمان، لكن منحنى تعلمها أصعب من لغات تانية بسبب صرامة "فاحص الاستعارة" (Borrow Checker) اللي بيرفض أي كود مش متأكد من أمانه تمامًا.',
          en:'It\'s increasingly used for systems programming, parts of browsers like Firefox, experimental operating systems, and safety-critical embedded software, but its learning curve is steeper than other languages because of the strict "borrow checker" that rejects any code it can\'t fully guarantee is safe.', fr:'On l\'utilise de plus en plus pour la programmation système, dans certaines parties de navigateurs comme Firefox, dans des systèmes d\'exploitation expérimentaux et dans des logiciels embarqués critiques. Sa courbe d\'apprentissage est toutefois plus raide que celle d\'autres langages, à cause de son « borrow checker » (le vérificateur d\'emprunts du compilateur) très strict, qui rejette tout code dont il ne peut pas garantir entièrement la sûreté.', es:'Se usa cada vez más en programación de sistemas, en partes de navegadores como Firefox, en sistemas operativos experimentales y en software embebido crítico para la seguridad. Eso sí, su curva de aprendizaje es más empinada que la de otros lenguajes por culpa del estricto «borrow checker» (el verificador de préstamos del compilador), que rechaza cualquier código cuya seguridad no pueda garantizar por completo.', de:'Rust kommt zunehmend in der Systemprogrammierung zum Einsatz, in Teilen von Browsern wie Firefox, in experimentellen Betriebssystemen und in sicherheitskritischer Embedded-Software. Die Lernkurve ist allerdings steiler als bei anderen Sprachen – wegen des strengen „Borrow Checker“ (der Ausleih-Prüfer des Compilers), der jeden Code ablehnt, dessen Sicherheit er nicht vollständig garantieren kann.'
        },
        specs:[
          {k:{ar:'أول إصدار مستقر',en:'First stable release', fr:'Première version stable', es:'Primera versión estable', de:'Erste stabile Version'}, v:'2015'},
          {k:{ar:'أمان الذاكرة',en:'Memory safety', fr:'Sécurité mémoire', es:'Seguridad de memoria', de:'Speichersicherheit'}, v:{ar:'فحص وقت التصريف',en:'Compile-time checking', fr:'Vérification à la compilation', es:'Comprobación en tiempo de compilación', de:'Prüfung zur Compile-Zeit'}},
          {k:{ar:'أشهر استخدام',en:'Most common use', fr:'Usage le plus courant', es:'Uso más habitual', de:'Häufigste Verwendung'}, v:{ar:'برمجة الأنظمة الآمنة',en:'Safety-critical systems programming', fr:'Programmation système critique', es:'Programación de sistemas críticos', de:'Sicherheitskritische Systemprogrammierung'}}
        ],
        illustration:'shield-check',
        deeper:{
          ar:'مبدأ رست الأساسي إن كل قيمة في الذاكرة ليها "مالك" واحد بس في أي لحظة، ولما القيمة دي تتنقل لمتغير تاني الملكية بتتنقل معاها والمتغير الأصلي بيفقد حقه في استخدامها، وده اللي بيمنع بشكل بنيوي مشكلة "الوصول لذاكرة اتحررت بالفعل" من غير أي فحص وقت التشغيل خالص.',
          en:'Rust\'s core principle is that every value in memory has exactly one "owner" at any moment, and when that value moves to another variable, ownership moves with it and the original variable loses its right to use it — structurally preventing the "use-after-free" bug with zero runtime checking at all.', fr:'Le principe fondamental de Rust : chaque valeur en mémoire a exactement un seul « propriétaire » à tout instant. Quand cette valeur passe à une autre variable, la propriété la suit et la variable d\'origine perd le droit de l\'utiliser. Résultat : le bug « use-after-free » (utiliser une mémoire après l\'avoir libérée) devient structurellement impossible, sans aucune vérification pendant l\'exécution.', es:'El principio central de Rust es que cada valor en memoria tiene exactamente un «dueño» en cada momento. Cuando ese valor pasa a otra variable, la propiedad se va con él y la variable original pierde el derecho a usarlo. Así se evita de raíz el error «use-after-free» (usar memoria después de haberla liberado), sin ninguna comprobación en tiempo de ejecución.', de:'Das Grundprinzip von Rust: Jeder Wert im Speicher hat zu jedem Zeitpunkt genau einen „Besitzer“. Wird der Wert an eine andere Variable übergeben, wandert der Besitz mit, und die ursprüngliche Variable darf ihn nicht mehr verwenden. So wird der „Use-after-free“-Fehler (Speicher wird nach dem Freigeben noch benutzt) strukturell verhindert – ganz ohne Prüfungen zur Laufzeit.'
        }
      }
    ],
    compare:{
      title:{ar:'أنظمة التشغيل الرئيسية والفرق بينها', en:'The main operating systems and their differences', fr:'Les principaux systèmes d\'exploitation et leurs différences', es:'Los principales sistemas operativos y sus diferencias', de:'Die wichtigsten Betriebssysteme und ihre Unterschiede'},
      sub:{ar:'مقارنة سريعة بين أشهر أنظمة التشغيل المستخدمة على أجهزة سطح المكتب والموبايل، ونواة كل نظام ومميزاته وعيوبه.', en:'A quick comparison of the most widely used desktop and mobile operating systems — each one\'s kernel, strengths, and weaknesses.', fr:'Une comparaison rapide des systèmes d\'exploitation de bureau et mobiles les plus répandus : le noyau de chacun, ses points forts et ses points faibles.', es:'Una comparación rápida de los sistemas operativos de escritorio y móviles más usados: el kernel de cada uno, sus puntos fuertes y sus puntos débiles.', de:'Ein kurzer Vergleich der meistgenutzten Desktop- und Mobil-Betriebssysteme – mit Kernel, Stärken und Schwächen.'},
      seeAlso:['digital-analog','semiconductors'],
      items:[

    summary:{ar:'الفرق بين التيار اللي بيغير اتجاهه باستمرار والتيار اللي بيمشي في اتجاه واحد ثابت.', en:'The difference between current that keeps flipping direction and current that flows one steady way.', fr:'La différence entre un courant qui change sans cesse de sens et un courant qui circule toujours dans le même sens.', es:'La diferencia entre una corriente que cambia de sentido una y otra vez y otra que siempre fluye en la misma dirección.', de:'Der Unterschied zwischen Strom, der ständig die Richtung wechselt, und Strom, der gleichmäßig in eine Richtung fließt.'},
    scientific:{
      ar:'التيار المستمر (DC) بيتحرك في اتجاه واحد ثابت طول الوقت، زي اللي بتطلعه البطارية. التيار المتردد (AC) بيغير اتجاهه بشكل دوري ومنتظم (50 أو 60 مرة في الثانية حسب الدولة)، وده اللي بيطلع من مقابس الحائط. السبب في استخدام AC لنقل الكهربا لمسافات طويلة إن جهده سهل تغييره لأعلى أو لأقل باستخدام المحولات، وده بيقلل الفقد في الأسلاك بشكل كبير.',
      en:'Direct current (DC) flows one steady way all the time, like what a battery gives you. Alternating current (AC) flips direction regularly (50 or 60 times a second depending on the country), and that\'s what comes out of a wall socket. AC is used for long-distance power transmission because its voltage is easy to step up or down with transformers, which massively cuts losses in the wires.', fr:'Le courant continu (DC) circule en permanence dans le même sens, comme celui que fournit une pile. Le courant alternatif (AC) change régulièrement de sens (50 ou 60 fois par seconde selon les pays) : c\'est lui qui sort de vos prises murales. On utilise l\'AC pour transporter l\'électricité sur de longues distances, car sa tension s\'élève ou s\'abaisse facilement avec des transformateurs, ce qui réduit énormément les pertes dans les câbles.', es:'La corriente continua (DC) fluye siempre en la misma dirección, como la que te da una pila. La corriente alterna (AC) cambia de sentido de forma regular (50 o 60 veces por segundo según el país), y es la que sale del enchufe de la pared. La AC se usa para transportar electricidad a largas distancias porque su tensión se sube o se baja fácilmente con transformadores, lo que reduce muchísimo las pérdidas en los cables.', de:'Gleichstrom (DC) fließt ständig in dieselbe Richtung, so wie der Strom aus einer Batterie. Wechselstrom (AC) ändert regelmäßig seine Richtung (je nach Land 50- oder 60-mal pro Sekunde) – und genau der kommt aus der Steckdose. Für den Transport über weite Strecken nutzt man AC, weil sich seine Spannung mit Transformatoren leicht hoch- oder heruntersetzen lässt. Das senkt die Verluste in den Leitungen enorm.'
    },
    practical:{

      en:'Anything running on a battery or a USB port runs on DC, while any wall socket gives you AC. That\'s exactly why every charger or power adapter you plug in exists — its main job is converting the wall\'s AC into DC your device can actually use.', fr:'Tout ce qui fonctionne sur batterie ou sur un port USB utilise du DC, alors que toute prise murale fournit de l\'AC. C\'est précisément pour cela qu\'existent tous les chargeurs et adaptateurs secteur que vous branchez : leur rôle principal est de convertir l\'AC de la prise en DC utilisable par votre appareil.', es:'Todo lo que funciona con batería o con un puerto USB usa DC, mientras que cualquier enchufe de pared te da AC. Precisamente por eso existe cada cargador o adaptador que enchufas: su función principal es convertir la AC de la pared en DC que tu dispositivo pueda usar.', de:'Alles, was mit Akku oder über einen USB-Anschluss läuft, nutzt DC – jede Steckdose liefert dagegen AC. Genau deshalb gibt es all die Ladegeräte und Netzteile, die Sie einstecken: Ihre Hauptaufgabe ist es, den AC aus der Steckdose in DC umzuwandeln, den Ihr Gerät tatsächlich nutzen kann.'

      en:'The voltage number printed for AC (like 220V) is actually its RMS (root-mean-square) value, not the true peak the wave reaches — the real peak runs about 41% higher. RMS is used because it gives the same heating effect as a DC current of the same number, making it directly comparable to DC.', fr:'La tension indiquée pour l\'AC (par exemple 220V) est en réalité sa valeur RMS (valeur efficace), et non le pic réel atteint par l\'onde : ce pic est environ 41 % plus élevé. On utilise la valeur RMS parce qu\'elle produit le même effet de chauffe qu\'un courant DC de même valeur, ce qui permet de comparer directement les deux.', es:'La tensión que se indica para la AC (por ejemplo, 220V) es en realidad su valor RMS (valor eficaz), no el pico real que alcanza la onda: ese pico es alrededor de un 41 % más alto. Se usa el valor RMS porque produce el mismo efecto de calentamiento que una corriente DC del mismo valor, lo que permite compararlas directamente.', de:'Die für AC angegebene Spannung (etwa 220V) ist in Wirklichkeit der RMS-Wert (Effektivwert) und nicht der tatsächliche Spitzenwert der Welle – dieser liegt rund 41 % höher. Man verwendet RMS, weil er dieselbe Heizwirkung hat wie ein DC-Strom mit dem gleichen Zahlenwert. So lassen sich beide direkt vergleichen.'

    summary:{ar:'القوة اللي بتدفع الإلكترونات تتحرك في السلك، زي الضغط اللي بيدفع الميه في الماسورة.', en:'The push that drives electrons through a wire, like the pressure that drives water through a pipe.', fr:'La poussée qui fait avancer les électrons dans un fil, comme la pression qui pousse l\'eau dans un tuyau.', es:'El empuje que mueve los electrones por un cable, como la presión que empuja el agua por una tubería.', de:'Der Druck, der Elektronen durch einen Draht treibt – wie der Wasserdruck in einem Rohr.'},
    scientific:{
      ar:'فرق الجهد بيقيس الفرق في الطاقة الكهربية بين نقطتين، وهو اللي بيحدد قد إيه الإلكترونات هتتدفع تتحرك. من غير فرق جهد، مفيش تيار هيسري حتى لو السلك موصل ممتاز. تخيل ماسورتين ميه بنفس القطر، واحدة موصولة بخزان مرتفع والتانية بخزان منخفض، الميه هتجري أسرع في اللي من الخزان المرتفع، وده بالظبط دور فرق الجهد بالنسبة للتيار الكهربي.',
      en:'Voltage measures the difference in electrical energy between two points, and it\'s what determines how strongly electrons get pushed to move. Without a voltage difference, no current flows even through a perfect conductor. Picture two identical pipes, one connected to a high tank and one to a low tank — water rushes faster through the high-tank pipe. That\'s exactly the role voltage plays for electric current.', fr:'La tension mesure la différence d\'énergie électrique entre deux points : c\'est elle qui détermine avec quelle force les électrons sont poussés à se déplacer. Sans différence de tension, aucun courant ne circule, même dans un conducteur parfait. Imaginez deux tuyaux identiques, l\'un relié à un réservoir placé en hauteur, l\'autre à un réservoir placé en bas : l\'eau jaillit plus vite dans le tuyau du réservoir haut. C\'est exactement le rôle que joue la tension pour le courant électrique.', es:'La tensión mide la diferencia de energía eléctrica entre dos puntos, y es la que determina con cuánta fuerza se empuja a los electrones a moverse. Sin diferencia de tensión no circula corriente, ni siquiera por un conductor perfecto. Imagina dos tuberías idénticas, una conectada a un depósito alto y otra a uno bajo: el agua corre más rápido por la del depósito alto. Ese es justo el papel que cumple la tensión para la corriente eléctrica.', de:'Die Spannung misst den Unterschied der elektrischen Energie zwischen zwei Punkten und bestimmt, wie stark die Elektronen angetrieben werden. Ohne Spannungsunterschied fließt kein Strom – selbst in einem perfekten Leiter nicht. Stellen Sie sich zwei gleiche Rohre vor: Eines hängt an einem hoch gelegenen Tank, das andere an einem niedrigen. Durch das Rohr am hohen Tank schießt das Wasser schneller. Genau diese Rolle spielt die Spannung für den elektrischen Strom.'

    practical:{

      en:'Every device is built to run on a specific voltage (5V for USB, 12V for most car circuits, 220V for a wall socket in Egypt). Plugging a device into a higher voltage than it\'s rated for will usually fry it instantly.', fr:'Chaque appareil est conçu pour une tension précise (5V pour l\'USB, 12V pour la plupart des circuits automobiles, 220V pour une prise murale en Égypte). Brancher un appareil sur une tension supérieure à celle prévue le grille généralement sur le coup.', es:'Cada aparato está diseñado para funcionar con una tensión concreta (5V para USB, 12V para la mayoría de los circuitos del coche, 220V para un enchufe en Egipto). Conectarlo a una tensión mayor de la prevista suele quemarlo al instante.', de:'Jedes Gerät ist für eine bestimmte Spannung gebaut (5V bei USB, 12V bei den meisten Schaltkreisen im Auto, 220V an der Steckdose in Ägypten). Schließt man ein Gerät an eine höhere Spannung an als vorgesehen, brennt es meist sofort durch.'

      {k:{ar:'USB',en:'USB', fr:'USB', es:'USB', de:'USB'}, v:'5V'},
      {k:{ar:'دائرة سيارة نمطية',en:'Typical car circuit', fr:'Circuit automobile typique', es:'Circuito típico de coche', de:'Typischer Kfz-Stromkreis'}, v:'12V'},
      {k:{ar:'مقبس الحائط (مصر)',en:'Wall outlet (Egypt)', fr:'Prise murale (Égypte)', es:'Enchufe de pared (Egipto)', de:'Steckdose (Ägypten)'}, v:'220V'}
    ],
    illustration:'water-tower',
    deeper:{
      ar:'فرق الجهد وحده مش كافي يقولك خطورة الصدمة الكهربية، اللي بيحدد الخطر الفعلي هو مقدار التيار اللي بيمر فعليًا في جسم الإنسان، وده بيعتمد على فرق الجهد ومقاومة الجسم مع بعض (قانون أوم). عشان كده ممكن تلمس سلك بجهد عالي جدًا وميحصلش لك حاجة لو المقاومة بينك وبين الأرض عالية جدًا (زي حذاء عازل جاف)، وممكن جهد أقل بكتير يكون خطر لو المقاومة قليلة (جسم مبلول).',
      en:'Voltage alone doesn\'t tell you how dangerous a shock is — what actually matters is the current that flows through the body, which depends on both voltage and the body\'s resistance (Ohm\'s law). That\'s why you can touch a very high-voltage wire and be fine if your resistance to ground is very high (dry insulated shoes), while a much lower voltage can be dangerous if resistance is low (a wet body).', fr:'La tension seule ne dit pas à quel point un choc électrique est dangereux : ce qui compte vraiment, c\'est le courant qui traverse le corps, et celui-ci dépend à la fois de la tension et de la résistance du corps (loi d\'Ohm). Voilà pourquoi on peut toucher un fil à très haute tension sans dommage si la résistance vers le sol est très élevée (chaussures sèches et isolantes), alors qu\'une tension bien plus faible peut être dangereuse si la résistance est basse (corps mouillé).', es:'La tensión por sí sola no indica lo peligrosa que es una descarga: lo que importa de verdad es la corriente que atraviesa el cuerpo, que depende tanto de la tensión como de la resistencia del cuerpo (ley de Ohm). Por eso puedes tocar un cable de muy alta tensión sin que pase nada si tu resistencia a tierra es muy alta (zapatos secos y aislantes), mientras que una tensión mucho menor puede ser peligrosa si la resistencia es baja (cuerpo mojado).', de:'Die Spannung allein verrät nicht, wie gefährlich ein Stromschlag ist. Entscheidend ist der Strom, der durch den Körper fließt – und der hängt sowohl von der Spannung als auch vom Widerstand des Körpers ab (ohmsches Gesetz). Deshalb kann man einen Draht mit sehr hoher Spannung berühren, ohne dass etwas passiert, wenn der Widerstand zur Erde sehr hoch ist (trockene, isolierende Schuhe). Eine viel niedrigere Spannung kann dagegen gefährlich sein, wenn der Widerstand gering ist (nasser Körper).'
    }
  },
  {
    id:'resistors',
    name:{ar:'المقاومات (Resistors)', en:'Resistors', fr:'Résistances', es:'Resistencias', de:'Widerstände'},
    summary:{ar:'عنصر بسيط وظيفته الوحيدة إنه يعرقل مرور التيار بمقدار محدد ومعروف.', en:'A simple component whose only job is to hold back current by a known, fixed amount.', fr:'Un composant simple dont le seul rôle est de freiner le courant d\'une valeur connue et fixe.', es:'Un componente sencillo cuya única función es frenar la corriente en una cantidad conocida y fija.', de:'Ein einfaches Bauteil mit nur einer Aufgabe: den Strom um einen bekannten, festen Betrag zu bremsen.'},
    scientific:{
      ar:'المقاومة بتحول جزء من الطاقة الكهربية إلى حرارة عن طريق عرقلة حركة الإلكترونات داخل مادة معينة (غالبًا كربون أو سلك رفيع من سبيكة خاصة). قيمة المقاومة بتتحدد بوحدة الأوم (Ω)، وكل ما القيمة أعلى كل ما التيار المسموح بمروره أقل عند نفس فرق الجهد.',
      en:'A resistor converts part of the electrical energy into heat by impeding electron movement inside a specific material, usually carbon or a thin special-alloy wire. Resistance is measured in ohms (Ω), and the higher the value, the less current is allowed through at the same voltage.', fr:'Une résistance transforme une partie de l\'énergie électrique en chaleur en freinant le déplacement des électrons dans un matériau précis, généralement du carbone ou un fil fin en alliage spécial. La résistance se mesure en ohms (Ω) : plus la valeur est élevée, moins le courant passe à tension égale.', es:'Una resistencia convierte parte de la energía eléctrica en calor al frenar el movimiento de los electrones dentro de un material concreto, normalmente carbono o un hilo fino de una aleación especial. La resistencia se mide en ohmios (Ω), y cuanto mayor es su valor, menos corriente deja pasar con la misma tensión.', de:'Ein Widerstand wandelt einen Teil der elektrischen Energie in Wärme um, indem er die Bewegung der Elektronen in einem bestimmten Material bremst – meist Kohlenstoff oder ein dünner Draht aus einer Speziallegierung. Gemessen wird der Widerstand in Ohm (Ω): Je höher der Wert, desto weniger Strom fließt bei gleicher Spannung.'
    },
    practical:{
      ar:'من غير مقاومة، أي عنصر حساس زي الـ LED ممكن ياخد تيار أكتر بكتير من اللي يتحمله وينحرق فورًا. المقاومة بتحد التيار عند القيمة الآمنة. أغلب المقاومات بتتعرف على قيمتها من ألوان مرسومة عليها (كود الألوان)، مش لازم تقرا رقم مكتوب.',
      en:'Without a resistor, a sensitive component like an LED can draw far more current than it can handle and burn out instantly. A resistor caps the current at a safe value. Most resistors reveal their value through painted color bands (the resistor color code), not a printed number.', fr:'Sans résistance, un composant sensible comme une LED (diode électroluminescente) peut absorber bien plus de courant qu\'il ne peut en supporter et griller aussitôt. La résistance limite le courant à une valeur sûre. La plupart des résistances indiquent leur valeur par des bandes de couleur peintes (le code couleur des résistances), et non par un chiffre imprimé.', es:'Sin una resistencia, un componente delicado como un LED (diodo emisor de luz) puede absorber mucha más corriente de la que aguanta y quemarse al instante. La resistencia limita la corriente a un valor seguro. La mayoría de las resistencias muestran su valor con bandas de colores pintadas (el código de colores de resistencias), no con un número impreso.', de:'Ohne Widerstand kann ein empfindliches Bauteil wie eine LED (Leuchtdiode) weit mehr Strom ziehen, als es verträgt, und sofort durchbrennen. Der Widerstand begrenzt den Strom auf einen sicheren Wert. Die meisten Widerstände zeigen ihren Wert nicht durch eine aufgedruckte Zahl, sondern durch aufgemalte Farbringe (den Farbcode für Widerstände).'
    },
    specs:[
      {k:{ar:'الوحدة',en:'Unit', fr:'Unité', es:'Unidad', de:'Einheit'}, v:{ar:'أوم (Ω)',en:'Ohm (Ω)', fr:'Ohm (Ω)', es:'Ohmio (Ω)', de:'Ohm (Ω)'}},
      {k:{ar:'استخدام شائع',en:'Common use', fr:'Usage courant', es:'Uso habitual', de:'Typische Anwendung'}, v:{ar:'حماية LED من زيادة التيار',en:'Protecting an LED from excess current', fr:'Protéger une LED d\'un excès de courant', es:'Proteger un LED del exceso de corriente', de:'Schutz einer LED vor zu hohem Strom'}}
    ],
    illustration:'resistor-bands',
    deeper:{
      ar:'المقاومات مش دايمًا قيمة ثابتة، فيه مقاومات متغيرة اسمها potentiometer بتستخدم في أزرار التحكم بمستوى الصوت مثلًا، وفيه مقاومات بتتغير قيمتها تلقائيًا مع الضوء (LDR) أو مع الحرارة (ثرمستور)، وده بيخليها تُستخدم كحساسات بسيطة جدًا مش بس كعنصر حماية.',
      en:'Resistors aren\'t always a fixed value — a potentiometer is a variable resistor used in things like volume knobs, and some resistors change value automatically with light (an LDR) or with heat (a thermistor), which lets them double as very simple sensors, not just protective components.', fr:'Les résistances n\'ont pas toujours une valeur fixe. Un potentiomètre est une résistance variable, utilisée par exemple dans les boutons de volume. Et certaines résistances changent de valeur toutes seules avec la lumière (une LDR, ou photorésistance) ou avec la chaleur (une thermistance) : elles servent alors aussi de capteurs très simples, et pas seulement de composants de protection.', es:'Las resistencias no siempre tienen un valor fijo. Un potenciómetro es una resistencia variable que se usa, por ejemplo, en las ruedas de volumen. Y algunas resistencias cambian de valor por sí solas con la luz (una LDR, o fotorresistencia) o con el calor (un termistor), así que también sirven como sensores muy sencillos, no solo como componentes de protección.', de:'Widerstände haben nicht immer einen festen Wert. Ein Potentiometer ist ein veränderbarer Widerstand, wie er etwa in Lautstärkereglern steckt. Manche Widerstände ändern ihren Wert sogar selbstständig mit dem Licht (ein LDR, also ein Fotowiderstand) oder mit der Temperatur (ein Thermistor). Damit dienen sie auch als sehr einfache Sensoren – nicht nur als Schutzbauteile.'
    }
  },
  {
    id:'capacitors',
    name:{ar:'المكثفات (Capacitors)', en:'Capacitors', fr:'Condensateurs', es:'Condensadores', de:'Kondensatoren'},
    summary:{ar:'مخزن صغير وسريع للشحنة الكهربية، بيشحن ويفرغ في أجزاء من الثانية.', en:'A small, fast store of electrical charge that fills and empties in a fraction of a second.', fr:'Une petite réserve de charge électrique, rapide, qui se remplit et se vide en une fraction de seconde.', es:'Un pequeño y rápido almacén de carga eléctrica que se llena y se vacía en una fracción de segundo.', de:'Ein kleiner, schneller Speicher für elektrische Ladung, der sich in Sekundenbruchteilen füllt und leert.'},
    scientific:{
      ar:'المكثف بيتكون من لوحين موصلين متقابلين وبينهم مادة عازلة، وبيخزن الشحنة الكهربية على شكل مجال كهربي بين اللوحين بدل تفاعل كيميائي زي البطارية. القدرة على التخزين بتتقاس بوحدة الفاراد (F)، وعمليًا بتستخدم أجزاء منها زي الميكروفاراد.',
      en:'A capacitor is made of two facing conductive plates with an insulator between them, storing charge as an electric field between the plates rather than through a chemical reaction like a battery. Storage capacity is measured in farads (F), though practical values use fractions like microfarads.', fr:'Un condensateur se compose de deux plaques conductrices face à face, séparées par un isolant. Il stocke la charge sous forme de champ électrique entre les plaques, et non par une réaction chimique comme une batterie. Sa capacité se mesure en farads (F), mais en pratique on utilise des fractions comme le microfarad.', es:'Un condensador está formado por dos placas conductoras enfrentadas con un aislante entre ellas, y almacena la carga como un campo eléctrico entre las placas, no mediante una reacción química como una batería. Su capacidad se mide en faradios (F), aunque en la práctica se usan fracciones como el microfaradio.', de:'Ein Kondensator besteht aus zwei gegenüberliegenden leitenden Platten mit einem Isolator dazwischen. Er speichert Ladung als elektrisches Feld zwischen den Platten – nicht über eine chemische Reaktion wie eine Batterie. Die Kapazität wird in Farad (F) gemessen, in der Praxis aber meist in Bruchteilen wie Mikrofarad.'
    },
    practical:{
      ar:'المكثف بيقدر يشحن ويفرغ بسرعة كبيرة جدًا، عكس البطارية اللي بتاخد وقت أطول. عشان كده بتلاقيه في فلاش كاميرا الموبايل القديمة (تفريغ سريع لطاقة كبيرة نسبيًا في ومضة واحدة)، وفي تنعيم التيار جوه أي محول كهربائي عشان يمنع أي تذبذب مفاجئ.',
      en:'A capacitor can charge and discharge extremely fast, unlike a battery which takes longer. That\'s why you\'d find one in an old-school phone camera flash (a quick burst of relatively large energy in a single flash), and inside almost every power adapter to smooth the current and prevent sudden fluctuations.', fr:'Un condensateur se charge et se décharge extrêmement vite, contrairement à une batterie, plus lente. C\'est pour cela qu\'on en trouvait dans le flash des anciens appareils photo (une brève décharge d\'énergie relativement importante en un seul éclair), et qu\'il y en a dans presque tous les adaptateurs secteur pour lisser le courant et éviter les fluctuations brusques.', es:'Un condensador se carga y se descarga muchísimo más rápido que una batería. Por eso había uno en el flash de las cámaras antiguas (un estallido breve de energía relativamente grande en un solo destello) y lo hay en casi todos los adaptadores de corriente para suavizar la corriente y evitar fluctuaciones bruscas.', de:'Ein Kondensator lädt und entlädt sich extrem schnell – anders als eine Batterie, die dafür länger braucht. Deshalb steckte einer im Blitz älterer Kameras (ein kurzer Stoß relativ großer Energie in einem einzigen Blitz), und deshalb findet man sie in fast jedem Netzteil, wo sie den Strom glätten und plötzliche Schwankungen verhindern.'
    },
    specs:[
      {k:{ar:'الوحدة',en:'Unit', fr:'Unité', es:'Unidad', de:'Einheit'}, v:{ar:'فاراد (F)، عمليًا ميكروفاراد',en:'Farad (F), practically microfarads', fr:'Farad (F), en pratique microfarads', es:'Faradio (F), en la práctica microfaradios', de:'Farad (F), in der Praxis Mikrofarad'}},
      {k:{ar:'استخدام شائع',en:'Common use', fr:'Usage courant', es:'Uso habitual', de:'Typische Anwendung'}, v:{ar:'تنعيم التيار داخل المحولات',en:'Smoothing current inside power adapters', fr:'Lisser le courant dans les adaptateurs secteur', es:'Suavizar la corriente en los adaptadores de corriente', de:'Glätten des Stroms in Netzteilen'}}
    ],
    illustration:'capacitor-plates',
    deeper:{
      ar:'المكثفات فرق جوهري عن البطاريات في سرعة الشحن والتفريغ، وده بالظبط سبب استخدامها الحديث في بعض تطبيقات تخزين الطاقة السريعة زي مكابح القطارات أو الرافعات اللي محتاجة تفريغ طاقة كبيرة في ثانية واحدة، رغم إنها مش بتخزن طاقة كتير بقد البطارية لنفس الحجم.',
      en:'Capacitors differ fundamentally from batteries in charge/discharge speed, which is exactly why they\'re used in some modern fast energy-storage applications like train brakes or cranes that need to dump a large burst of energy in one second, even though they don\'t store nearly as much energy as a battery of the same size.', fr:'Les condensateurs se distinguent fondamentalement des batteries par leur vitesse de charge et de décharge. C\'est pour cela qu\'on les utilise dans certaines applications modernes de stockage rapide d\'énergie, comme les freins de trains ou les grues qui doivent libérer une grosse quantité d\'énergie en une seconde, même s\'ils stockent bien moins d\'énergie qu\'une batterie de même taille.', es:'Los condensadores se diferencian de las baterías sobre todo en su velocidad de carga y descarga. Por eso se usan en algunas aplicaciones modernas de almacenamiento rápido de energía, como los frenos de trenes o las grúas que necesitan soltar una gran cantidad de energía en un segundo, aunque almacenen mucha menos energía que una batería del mismo tamaño.', de:'Kondensatoren unterscheiden sich von Batterien grundlegend in der Lade- und Entladegeschwindigkeit. Genau deshalb setzt man sie in manchen modernen Anwendungen zur schnellen Energiespeicherung ein – etwa bei Zugbremsen oder Kränen, die in einer Sekunde viel Energie abgeben müssen –, obwohl sie weit weniger Energie speichern als eine gleich große Batterie.'
    }
  },
  {
    id:'ohms-law',
    name:{ar:'قانون أوم', en:'Ohm\'s Law', fr:'Loi d\'Ohm', es:'Ley de Ohm', de:'Ohmsches Gesetz'},
    summary:{ar:'المعادلة البسيطة اللي بتربط الجهد والتيار والمقاومة ببعض في أي دائرة كهربية.', en:'The simple equation tying voltage, current, and resistance together in any circuit.', fr:'L\'équation simple qui relie tension, courant et résistance dans n\'importe quel circuit.', es:'La sencilla ecuación que une tensión, corriente y resistencia en cualquier circuito.', de:'Die einfache Gleichung, die Spannung, Strom und Widerstand in jedem Stromkreis verbindet.'},
    scientific:{
      ar:'قانون أوم بينص على إن فرق الجهد (V) بيساوي التيار (I) مضروبًا في المقاومة (R)، يعني V = I × R. المعادلة دي بتوصف علاقة أساسية: كل ما المقاومة زادت عند نفس الجهد، التيار المار بيقل، وكل ما الجهد زاد عند نفس المقاومة، التيار بيزيد.',
      en:'Ohm\'s law states that voltage (V) equals current (I) multiplied by resistance (R): V = I × R. This equation describes a basic relationship: the higher the resistance at a fixed voltage, the lower the current, and the higher the voltage at a fixed resistance, the higher the current.', fr:'La loi d\'Ohm dit que la tension (V) est égale au courant (I) multiplié par la résistance (R) : V = I × R. Cette équation décrit une relation de base : à tension fixe, plus la résistance est élevée, plus le courant est faible ; à résistance fixe, plus la tension est élevée, plus le courant est fort.', es:'La ley de Ohm dice que la tensión (V) es igual a la corriente (I) multiplicada por la resistencia (R): V = I × R. Esta ecuación describe una relación básica: con una tensión fija, cuanto mayor es la resistencia, menor es la corriente; y con una resistencia fija, cuanto mayor es la tensión, mayor es la corriente.', de:'Das ohmsche Gesetz besagt: Die Spannung (V) ist gleich Strom (I) mal Widerstand (R), also V = I × R. Die Gleichung beschreibt einen grundlegenden Zusammenhang: Bei fester Spannung sinkt der Strom, je höher der Widerstand ist – und bei festem Widerstand steigt der Strom mit der Spannung.'
    },
    practical:{
      ar:'أي مهندس أو هاوي كهربا بيستخدم قانون أوم يوميًا عشان يحسب حجم المقاومة المطلوبة لحماية عنصر معين، أو يتوقع قد إيه تيار هيسري في دائرة قبل ما يبنيها فعليًا، وده بيمنع حرق مكونات غالية بسبب حسبة غلط.',
      en:'Any engineer or electronics hobbyist uses Ohm\'s law daily to calculate the resistor value needed to protect a component, or to predict how much current will flow in a circuit before actually building it — preventing expensive components from burning out over a bad calculation.', fr:'Tout ingénieur ou passionné d\'électronique utilise la loi d\'Ohm au quotidien pour calculer la résistance nécessaire à la protection d\'un composant, ou pour prévoir le courant qui circulera dans un circuit avant même de le construire. De quoi éviter de griller des composants coûteux à cause d\'un mauvais calcul.', es:'Cualquier ingeniero o aficionado a la electrónica usa la ley de Ohm a diario para calcular la resistencia que necesita para proteger un componente, o para predecir cuánta corriente circulará por un circuito antes de montarlo. Así evita quemar componentes caros por un mal cálculo.', de:'Ob Ingenieur oder Elektronik-Bastler: Das ohmsche Gesetz ist tägliches Werkzeug, um den passenden Widerstand zum Schutz eines Bauteils zu berechnen oder vorherzusagen, wie viel Strom in einer Schaltung fließen wird, bevor man sie aufbaut. So brennen teure Bauteile nicht wegen einer falschen Rechnung durch.'
    },
    specs:[
      {k:{ar:'المعادلة',en:'Equation', fr:'Équation', es:'Ecuación', de:'Gleichung'}, v:'V = I × R'},
      {k:{ar:'وحدة الجهد',en:'Voltage unit', fr:'Unité de tension', es:'Unidad de tensión', de:'Einheit der Spannung'}, v:{ar:'فولت (V)',en:'Volt (V)', fr:'Volt (V)', es:'Voltio (V)', de:'Volt (V)'}},
      {k:{ar:'وحدة التيار',en:'Current unit', fr:'Unité de courant', es:'Unidad de corriente', de:'Einheit des Stroms'}, v:{ar:'أمبير (A)',en:'Ampere (A)', fr:'Ampère (A)', es:'Amperio (A)', de:'Ampere (A)'}}
    ],
    illustration:'ohm-triangle',
    deeper:{
      ar:'مثلث أوم أداة بصرية بسيطة بتساعدك تتذكر ترتيب القسمة الصح: لو غطيت الكمية اللي عايز تحسبها، الباقي بيوريك تضرب ولا تقسم. مثلًا لو غطيت I، هتلاقي V فوق R يعني I = V ÷ R، ولو غطيت V هتلاقي I جنب R يعني V = I × R.',
      en:'The "Ohm\'s triangle" is a simple visual trick for remembering the right division order: cover the quantity you want to find, and what\'s left shows whether to multiply or divide. Cover I, and V sits over R, meaning I = V ÷ R; cover V, and I sits beside R, meaning V = I × R.', fr:'Le « triangle d\'Ohm » est une astuce visuelle simple pour se souvenir de l\'ordre des opérations : cachez la grandeur que vous cherchez, et ce qui reste vous indique s\'il faut multiplier ou diviser. Cachez I : V se trouve au-dessus de R, donc I = V ÷ R. Cachez V : I est à côté de R, donc V = I × R.', es:'El «triángulo de Ohm» es un truco visual sencillo para recordar cómo despejar: tapa la magnitud que quieres hallar y lo que queda te dice si hay que multiplicar o dividir. Si tapas I, V queda sobre R, así que I = V ÷ R; si tapas V, I queda junto a R, así que V = I × R.', de:'Das „Ohm-Dreieck“ ist ein einfacher visueller Trick, um sich die richtige Rechenart zu merken: Decken Sie die gesuchte Größe ab – was übrig bleibt, zeigt, ob multipliziert oder geteilt wird. Decken Sie I ab, steht V über R, also I = V ÷ R. Decken Sie V ab, steht I neben R, also V = I × R.'
    }
  },
  {
    id:'power-watts',
    name:{ar:'القدرة الكهربية (الواط)', en:'Electrical Power (Watts)', fr:'Puissance électrique (watts)', es:'Potencia eléctrica (vatios)', de:'Elektrische Leistung (Watt)'},
    summary:{ar:'مقياس معدل استهلاك أو إنتاج الطاقة الكهربية في لحظة معينة.', en:'A measure of how fast electrical energy is being used or produced at a given instant.', fr:'Une mesure de la vitesse à laquelle l\'énergie électrique est consommée ou produite à un instant donné.', es:'Una medida de lo rápido que se consume o se produce la energía eléctrica en un instante dado.', de:'Ein Maß dafür, wie schnell elektrische Energie in einem bestimmten Moment verbraucht oder erzeugt wird.'},
    scientific:{
      ar:'القدرة (P) بتساوي الجهد مضروبًا في التيار: P = V × I، وبتتقاس بالواط (W). القدرة مش نفسها الطاقة: القدرة هي معدل استهلاك الطاقة لحظيًا، بينما الطاقة (اللي بتتحسب بالكيلوواط ساعة في فاتورة الكهرباء) هي القدرة مضروبة في الزمن.',
      en:'Power (P) equals voltage times current: P = V × I, measured in watts (W). Power is not the same as energy: power is the instantaneous rate of energy use, while energy (billed in kilowatt-hours on an electricity bill) is power multiplied by time.', fr:'La puissance (P) est égale à la tension multipliée par le courant : P = V × I, mesurée en watts (W). Puissance et énergie ne sont pas la même chose : la puissance est le rythme instantané de consommation d\'énergie, tandis que l\'énergie (facturée en kilowattheures sur votre facture d\'électricité) correspond à la puissance multipliée par le temps.', es:'La potencia (P) es igual a la tensión por la corriente: P = V × I, y se mide en vatios (W). Potencia y energía no son lo mismo: la potencia es el ritmo instantáneo de consumo de energía, mientras que la energía (la que te cobran en kilovatios hora en la factura de la luz) es la potencia multiplicada por el tiempo.', de:'Leistung (P) ist Spannung mal Strom: P = V × I, gemessen in Watt (W). Leistung ist aber nicht dasselbe wie Energie: Die Leistung ist die momentane Rate des Energieverbrauchs, die Energie (auf der Stromrechnung in Kilowattstunden abgerechnet) dagegen Leistung mal Zeit.'
    },
    practical:{
      ar:'لمبة 100 واط شغالة ساعة بتستهلك 100 وات-ساعة من الطاقة، ولو اشتغلت 10 ساعات كل يوم لمدة شهر، هتستهلك حوالي 30 كيلوواط ساعة، وده الرقم اللي شركة الكهرباء فعليًا بتحاسبك عليه، مش قدرة الجهاز نفسها.',
      en:'A 100-watt lamp running for one hour consumes 100 watt-hours of energy, and if it runs 10 hours a day for a month, that\'s about 30 kilowatt-hours — the number your electricity company actually bills you for, not the device\'s power rating itself.', fr:'Une lampe de 100 watts allumée pendant une heure consomme 100 wattheures d\'énergie. Si elle fonctionne 10 heures par jour pendant un mois, cela fait environ 30 kilowattheures : c\'est ce chiffre que votre fournisseur d\'électricité vous facture, et non la puissance nominale de l\'appareil.', es:'Una bombilla de 100 vatios encendida una hora consume 100 vatios hora de energía, y si funciona 10 horas al día durante un mes, son unos 30 kilovatios hora: esa es la cifra que te cobra de verdad la compañía eléctrica, no la potencia del aparato.', de:'Eine 100-Watt-Lampe, die eine Stunde brennt, verbraucht 100 Wattstunden Energie. Läuft sie einen Monat lang 10 Stunden täglich, sind das etwa 30 Kilowattstunden – genau diese Zahl stellt Ihnen der Stromanbieter in Rechnung, nicht die Nennleistung des Geräts.'
    },
    specs:[
      {k:{ar:'المعادلة',en:'Equation', fr:'Équation', es:'Ecuación', de:'Gleichung'}, v:'P = V × I'},
